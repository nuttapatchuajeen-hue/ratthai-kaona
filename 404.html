<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, follow" />
<title>404 — ไม่พบหน้านี้ · รัฐไทยก้าวหน้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400&family=Sarabun:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-deep:#020508; --bg-dark:#070D14;
  --accent-cyan:#00E5FF;
  --text-primary:#DCE8F0; --text-muted:#7E97A8;
  --font-display:'Bebas Neue','Prompt',sans-serif;
  --font-sub:'Rajdhani','Sarabun',sans-serif;
  --font-mono:'IBM Plex Mono','Sarabun',monospace;
  --font-th:'Sarabun','Rajdhani',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg-deep); color:var(--text-primary);
  font-family:var(--font-th);
  display:grid; place-items:center;
  padding:2rem 1.25rem; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── ฉากหลัง: เรืองแสง + เส้นกริด ── */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(60% 45% at 50% 34%, rgba(0,229,255,.10), transparent 70%);
}
.bg::after{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg,  rgba(126,151,168,.07) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(90deg, rgba(126,151,168,.07) 0 1px, transparent 1px 64px);
  -webkit-mask-image:radial-gradient(75% 60% at 50% 42%, #000 25%, transparent 78%);
          mask-image:radial-gradient(75% 60% at 50% 42%, #000 25%, transparent 78%);
}

main{position:relative;z-index:1;width:100%;max-width:760px;text-align:center}

/* ── แบรนด์ ── */
.brand{
  display:inline-flex;align-items:center;gap:.55rem;
  font-family:var(--font-mono);font-size:.68rem;letter-spacing:.26em;
  text-transform:uppercase;color:var(--text-muted);
  margin-bottom:1.6rem;
}
.brand img{width:20px;height:20px;object-fit:contain;opacity:.85}

/* ── เลข 404 โครเมียม ── */
.code{
  font-family:var(--font-display);
  font-size:clamp(6.5rem,27vw,15rem);
  line-height:.82; letter-spacing:.05em; font-weight:400;
  background-image:linear-gradient(180deg,
    #ffffff 0%, #d8e9f3 14%, #9db4c3 30%, #46596a 46%,
    #7d95a6 56%, #eaf6fc 74%, #91a9b9 88%, #48596a 100%);
  background-size:100% 260%; background-position:50% 22%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 10px 30px rgba(0,229,255,.14));
}
@keyframes chrome{from{background-position:50% 6%}to{background-position:50% 94%}}

.msg{
  margin:1.1rem auto 0; max-width:34ch;
  font-size:clamp(.98rem,2.4vw,1.12rem); line-height:1.85; color:var(--text-muted);
}
.msg b{color:var(--accent-cyan);font-weight:600}

.path{
  display:inline-block; max-width:100%; margin-top:1.15rem;
  padding:.42rem .85rem; border:1px solid rgba(126,151,168,.22);
  border-radius:6px; background:rgba(7,13,20,.7);
  font-family:var(--font-mono); font-size:.74rem; color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:ltr;
}

/* ── "คุณอาจกำลังหาหน้านี้" ── */
#guess{display:none;margin:1.7rem auto 0;max-width:460px}
#guess.on{display:block;animation:rise .5s ease both}
.guess-lb{
  font-family:var(--font-mono);font-size:.62rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:.6rem
}
.guess-card{
  display:flex;align-items:center;gap:.85rem;
  padding:.85rem 1rem;text-decoration:none;text-align:left;
  border:1px solid rgba(0,229,255,.3); border-radius:10px;
  background:linear-gradient(135deg,rgba(0,229,255,.09),rgba(7,13,20,.55));
  transition:border-color .22s, transform .22s, box-shadow .22s;
}
.guess-card:hover{border-color:var(--accent-cyan);transform:translateY(-2px);
  box-shadow:0 10px 26px rgba(0,229,255,.14)}
.guess-ico{font-size:1.2rem;line-height:1;flex:none}
.guess-tx{min-width:0;flex:1}
.guess-tt{display:block;color:var(--text-primary);font-weight:600;font-size:.95rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guess-sb{display:block;color:var(--text-muted);font-family:var(--font-mono);font-size:.68rem;margin-top:.2rem}
.guess-ar{color:var(--accent-cyan);font-size:1.05rem;flex:none}

/* ── ปุ่มคู่ ── */
.acts{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:2.1rem}
.btn{
  display:inline-flex;align-items:center;gap:.55rem;
  padding:.85rem 1.9rem;text-decoration:none;
  border-radius:8px;border:1px solid transparent;transition:all .22s;
}
.btn .lb{font-family:var(--font-th);font-size:.9rem;font-weight:600;letter-spacing:.01em}
.btn-primary{background:var(--accent-cyan);color:var(--bg-deep)}
.btn-primary:hover{background:#fff;box-shadow:0 8px 24px rgba(0,229,255,.28);transform:translateY(-2px)}
.btn-ghost{background:rgba(7,13,20,.7);color:var(--text-primary);border-color:rgba(126,151,168,.3)}
.btn-ghost:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);transform:translateY(-2px)}

/* ── ชิปหมวด ── */
.secs{margin-top:2.6rem;padding-top:1.7rem;border-top:1px solid rgba(126,151,168,.14)}
.secs-lb{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
.chip{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.45rem .9rem;border-radius:999px;text-decoration:none;
  border:1px solid rgba(126,151,168,.2);background:rgba(7,13,20,.6);
  color:var(--text-muted);font-size:.85rem;transition:all .2s;
}
.chip:hover{border-color:var(--accent-cyan);color:var(--accent-cyan);background:rgba(0,229,255,.07)}
.chip i{font-style:normal;opacity:.85}

#back{
  display:none;margin-top:1.5rem;background:none;border:0;cursor:pointer;
  font-family:var(--font-th);font-size:.84rem;color:var(--text-muted);
  text-decoration:underline;text-underline-offset:4px;transition:color .2s;
}
#back:hover{color:var(--accent-cyan)}
#back.on{display:inline-block}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main > *{animation:rise .55s ease both}
.code{animation:rise .6s ease both, chrome 8s ease-in-out 1s infinite alternate}
.msg{animation-delay:.06s}
.path{animation-delay:.1s}
.acts{animation-delay:.16s}
.secs{animation-delay:.22s}

@media (max-width:520px){
  .btn{flex:1 1 100%;justify-content:center}
  .secs{margin-top:2rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .code{background-position:50% 22%}
}
</style>
  <script src="js/icons.js"></script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main>
  <div class="brand"><img id="logo" alt="" aria-hidden="true" />รัฐไทยก้าวหน้า</div>

  <h1 class="code">404</h1>

  <p class="msg">หน้าที่คุณกำลังหา <b>อาจ</b> ถูกย้าย เปลี่ยนชื่อ หรือไม่เคยมีอยู่จริง</p>

  <div class="path" id="path"></div>

  <div id="guess">
    <div class="guess-lb">คุณอาจกำลังหาหน้านี้</div>
    <a class="guess-card" id="guess-link" href="#">
      <span class="guess-ico" id="guess-ico"><svg class="mdico"><use href="#i-file-text"></use></svg></span>
      <span class="guess-tx">
        <span class="guess-tt" id="guess-tt"></span>
        <span class="guess-sb" id="guess-sb"></span>
      </span>
      <span class="guess-ar" aria-hidden="true">→</span>
    </a>
  </div>

  <div class="acts">
    <a class="btn btn-primary" id="go-home" href="#"><span aria-hidden="true"><svg class="mdico"><use href="#i-house"></use></svg></span><span class="lb">กลับหน้าหลัก</span></a>
    <a class="btn btn-ghost" id="go-explore" href="#"><span aria-hidden="true"><svg class="mdico"><use href="#i-compass"></use></svg></span><span class="lb">สำรวจข้อมูล</span></a>
  </div>

  <nav class="secs" aria-label="หมวดหลัก">
    <div class="secs-lb">หรือไปที่หมวดอื่น</div>
    <div class="chips" id="chips"></div>
  </nav>

  <button id="back" type="button">← ย้อนกลับหน้าก่อนหน้า</button>
</main>

<script>
(function () {
  /* ── 1) หา base path: GitHub Pages = /ratthai-kaona/ · Netlify/เครื่องตัวเอง = / ── */
  var host = location.hostname, raw = location.pathname, base = '/';
  if (/\.github\.io$/i.test(host)) {
    var seg = raw.split('/')[1];
    if (seg) base = '/' + seg + '/';
  }
  var U = function (p) { return base + p; };

  /* ── 2) รายชื่อหน้าจริงทั้งหมดในเว็บ
         ⚠️ เพิ่มหน้าใหม่ในเว็บเมื่อไหร่ อย่าลืมเติมบรรทัดที่นี่ด้วย
            ไม่งั้นตัวเดา "คุณอาจกำลังหาหน้านี้" จะไม่รู้จักหน้านั้น ── */
  var PAGES = [
    { p:'hub/index.html',           t:'หน้าแรก · รัฐไทยก้าวหน้า',              i:'<svg class="mdico"><use href="#i-landmark"></use></svg>' },
    { p:'hub/about.html',           t:'เกี่ยวกับเรา',                          i:'<svg class="mdico"><use href="#i-user"></use></svg>' },
    { p:'hub/survey.html',          t:'แบบประเมินความพึงพอใจ',                 i:'<svg class="mdico"><use href="#i-pencil"></use></svg>' },
    { p:'hub/video.html',           t:'วิดีโอ เทคโนโลยีภาครัฐ',                i:'<svg class="mdico"><use href="#i-clapperboard"></use></svg>' },
    { p:'structure.html',           t:'โครงสร้างหน่วยงานรัฐไทย',               i:'<svg class="mdico"><use href="#i-folder-open"></use></svg>' },
    { p:'election/index.html',      t:'รายเขต · ว่าที่ ส.ส. 500',              i:'<svg class="mdico"><use href="#i-vote"></use></svg>' },
    { p:'election/standings.html',  t:'คะแนนพรรค · ว่าที่ ส.ส. 500',           i:'<svg class="mdico"><use href="#i-chart-column"></use></svg>' },
    { p:'election/partylist.html',  t:'บัญชีรายชื่อ · ว่าที่ ส.ส. 500',        i:'<svg class="mdico"><use href="#i-clipboard-list"></use></svg>' },
    { p:'election/parliament.html', t:'รัฐสภา · ส.ส. 500 + สว. 200',           i:'<svg class="mdico"><use href="#i-landmark"></use></svg>' },
    { p:'election/committees.html', t:'คณะกรรมาธิการ สภาผู้แทนราษฎร ชุดที่ 27', i:'<svg class="mdico"><use href="#i-scale"></use></svg>' },
    { p:'election/referendum.html', t:'ประชามติรัฐธรรมนูญ 2569',               i:'<svg class="mdico"><use href="#i-circle-check"></use></svg>' },
    { p:'election/bangkok.html',    t:'เลือกตั้ง กทม. 2569 · ผู้ว่าฯ + ส.ก.',  i:'<svg class="mdico"><use href="#i-building-2"></use></svg>' },
    { p:'election/timeline.html',   t:'ไทม์ไลน์ประวัติการเลือกตั้ง 2476–2569',  i:'<svg class="mdico"><use href="#i-clock"></use></svg>' },
    { p:'cabinet/index.html',       t:'ชุดคณะรัฐมนตรี · รัฐบาลอนุทิน',         i:'<svg class="mdico"><use href="#i-crown"></use></svg>' },
    { p:'stats/index.html',         t:'สถิติข้อมูลรัฐและข่าว',                 i:'<svg class="mdico"><use href="#i-trending-up"></use></svg>' },
    { p:'stats/explore.html',       t:'ศูนย์ข้อมูลโลก & สิ่งแวดล้อม',          i:'<svg class="mdico"><use href="#i-globe"></use></svg>' },
    { p:'stats/bkk-city.html',      t:'กรุงเทพฯ รายเขต บนแผนที่เมือง',         i:'<svg class="mdico"><use href="#i-map"></use></svg>' }
  ];

  /* ── 3) เดินสายลิงก์คงที่ (ต้องเป็น absolute เพราะ 404 ถูกเสิร์ฟจาก URL ระดับไหนก็ได้) ── */
  document.getElementById('logo').src        = U('hub/images/logo.png');
  document.getElementById('go-home').href    = U('hub/index.html');
  document.getElementById('go-explore').href = U('stats/explore.html');
  var fav = document.createElement('link');
  fav.rel = 'icon'; fav.href = U('hub/images/logo.png');
  document.head.appendChild(fav);

  /* ── 4) ชิปหมวดหลัก ── */
  var SECS = [
    ['structure.html',          'แผนผังโครงสร้าง',    '<svg class="mdico"><use href="#i-folder-open"></use></svg>'],
    ['election/index.html',     'ส.ส. 500',           '<svg class="mdico"><use href="#i-vote"></use></svg>'],
    ['cabinet/index.html',      'ชุดคณะรัฐมนตรี',      '<svg class="mdico"><use href="#i-crown"></use></svg>'],
    ['stats/index.html',        'ข้อมูลสถิติ',         '<svg class="mdico"><use href="#i-trending-up"></use></svg>'],
    ['election/bangkok.html',   'เลือกตั้ง กทม.',      '<svg class="mdico"><use href="#i-building-2"></use></svg>'],
    ['election/timeline.html',  'ประวัติการเลือกตั้ง', '<svg class="mdico"><use href="#i-clock"></use></svg>'],
    ['hub/about.html',          'เกี่ยวกับเรา',        '<svg class="mdico"><use href="#i-user"></use></svg>']
  ];
  var chips = document.getElementById('chips');
  SECS.forEach(function (s) {
    var a = document.createElement('a');
    a.className = 'chip';
    a.href = U(s[0]);
    a.innerHTML = '<i>' + s[2] + '</i>';
    a.appendChild(document.createTextNode(s[1]));
    chips.appendChild(a);
  });

  /* ── 5) โชว์ path ที่หาไม่เจอ ── */
  var asked = raw;
  try { asked = decodeURIComponent(raw); } catch (e) {}
  var shown = asked.length > 78 ? asked.slice(0, 75) + '…' : asked;
  document.getElementById('path').textContent = shown + location.search;

  /* ── 6) เดาหน้าที่ใกล้เคียงที่สุด (Dice bigram similarity) ── */
  function grams(s) {
    s = String(s).toLowerCase().replace(/[^a-z0-9฀-๿]/g, '');
    var g = [];
    for (var i = 0; i < s.length - 1; i++) g.push(s.substr(i, 2));
    return g;
  }
  function dice(a, b) {
    var A = grams(a), B0 = grams(b), B = B0.slice(), hit = 0;
    if (!A.length || !B0.length) return 0;
    for (var i = 0; i < A.length; i++) {
      var j = B.indexOf(A[i]);
      if (j > -1) { hit++; B.splice(j, 1); }
    }
    return 2 * hit / (A.length + B0.length);
  }

  var q = asked.slice(base.length).replace(/\.html?$/i, '').replace(/\/+$/, '');
  var best = null, bestScore = 0;
  if (q) {
    var qLow = q.toLowerCase(), qLast = q.split('/').pop();
    PAGES.forEach(function (pg) {
      var key  = pg.p.replace(/\.html$/, '');
      var last = key.split('/').pop();
      /* ถ่วงน้ำหนัก: ห้ามใช้ค่าสูงสุดเฉย ๆ ไม่งั้นชื่อไฟล์ยอดฮิตอย่าง index.html
         จะได้ 1.00 เท่ากันหมดทุกโฟลเดอร์ แล้วตัวแรกในลิสต์ชนะไปดื้อ ๆ */
      var sc = 0.6 * Math.max(dice(q, key), dice(q, pg.t)) + 0.4 * dice(qLast, last);
      /* พิมพ์โฟลเดอร์ถูกอยู่แล้ว = ให้แต้มพิเศษ */
      var dir = pg.p.indexOf('/') > -1 ? pg.p.split('/')[0] : '';
      if (dir && qLow.indexOf(dir) === 0) sc += 0.18;
      if (sc > bestScore) { bestScore = sc; best = pg; }
    });
  }
  if (best && bestScore >= 0.40) {
    document.getElementById('guess-link').href       = U(best.p);
    document.getElementById('guess-ico').textContent = best.i;
    document.getElementById('guess-tt').textContent  = best.t;
    document.getElementById('guess-sb').textContent  = base + best.p;
    document.getElementById('guess').className       = 'on';
  }

  /* ── 7) ปุ่มย้อนกลับ (โผล่เฉพาะตอนมีประวัติจริง) ── */
  var back = document.getElementById('back');
  if (history.length > 1) {
    back.className = 'on';
    back.addEventListener('click', function () { history.back(); });
  }
})();
</script>
</body>
</html>
