<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var k='md-theme',t=localStorage.getItem(k);if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>เลือกตั้ง กทม. 2569 · ผู้ว่าฯ + ส.ก. 50 เขต · แผนที่ผลคะแนน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../css/bb8-toggle.css">
<style>
/* ===== BANGKOK ELECTION PAGE ===== */
.pwrap{max-width:1190px;margin:0 auto;padding:84px 20px 96px}
@media(max-width:860px){.pwrap{padding:16px 12px 110px}}

.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.phead .pico{width:46px;height:46px;flex:0 0 auto}
.phead .bt{font-family:'Kanit';font-weight:600;font-size:1.25rem;line-height:1.1}
.phead .bt small{display:block;font-family:'Sarabun';font-weight:400;font-size:.74rem;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow)}
.tabs button{font-family:'Kanit';font-weight:500;font-size:.9rem;color:var(--ink-2);background:none;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.tabs button:hover{background:var(--orange-soft);color:var(--orange-deep)}
.tabs button.active{background:var(--ink);color:var(--paper)}
.tabs button b{font-family:'Kanit';font-weight:700}
@media(max-width:860px){
  .phead .bt{font-size:1.05rem}
  .tabs{margin-left:0;width:100%;justify-content:stretch;flex-wrap:wrap}
  .tabs button{flex:1 1 28%;justify-content:center;padding:8px 6px;font-size:.82rem}
}

.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
@media(max-width:980px){.pgrid{grid-template-columns:1fr}}

/* map card */
.chamber{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.chamber-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 18px 2px}
.chamber-head .cn{font-family:'Kanit';font-weight:600;font-size:1.02rem}
.chamber-head .cm{font-size:.78rem;color:var(--muted)}
.phint{display:flex;align-items:center;gap:6px;padding:6px 18px 0;font-size:.72rem;color:var(--muted)}
.phint svg{flex:0 0 auto;color:var(--orange-deep)}

.mapwrap{position:relative;padding:6px 10px 2px}
#bkkmap{width:100%;height:auto;display:block;max-height:70vh;touch-action:pan-y}
/* non-scaling-stroke: เส้นขอบวัดเป็นพิกเซลจอ ซูมลึกแค่ไหนก็บางเท่าเดิม */
.khet{cursor:pointer;stroke:rgba(255,255,255,.7);stroke-width:1;vector-effect:non-scaling-stroke;transition:opacity .14s,stroke-width .12s;stroke-linejoin:round}
.khet:hover{stroke:var(--ink);stroke-width:2}
.khet.sel{stroke:var(--ink);stroke-width:2.6}
#bkkmap.zoomed{touch-action:none;cursor:grab}   /* ซูมเข้าแล้วนิ้วใช้ลากแพนแทนเลื่อนหน้า */
#bkkmap.mz-drag{cursor:grabbing}
.khet.dim{opacity:.15}
html[data-theme="dark"] .khet{stroke:rgba(6,14,22,.55)}
.klabel{font-family:'Kanit';font-weight:600;fill:#fff;stroke:rgba(6,18,28,.72);stroke-width:2.4;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;pointer-events:none;opacity:0}
.klabel.show{opacity:1}

/* map overlay badge (governor sweep) */
.mapbadge{position:absolute;left:16px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 13px;box-shadow:var(--shadow-lg)}
.mapbadge .mv{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'Kanit';font-weight:700;font-size:.86rem;flex:0 0 auto;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px currentColor}
.mapbadge .mt{line-height:1.15}
.mapbadge .mt b{display:block;font-family:'Kanit';font-weight:600;font-size:.86rem;color:var(--ink)}
.mapbadge .mt small{font-size:.66rem;color:var(--muted)}
@media(max-width:560px){.mapbadge{left:12px;top:8px;padding:6px 10px}.mapbadge .mv{width:28px;height:28px;font-size:.75rem}}

.legendwrap{display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px 15px;border-top:1px dashed var(--line)}
.lchip{display:inline-flex;align-items:center;gap:7px;font-family:'Kanit';font-weight:500;font-size:.8rem;color:var(--ink-2);
  background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.13s}
.lchip .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.lchip b{font-family:'Kanit';font-weight:700;color:var(--ink)}
.lchip:hover{border-color:var(--orange-line);background:var(--orange-soft)}
.lchip.on{border-color:var(--orange-deep);background:var(--orange-soft);box-shadow:0 0 0 2px rgba(143,169,189,.22)}
.lchip.off{opacity:.4}
.chamber-note{padding:0 18px 15px;font-size:.75rem;color:var(--muted);line-height:1.6}

/* tooltip */
.ptip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:11px;
  padding:8px 12px;font-size:.8rem;box-shadow:var(--shadow-lg);max-width:250px;opacity:0;transform:translateY(4px);transition:opacity .1s}
.ptip.on{opacity:1}
.ptip .tn{font-family:'Kanit';font-weight:600;font-size:.88rem}
.ptip .tp{display:flex;align-items:center;gap:6px;margin-top:3px}
.ptip .tp .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
html[data-theme="dark"] .ptip{background:#0E1C29;border:1px solid var(--line-2);color:var(--ink)}

/* side panel */
.pside{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
@media(max-width:980px){.pside{position:static}}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px}
.scard .sb-head{font-family:'Kanit';font-weight:600;font-size:.98rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.scard .sb-head svg{color:var(--orange-deep);flex:0 0 auto}
.scard .sb-head .sc{margin-left:auto;font-size:.72rem;font-weight:500;color:var(--muted)}

/* winner hero */
.whero{display:flex;gap:13px;align-items:center;padding:13px;border-radius:15px;color:#fff;margin-bottom:13px;
  box-shadow:var(--shadow)}
.whero .wav{width:56px;height:56px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:rgba(255,255,255,.2);
  font-family:'Kanit';font-weight:700;font-size:1.15rem;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.whero .wi{min-width:0}
.whero .wn{font-family:'Kanit';font-weight:600;font-size:1.12rem;line-height:1.2}
.whero .wmeta{font-size:.78rem;opacity:.92;margin-top:2px}
.whero .wbig{font-family:'Kanit';font-weight:700;font-size:1.35rem;margin-top:5px;font-variant-numeric:tabular-nums}
.whero .wbig span{font-size:.8rem;font-weight:500;opacity:.9}

/* ranking bars */
.rank{display:flex;flex-direction:column;gap:2px;max-height:430px;overflow-y:auto;margin:0 -4px}
.rank::-webkit-scrollbar{width:7px}.rank::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:7px}
.rrow{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:7px 5px;border-radius:9px}
.rrow:hover{background:var(--wash)}
.rrow.win{background:var(--orange-soft)}
.rno{font-family:'Kanit';font-weight:600;font-size:.72rem;color:var(--muted);width:26px;height:26px;border-radius:8px;
  display:grid;place-items:center;background:var(--wash);border:1px solid var(--line)}
.rmid{min-width:0}
.rnm{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt{font-size:.7rem;color:var(--muted);margin-bottom:3px}
.rbar{height:7px;border-radius:5px;background:var(--wash);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:5px}
.rval{text-align:right;flex:0 0 auto}
.rval .rp{font-family:'Kanit';font-weight:700;font-size:.92rem}
.rval .rv{font-size:.68rem;color:var(--muted)}

/* candidate/winner avatars with photo overlay (photo covers number/✓ when available) */
.ava{position:relative;overflow:hidden}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 16%}

/* campaign song player (ผู้ว่าฯ tab) */
.songcard{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--wash);margin-bottom:13px}
.songplay{width:40px;height:40px;border-radius:50%;border:0;flex:0 0 auto;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:.9rem;background:linear-gradient(135deg,#00A651,#00783A);box-shadow:var(--shadow);transition:transform .1s}
.songplay:active{transform:scale(.92)}
.songinfo{flex:1 1 auto;min-width:0}
.songttl{font-family:'Kanit';font-weight:600;font-size:.85rem;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songsub{font-size:.66rem;color:var(--muted);margin:1px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songbar{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden;cursor:pointer}
.songbar i{display:block;height:100%;width:0;background:#00A651;border-radius:4px;transition:width .2s linear}
.songtime{font-family:'Kanit';font-size:.64rem;color:var(--muted);flex:0 0 auto;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.songyt{flex:0 0 auto;font-family:'Kanit';font-weight:700;font-size:.62rem;color:#d00;background:rgba(220,0,0,.08);border:1px solid rgba(220,0,0,.25);border-radius:8px;padding:5px 7px;white-space:nowrap}
.songwrap{margin-bottom:13px}
.songhead{font-family:'Kanit';font-weight:600;font-size:.8rem;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.songhead svg{color:var(--orange-deep);flex:0 0 auto}
.songlist{display:flex;flex-direction:column;gap:8px}
.songlist .songcard{margin-bottom:0}

/* party seat totals */
.ptot{display:flex;flex-direction:column;gap:11px}
.ptrow .pth{display:flex;align-items:center;gap:8px;font-size:.86rem;margin-bottom:4px}
.ptrow .pth .sw{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.ptrow .pth .pnm{font-family:'Kanit';font-weight:600;flex:1 1 auto;min-width:0}
.ptrow .pth .pseat{font-family:'Kanit';font-weight:700;font-size:1rem}
.ptrow .pth .pseat span{font-size:.72rem;font-weight:500;color:var(--muted)}
.ptrow .ptbar{height:9px;border-radius:6px;background:var(--wash);overflow:hidden}
.ptrow .ptbar i{display:block;height:100%;border-radius:6px}
.ptrow .ptv{font-size:.68rem;color:var(--muted);margin-top:3px}

/* stats strip */
.sstrip{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px;padding-top:13px;border-top:1px dashed var(--line)}
.sfig{flex:1 1 92px;background:var(--wash);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.sfig .sfk{font-size:.68rem;color:var(--muted);line-height:1.3}
.sfig .sfv{font-family:'Kanit';font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.sfig .sfv small{font-size:.7rem;font-weight:500;color:var(--muted)}

/* district detail */
.dback{display:inline-flex;align-items:center;gap:7px;font-family:'Kanit';font-weight:500;font-size:.84rem;color:var(--orange-deep);
  background:var(--orange-soft);border:1px solid var(--orange-line);border-radius:10px;padding:7px 13px;margin-bottom:12px;cursor:pointer}
.ddet .ddn{font-family:'Kanit';font-weight:600;font-size:1.5rem;line-height:1.1}
.ddet .ddwin{display:flex;align-items:center;gap:9px;margin-top:12px;padding:12px;border-radius:14px;color:#fff;box-shadow:var(--shadow)}
.ddet .ddwin .dva{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;
  font-family:'Kanit';font-weight:700;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.32)}
.ddet .ddwin .dvn{font-family:'Kanit';font-weight:600;font-size:1.02rem;line-height:1.2}
.ddet .ddwin .dvm{font-size:.76rem;opacity:.92;margin-top:2px}
.ddrows{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.ddr{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;padding:6px 2px;border-bottom:1px dashed var(--line)}
.ddr b{font-family:'Kanit';font-weight:600}
.dempty{color:var(--muted);font-size:.85rem;line-height:1.7;padding:6px 2px}

/* ===== แผงขยาย "ดูผู้สมัครทุกคน & สถิติเขต" (แบบเดียวกับหน้ารายเขต ส.ส.) ===== */
.dmore{margin-top:13px;border-top:1px dashed var(--line);padding-top:12px}
.dmore>summary{cursor:pointer;list-style:none;font-family:'Kanit';font-size:.82rem;font-weight:500;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 12px;background:var(--wash);
  border:1px solid var(--line);border-radius:11px;transition:.14s}
.dmore>summary::-webkit-details-marker{display:none}
.dmore>summary:hover{border-color:var(--orange)}
.dmore[open]>summary{background:var(--orange-soft);border-color:var(--orange-line)}
.dmore>summary .chev{width:8px;height:8px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;
  transform:rotate(45deg) translate(-1px,-2px);opacity:.6;transition:transform .18s}
.dmore[open]>summary .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0 4px}
.dgrid .dbox{background:var(--wash);border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.dgrid .dbox.wide{grid-column:1/-1}
.dgrid .k{font-size:.68rem;color:var(--muted);line-height:1.4}
.dgrid .v{font-family:'Kanit';font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.dgrid .v small{font-size:.72rem;font-weight:400;color:var(--muted);margin-left:3px}
.dclist{margin-top:12px}
.dclist .dch{font-size:.7rem;color:var(--muted);margin-bottom:4px}
.dcand{display:flex;align-items:center;gap:9px;padding:7px 1px;border-bottom:1px dashed var(--line)}
.dcand:last-child{border-bottom:0}
.dcand .cno{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;flex:none;
  font-family:'Kanit';font-size:.72rem;font-weight:600;color:#fff}
.dcand .cmid{flex:1;min-width:0}
.dcand .cnm{font-size:.82rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcand .cpt{font-size:.68rem;color:var(--muted);line-height:1.3}
.dcand .cval{text-align:right;flex:none}
.dcand .cv{font-family:'Kanit';font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.dcand .cp{font-size:.68rem;color:var(--muted)}
.dcand.win .cnm{font-weight:600}
.dnote{font-size:.71rem;color:var(--muted);line-height:1.6;margin-top:9px}

/* ===== การ์ดซ้ายบนแผนที่: รายชื่อเขต → กดแล้วขึ้นตารางคะแนนของเขตนั้น ===== */
@media(min-width:901px){.mapwrap.has-side{padding-left:342px}}
.mapside{position:absolute;left:16px;top:84px;z-index:6;width:310px;max-height:calc(100% - 104px);
  display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.mapside .msh{display:flex;align-items:center;gap:8px;padding:11px 13px 9px;border-bottom:1px solid var(--line)}
.mapside .mst{font-family:'Kanit';font-weight:600;font-size:.88rem;flex:1;line-height:1.25}
.mapside .msc{font-size:.7rem;color:var(--muted);white-space:nowrap}
.mapside .msback{display:inline-flex;align-items:center;gap:5px;font-family:'Kanit';font-size:.75rem;
  background:var(--wash);border:1px solid var(--line);border-radius:9px;padding:4px 9px;cursor:pointer;color:var(--ink-2)}
.mapside .msback:hover{border-color:var(--orange);color:var(--orange-deep)}
.mapside .mssearch{padding:9px 11px;border-bottom:1px solid var(--line)}
.mapside .mssearch input{width:100%;font-family:'Kanit';font-size:.8rem;color:var(--ink);background:var(--wash);
  border:1px solid var(--line);border-radius:10px;padding:7px 11px;outline:none}
.mapside .mssearch input:focus{border-color:var(--orange)}
.mapside .msbody{overflow:auto;padding:5px}
.mapside .msrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;
  border:0;border-radius:10px;padding:7px 8px;cursor:pointer;font-family:'Kanit';transition:.12s}
.mapside .msrow:hover{background:var(--wash)}
.mapside .msrow.on{background:var(--orange-soft)}
.mapside .msrow .sw{width:9px;height:9px;border-radius:3px;flex:none}
.mapside .msrow .mn{flex:1;font-size:.82rem;line-height:1.25;min-width:0}
.mapside .msrow .mw{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mapside .msrow .mv{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mstab{width:100%;border-collapse:collapse;font-size:.76rem}
.mstab th{font-family:'Kanit';font-weight:500;font-size:.68rem;color:var(--muted);text-align:left;
  padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.mstab td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:middle}
.mstab tr:last-child td{border-bottom:0}
.mstab tr.win td{background:var(--orange-soft)}
.mstab .no{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:.68rem;font-weight:600}
.mstab .nm{font-family:'Kanit';line-height:1.25}
.mstab .pt{font-size:.66rem;color:var(--muted);line-height:1.2}
.mstab .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.mstab .pc{text-align:right;font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.msstat{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:9px 8px 4px}
.msstat div{background:var(--wash);border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.msstat .k{font-size:.64rem;color:var(--muted)}
.msstat .v{font-family:'Kanit';font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.msnote{font-size:.67rem;color:var(--muted);line-height:1.55;padding:8px 9px 10px}
@media(max-width:1100px) and (min-width:901px){.mapside{width:250px}.mapwrap.has-side{padding-left:280px}}
@media(max-width:900px){
  .mapside{position:static;width:auto;max-height:none;margin:10px 0 4px;box-shadow:none}
  .mapside .msbody{max-height:340px}
}

/* ===== SUMMARY VIEW ===== */
#sumView{display:none}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:820px){.sumgrid{grid-template-columns:1fr}}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.sumcard h3{font-family:'Kanit';font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:9px;margin-bottom:4px}
.sumcard h3 svg{color:var(--orange-deep);flex:0 0 auto}
.sumcard .sub{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.sumwin{display:flex;align-items:center;gap:13px;padding:14px;border-radius:15px;color:#fff;margin-bottom:14px}
.sumwin .swa{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;
  font-family:'Kanit';font-weight:700;font-size:1.2rem;flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.sumwin .swn{font-family:'Kanit';font-weight:600;font-size:1.2rem;line-height:1.15}
.sumwin .swm{font-size:.8rem;opacity:.92;margin-top:2px}
.sumwin .swb{font-family:'Kanit';font-weight:700;font-size:1.5rem;margin-top:4px}
.sumwin .swb span{font-size:.82rem;font-weight:500;opacity:.9}
/* seat composition bar + dot grid */

        <!-- การ์ดซ้าย: รายชื่อเขต → กดแล้วเป็นตารางคะแนนของเขตนั้น (renderMapSide) -->

<!-- ประวัติ (ใช้ทั้งแท็บ "ประวัติ" และรายการปีในปุ่มเลือกปี) -->
<script src="bkk-history.js"></script>
<!-- ปุ่มเลือกปี — document.write ไฟล์ข้อมูล+รูปของปีที่เลือก (ห้าม defer/async) -->
<script src="bkk-years.js"></script>
<!-- โหมดสรุปสำหรับปีที่ไม่มีผลรายเขต (ทำงานเมื่อ window.BKKOLD เท่านั้น) -->
<script src="bkk-oldyear.js"></script>
<script>
'use strict';
(function(){
if(window.BKKOLD) return;   // ปีที่ไม่มีผลรายเขต → bkk-oldyear.js รับช่วงไปแล้ว (ไม่มี window.BKKDATA)
const GEO=window.BKKGEO, D=window.BKKDATA, SK=D.sk, GOV=D.gov;
const YEAR=window.BKKYEAR||2569;        // ปีที่กำลังดูอยู่ (ปุ่มเลือกปี = bkk-years.js)
const HASGOV=!!(GOV&&GOV.candidates&&GOV.candidates.length);   // บางปีเลือกเฉพาะ ส.ก. (เช่น 2553)
const GWIN=HASGOV?GOV.candidates[0]:null;   // ผู้ชนะ = รายการแรก (ข้อมูลเรียงคะแนนมาก→น้อย)
const SWEEP=!!(GOV&&GOV.sweep);         // true = มีแหล่งอ้างอิงว่าชนะครบทั้ง 50 เขต
/* ปีที่มี "ผลผู้ว่าฯ แยกรายเขต" จริง (2556) → แผนที่แท็บผู้ว่าฯ ระบายสีตามผู้ชนะของแต่ละเขต
   ปีอื่น กกต. ไม่ได้ประกาศแยกรายเขต → ระบายสีเดียวทั้ง กทม. ตามผู้ชนะรวม */
const GDIST=(HASGOV&&GOV.byDistrict&&GOV.districts)?GOV.districts:null;
const GCAND={}; ((GOV&&GOV.mapCands)||[]).forEach(c=>{GCAND[c.key]=c;});
const GNOMAP=!!(GOV&&GOV.noMap);   // ปีที่รู้แค่ผลรวมทั้ง กทม. — ไม่ระบายสีผู้ชนะทับทั้งแผนที่
const HASSK=!!(SK&&SK.districts);
/* ยุคก่อน 2541 กรุงเทพฯ ยังไม่ได้แยกครบ 50 เขต — เขตที่ยังไม่เกิดจะเว้นสีไว้บนแผนที่ */
const SKPARTIAL=!!(SK&&SK.districts&&Object.keys(SK.districts).length<Object.keys(GEO.districts).length);       // ปีที่ไม่มีเลือกตั้ง ส.ก. (เช่น 2556) → ซ่อนแท็บ ส.ก./สภา
const NS='http://www.w3.org/2000/svg';
const fmt=n=>n==null?'—':Number(n).toLocaleString('en-US');
const el=id=>document.getElementById(id);
const state={view:'gov', focus:null, sel:null};

// governor candidate accent color
function govColor(c){
  if(c===GWIN) return GOV.winnerColor;
  const m={'ประชาชน':'#FF6A13','ก้าวไกล':'#FF6A13','ประชาธิปัตย์':'#27AAE1','เพื่อไทย':'#ED1C24',
           'เศรษฐกิจ':'#B7791F','ไทยสร้างไทย':'#E0218A','พลังประชารัฐ':'#3F51B5','รักษ์กรุงเทพ':'#F0B400'};
  return m[c.party]||'#9AA3AE';
}
const skColor=name=>{if(!HASSK)return '#C9D4DC';const d=SK.districts[name]; return d?(SK.colors[d.party]||'#9AA3AE'):'#C9D4DC';};
// สีเขตในแท็บผู้ว่าฯ ของปีที่มีผลรายเขต — ตามผู้สมัครที่ชนะเขตนั้น
const govDistColor=name=>{const d=GDIST&&GDIST[name];if(!d)return '#C9D4DC';
  const c=GCAND[d.win]; return (c&&c.color)||'#9AA3AE';};
/* สีของผู้สมัคร ส.ก. ในแผงขยาย — จับจากชื่อพรรค (บทความเขียนยาวกว่าคีย์ที่ใช้ในเว็บ เช่น "ประชาชน (พ.ศ. 2567)") */
function skCandColor(c){
  if(!HASSK||!c) return '#9AA3AE';
  const raw=String(c.party||'').replace(/^พรรค/,'').replace(/^กลุ่ม/,'').replace(/\s*\(.*?\)\s*/g,'').trim();
  if(SK.colors[raw]) return SK.colors[raw];
  const hit=Object.keys(SK.colors).find(k=>raw&&(raw.indexOf(k)>=0||k.indexOf(raw)>=0));
  return hit?SK.colors[hit]:'#9AA3AE';
}

/* ---------- photos (avatar shows portrait if available, else number/อักษรย่อ) ---------- */
const PH=window.BKKPHOTOS||{gov:{},sk:{}};
/* อักษรย่อจากชื่อ — ตัดคำนำหน้าออกก่อน (ชุดเดียวกับหน้า ส.ส./บัญชีรายชื่อ)
   ใช้แทนรูปที่ยังพิสูจน์แหล่งที่มาไม่ได้ */
const LEAD_VOWELS=/[เแโใไ]/;   /* สระนำหน้าเขียนก่อนพยัญชนะต้น — "เอกนัฏ" ต้องได้ "อ" ไม่ใช่ "เ" */
const firstLetter=s=>(LEAD_VOWELS.test(s.charAt(0))&&s.length>1)?s.charAt(1):s.charAt(0);
const initialOf=name=>{const t=String(name||'').replace(/^(นางสาว|นาง|นาย|ว่าที่ร้อยตรีหญิง|ว่าที่ร้อยตรี|ว่าที่|ดร\.|ผศ\.|รศ\.|ศ\.|พล[^ ]*|พ\.[^ ]*|ร\.[^ ]*|น\.[^ ]*|จ\.[^ ]*)\s*/,'').trim();return firstLetter(t)||firstLetter(String(name||'').replace(/\s/g,''))||'•';};
function govAvatar(c,cls){
  const f=c.no!=null&&PH.gov&&PH.gov[c.no];
  const face=c.no!=null?c.no:((c.name||'?').trim().charAt(0)||'?');   // ปีเก่าไม่มีเบอร์ผู้สมัคร
  return `<div class="${cls} ava">${face}${f?`<img src="bkk-photos/${f}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:''}</div>`;
}

/* ---------- campaign songs — เล่นจากไฟล์ mp3 ใน ../songs/ (เสียงอย่างเดียว)
   + ปุ่ม YT ไว้เป็นลิงก์สำรอง (คลิป official ปิดการฝัง เล่นในหน้าไม่ได้) ---------- */
const SONGS=[
  {file:'chadchart-vote9.mp3',id:'sQUu4_yDrAI',title:'ชัช-ชัช-ชาติ เอ้า! กา เบอร์ 9',sub:'ทีมชัชชาติ · กรุงเทพฯ ทำงาน · official audio'},
  {file:'chadchart-power.mp3',id:'NVJip0Tsub4',title:'เพลงในพลังของท่านชัชชาติ',sub:'เพลงให้กำลังใจท่านชัชชาติ'}
];
const SONG={audio:[],cur:-1};
function fmtTime(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function songUI(){SONGS.forEach((s,i)=>{const b=el('songBtn'+i),a=SONG.audio[i];
  if(b)b.innerHTML=(a&&!a.paused)?"<svg class='mdico'><use href='#i-pause'></use></svg>":"<svg class='mdico'><use href='#i-play'></use></svg>";});}
function songRow(i){const a=SONG.audio[i];if(!a)return;
  const d=a.duration||0,t=a.currentTime||0,p=el('songProg'+i),tm=el('songTime'+i);
  if(p)p.style.width=(d?(t/d*100):0).toFixed(1)+'%';
  if(tm)tm.textContent=d?(fmtTime(t)+' / '+fmtTime(d)):fmtTime(t);}
function songFail(i){const tm=el('songTime'+i);if(tm)tm.textContent='เล่นไม่ได้ · กด YT';}
/* หยุดทุกเพลงในหน้านี้ — ใช้เป็น window.__mdStop ให้เพลย์เยอร์หน้าอื่นสั่งหยุดได้ */
function songStop(){SONG.audio.forEach(a=>{if(a&&!a.paused)a.pause();});
  if(window.__mdStop===songStop)window.__mdStop=null;}
function songAudio(i){
  if(SONG.audio[i])return SONG.audio[i];
  const a=new Audio('../songs/'+SONGS[i].file); a.preload='metadata'; SONG.audio[i]=a;
  a.addEventListener('loadedmetadata',()=>songRow(i));
  a.addEventListener('timeupdate',()=>songRow(i));
  a.addEventListener('play',()=>{SONG.cur=i;songUI();});
  a.addEventListener('pause',()=>songUI());
  a.addEventListener('ended',()=>{a.currentTime=0;songRow(i);songUI();
    if(window.__mdStop===songStop)window.__mdStop=null;});
  a.addEventListener('error',()=>songFail(i));
  return a;}
function songPlay(i){
  const a=songAudio(i);
  if(a.paused){
    if(window.__mdStop&&window.__mdStop!==songStop)window.__mdStop();   // หยุดเพลงของหน้าอื่นก่อน
    SONG.audio.forEach((o,j)=>{if(o&&j!==i&&!o.paused)o.pause();});      // เล่นทีละเพลง
    SONG.cur=i; window.__mdStop=songStop;
    const p=a.play(); if(p&&p.catch)p.catch(()=>songFail(i));
  }else a.pause();
  songUI();}
function songSeek(i,ev){const a=SONG.audio[i];if(!a||!a.duration)return;
  const bar=el('songBar'+i);if(!bar)return;const r=bar.getBoundingClientRect();
  a.currentTime=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width))*a.duration;
  songRow(i);}
function songListHTML(){if(YEAR!==2569)return '';return `<div class="songwrap"><div class="songhead"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>เพลงหาเสียง · ชัชชาติ เบอร์ 9</div><div class="songlist">`+
  SONGS.map((s,i)=>`<div class="songcard">`+
    `<button class="songplay" id="songBtn${i}" title="เล่น/หยุดเพลง"><svg class='mdico'><use href='#i-play'></use></svg></button>`+
    `<div class="songinfo"><div class="songttl">${s.title}</div>`+
    `<div class="songsub">${s.sub}</div>`+
    `<div class="songbar" id="songBar${i}"><i id="songProg${i}"></i></div></div>`+
    `<div class="songtime" id="songTime${i}">0:00</div>`+
    `<a class="songyt" href="https://youtu.be/${s.id}" target="_blank" rel="noopener" title="เปิดใน YouTube">YT ▶</a></div>`
  ).join('')+`</div></div>`;}
function bindSong(){if(YEAR!==2569)return;SONGS.forEach((s,i)=>{songAudio(i);
  const b=el('songBtn'+i);if(b)b.onclick=()=>songPlay(i);
  const bar=el('songBar'+i);if(bar)bar.onclick=e=>songSeek(i,e);
  songRow(i);});songUI();}

/* ---------- build map once ---------- */
const svg=el('bkkmap'), kg=el('khetG'), lg=el('labelG');
svg.setAttribute('viewBox', GEO.meta.viewBox);
const paths={};
Object.entries(GEO.districts).forEach(([name,g])=>{
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d', g.d);
  p.setAttribute('class','khet');
  p.dataset.name=name;
  kg.appendChild(p);
  paths[name]=p;
  p.addEventListener('mouseenter',e=>onEnter(name,e));
  p.addEventListener('mousemove',moveTip);
  p.addEventListener('mouseleave',onLeave);
  p.addEventListener('click',()=>onClick(name));
});
// data-coverage guard
if(HASSK) Object.keys(GEO.districts).forEach(n=>{ if(!SK.districts[n]) console.warn('no ส.ก. data for',n); });
if(GDIST) Object.keys(GEO.districts).forEach(n=>{ if(!GDIST[n]) console.warn('no ผู้ว่าฯ รายเขต data for',n); });

/* ซูมเข้าเขตที่เลือกแบบบินลื่น ๆ (ดู js/mapzoom.js — ไอเดียจาก elect.in.th)
   กทม. เป็นแผนที่แบน (1000×795) แต่ละเขตเล็ก จึงเปิดเพดานให้สูงพอ
   ล้อเมาส์ไม่ดักไว้ เพราะแผนที่อยู่ในสายเลื่อนหน้า จะไปแย่งการสกรอลล์ */
const VB=(GEO.meta.viewBox||'0 0 1000 795').split(/\s+/).map(Number);
const mz=MapZoom.create(svg,el('zoomG'),{width:VB[2],height:VB[3],maxZoom:14,
  fill:.62,fillMobile:.5,onScale:s=>svg.classList.toggle('zoomed',s>1.001)});

/* ---------- tooltip ---------- */
const tip=el('ptip');
function tipHTML(name){
  if(state.view==='gov'){
    if(GDIST){                                   // ปีที่มีผลผู้ว่าฯ รายเขต — โชว์ผู้ชนะของเขตนั้นจริง ๆ
      const d=GDIST[name];
      if(!d) return `<div class="tn">เขต${name}</div><div class="tp" style="opacity:.75">ไม่มีข้อมูลรายเขต</div>`;
      const c=GCAND[d.win]||{};
      return `<div class="tn">เขต${name}</div>`+
        `<div class="tp"><span class="sw" style="background:${govDistColor(name)}"></span>${c.name||d.win} · ${c.party||''}</div>`+
        (d.votes?`<div class="tp" style="opacity:.85">${fmt(d.votes)} คะแนน${d.pct?' ('+d.pct+'%)':''}`
          +(d.runVotes?` · นำ ${fmt(d.votes-d.runVotes)}`:'')+`</div>`:'');
    }
    return `<div class="tn">เขต${name}</div><div class="tp"><span class="sw" style="background:${GOV.winnerColor}"></span>ผู้ชนะ: ${GWIN.name}</div>`;
  }
  const d=SK.districts[name];
  if(!d) return `<div class="tn">เขต${name}</div>`+
    (SKPARTIAL?`<div class="tp" style="opacity:.75">ปี ${YEAR} ยังไม่มีเขตนี้ (แยกออกมาทีหลัง)</div>`:'');
  if(d.seats&&d.seats.length>1){          // เขตที่แบ่งเป็น 2 เขตเลือกตั้ง (ปี 2553)
    return `<div class="tn">เขต${name} <small style="opacity:.7">· ${d.seats.length} ที่นั่ง</small></div>`+
      d.seats.map(s=>`<div class="tp"><span class="sw" style="background:${SK.colors[s.party]||'#9AA3AE'}"></span>`+
        `เขตเลือกตั้งที่ ${s.zone} · ${s.winner} (${s.party})</div>`).join('');
  }
  return `<div class="tn">เขต${name}</div>`+
    `<div class="tp"><span class="sw" style="background:${skColor(name)}"></span>${d.winner||'—'} · ${d.grp||d.party}</div>`+
    (d.votes?`<div class="tp" style="opacity:.85">${fmt(d.votes)} คะแนน (${d.pct}%)</div>`:'');
}
function onEnter(name,e){ if(paths[name].classList.contains('dim'))return; tip.innerHTML=tipHTML(name); tip.classList.add('on'); moveTip(e); }
function moveTip(e){ const pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
  let x=e.clientX+pad, y=e.clientY+pad;
  if(x+w>innerWidth-8) x=e.clientX-w-pad; if(y+h>innerHeight-8) y=e.clientY-h-pad;
  tip.style.left=x+'px'; tip.style.top=y+'px'; }
function onLeave(){ tip.classList.remove('on'); }
function onClick(name){
  // แตะเขตเดิมซ้ำ = ยกเลิกการเลือก → recolor() จะสั่งบินกลับมุมมองเต็ม (ทางออกจากสภาพซูมค้าง)
  if(state.view==='sk'||(state.view==='gov'&&GDIST)){ state.sel=(state.sel===name)?null:name; renderPanel(); recolor(); }
  else { // gov ปีที่ไม่มีผลรายเขต: แค่กะพริบ
    const p=paths[name]; p.classList.add('sel'); setTimeout(()=>p.classList.remove('sel'),600);
  }
}

/* ---------- recolor ---------- */
function recolor(){
  Object.entries(paths).forEach(([name,p])=>{
    p.setAttribute('fill', state.view==='gov'?(GDIST?govDistColor(name):(GNOMAP?'#C9D4DC':GOV.winnerColor)):skColor(name));
    p.classList.remove('dim','sel');
    if(state.view==='sk'){
      if(state.focus){ const d=SK.districts[name]; if(!d||d.party!==state.focus) p.classList.add('dim'); }
      if(state.sel===name) p.classList.add('sel');
    }else if(GDIST){                       // แท็บผู้ว่าฯ ของปีที่มีผลรายเขต — ไฮไลต์/หรี่ได้เหมือน ส.ก.
      if(state.focus){ const d=GDIST[name]; if(!d||d.win!==state.focus) p.classList.add('dim'); }
      if(state.sel===name) p.classList.add('sel');
    }
  });
  // เลือกเขตแล้วบินเข้าไปหา · ไม่มีเขตที่เลือก (สลับแท็บ/กดกลับทุกเขต) ก็บินกลับมุมมองเต็ม
  renderMapSide();
  if((state.view==='sk'||(state.view==='gov'&&GDIST))&&state.sel&&paths[state.sel]) mz.fitEl(paths[state.sel]);
  else if(mz.scale>1.001) mz.reset();
}
window.bkkRecolor=recolor;

/* ---------- legend ---------- */
function renderLegend(){
  const box=el('legend');
  if(state.view==='gov'){
    if(GDIST){                                   // ชิปผู้สมัคร + จำนวนเขตที่ชนะ (กดเพื่อไฮไลต์เหมือน ส.ก.)
      const w=GOV.mapWins||{};
      box.innerHTML=(GOV.mapCands||[]).filter(c=>w[c.key]).map(c=>
        `<span class="lchip${state.focus&&state.focus!==c.key?' off':''}${state.focus===c.key?' on':''}" data-k="${c.key}">`+
        `<span class="sw" style="background:${c.color}"></span>${c.key} <b>${w[c.key]} เขต</b></span>`).join('');
      box.querySelectorAll('.lchip').forEach(c=>c.onclick=()=>{
        const k=c.dataset.k; state.focus=(state.focus===k)?null:k; renderLegend(); recolor();
      });
      return;
    }
    box.innerHTML=`<span class="lchip" style="cursor:default"><span class="sw" style="background:${GOV.winnerColor}"></span>${GWIN.name} <b>${SWEEP?'ชนะทั้ง 50 เขต':'ผู้ชนะรวมทั้ง กทม.'}</b></span>`+
      `<span class="lchip" style="cursor:default;opacity:.75"><span class="sw" style="background:var(--wash);border:1px solid var(--line-2)"></span>ไม่มีผลแยกรายเขต (นับรวมทั้ง กทม.)</span>`;
    return;
  }
  box.innerHTML=SK.parties.map(pt=>
    `<span class="lchip${state.focus&&state.focus!==pt.key?' off':''}${state.focus===pt.key?' on':''}" data-k="${pt.key}">`+
    `<span class="sw" style="background:${pt.color}"></span>${pt.key} <b>${pt.seats}</b></span>`).join('');
  box.querySelectorAll('.lchip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k; state.focus=(state.focus===k)?null:k; renderLegend(); recolor();
  });
}

/* ---------- panel ---------- */
/* ---------- แผงขยาย: ผู้สมัครทุกคน + สถิติของเขตนั้น ----------
   ใช้ได้ทั้งแท็บ ส.ก. (ผู้สมัครรายเขต) และแท็บผู้ว่าฯ ของปีที่มีผลรายเขต (2556)
   cands = [{no,name,party,votes,pct}] · st = สถิติเขต · colorOf(c) = สีประจำคน/พรรค */
function moreHTML(cands,st,colorOf,note){
  cands=(cands||[]).slice().sort((a,b)=>(b.votes||0)-(a.votes||0));
  if(!cands.length&&!st) return '';
  const box=(k,v)=>`<div class="dbox"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const stats=!st?'':`<div class="dgrid">`+
    box('ผู้มีสิทธิเลือกตั้ง',fmt(st.eligible))+
    box('ผู้มาใช้สิทธิ',fmt(st.turnout)+(st.turnoutPct!=null?`<small>(${st.turnoutPct}%)</small>`:''))+
    box('บัตรดี',fmt(st.valid))+box('บัตรเสีย',fmt(st.invalid))+
    box('ไม่ประสงค์ลงคะแนน',fmt(st.abstain))+`</div>`;
  const rows=cands.map((c,i)=>{
    const col=colorOf?colorOf(c):'#9AA3AE';
    return `<div class="dcand${i===0?' win':''}">`+
      `<div class="cno" style="background:${col}">${c.no!=null?c.no:(i+1)}</div>`+
      `<div class="cmid"><div class="cnm">${c.name}</div><div class="cpt">${c.party||''}</div></div>`+
      `<div class="cval"><div class="cv">${fmt(c.votes)}</div>`+
      `<div class="cp">${c.pct!=null?c.pct+'%':''}</div></div></div>`;
  }).join('');
  return `<details class="dmore"><summary>ดูผู้สมัครทุกคน &amp; สถิติเขต<span class="chev"></span></summary>`+
    stats+(rows?`<div class="dclist"><div class="dch">ผู้สมัครในเขตนี้ ${cands.length} คน · เรียงตามคะแนน</div>${rows}</div>`:'')+
    (note?`<div class="dnote">${note}</div>`:'')+`</details>`;
}
/* ---------- การ์ดซ้ายบนแผนที่: รายชื่อเขต ↔ ตารางคะแนนรายเขต ----------
   โหมดรายการ = ทุกเขตพร้อมผู้ชนะ (พิมพ์ค้นหาได้) · กดเขต (ในการ์ดหรือบนแผนที่) = ตารางคะแนนของเขตนั้น */
let msQuery='';
/* รูปแผนที่ถูกจำกัดด้วย max-height ทำให้บางจอมีพื้นที่ว่างข้าง ๆ — ถ้าว่างพอก็วางการ์ดทับได้เลย
   ถ้าไม่พอค่อยใส่ padding ให้แผนที่ (แผนที่เล็กลงแต่ไม่โดนบัง) */
function msFit(){
  const box=el('mapSide'); if(!box) return;
  const wrap=box.parentElement; if(!wrap) return;
  if(box.style.display==='none'||innerWidth<901){ wrap.classList.remove('has-side'); return; }
  wrap.classList.remove('has-side');
  const svg=el('bkkmap'), g=el('khetG'); if(!svg||!g) return;
  const sr=svg.getBoundingClientRect(), gr=g.getBoundingClientRect();
  if(!gr.width) return;
  if((gr.left-sr.left) < box.getBoundingClientRect().width+26) wrap.classList.add('has-side');
}
addEventListener('resize',()=>setTimeout(msFit,60));
function msDistricts(){                       // [{name, party, winner, votes, color, cands, stats, seats}]
  if(state.view==='sk'&&HASSK) return Object.keys(SK.districts).sort((a,b)=>a.localeCompare(b,'th')).map(n=>{
    const d=SK.districts[n];
    return {name:n,winner:d.winner,party:d.grp||d.party,votes:d.votes,color:skColor(n),
            cands:d.cands||(d.seats&&d.seats[0]&&d.seats[0].cands),
            stats:d.stats||(d.seats&&d.seats[0]&&d.seats[0].stats),seats:d.seats};
  });
  if(state.view==='gov'&&GDIST) return Object.keys(GDIST).sort((a,b)=>a.localeCompare(b,'th')).map(n=>{
    const d=GDIST[n], c=GCAND[d.win]||{};
    return {name:n,winner:c.name||d.win,party:c.party||'',votes:d.votes,color:govDistColor(n),gov:d};
  });
  return null;
}
function msTable(rows,colorOf){
  return `<table class="mstab"><thead><tr><th>เบอร์</th><th>ผู้สมัคร</th><th class="num">คะแนน</th><th class="pc">%</th></tr></thead><tbody>`+
    rows.map((c,i)=>`<tr class="${i===0?'win':''}">`+
      `<td><span class="no" style="background:${colorOf(c)}">${c.no!=null?c.no:(i+1)}</span></td>`+
      `<td><div class="nm">${c.name}</div><div class="pt">${c.party||''}</div></td>`+
      `<td class="num">${fmt(c.votes)}</td><td class="pc">${c.pct!=null?c.pct+'%':'—'}</td></tr>`).join('')+
    `</tbody></table>`;
}
function msStats(st){
  if(!st) return '';
  const b=(k,v)=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="msstat">`+b('ผู้มีสิทธิ',fmt(st.eligible))+
    b('ผู้มาใช้สิทธิ',(st.turnoutPct!=null?st.turnoutPct+'%':fmt(st.turnout)))+
    b('บัตรดี',fmt(st.valid))+b('บัตรเสีย',fmt(st.invalid))+`</div>`;
}
function renderMapSide(){
  const box=el('mapSide'); if(!box) return;
  const wrap=box.parentElement;
  const show=v=>{box.style.display=v?'':'none'; if(!v&&wrap) wrap.classList.remove('has-side');};
  const list=msDistricts();
  if(!list){
    /* แท็บผู้ว่าฯ ของปีที่ไม่มีผลรายเขต — ใช้พื้นที่ว่างข้างแผนที่โชว์ตารางคะแนนรวมทั้ง กทม. แทน */
    if(state.view==='gov'&&HASGOV){
      show(true);
      box.innerHTML=`<div class="msh"><span class="mst">ตารางคะแนน · ทั้ง กทม.</span>`+
          `<span class="msc">${GOV.ncand||GOV.candidates.length} คน</span></div>`+
        `<div class="msbody">`+msStats(GOV.stats)+
        msTable(GOV.candidates,c=>govColor(c))+
        `<div class="msnote">กกต. ไม่ได้ประกาศผลผู้ว่าฯ แยกรายเขต ตารางนี้จึงเป็นคะแนนรวมทั้งกรุงเทพมหานคร`+
        (HASSK?' · อยากดูรายเขต กดแท็บ “ส.ก.” ด้านบน':'')+`</div></div>`;
      msFit(); return;
    }
    show(false); box.innerHTML=''; return;
  }
  show(true);
  const sel=state.sel&&list.filter(o=>o.name===state.sel)[0];
  if(sel){                                    // ---------- ตารางคะแนนของเขตที่เลือก ----------
    let body='';
    if(sel.seats&&sel.seats.length>1){         // เขตที่มีหลายที่นั่ง (ปี 2553) — แยกตารางต่อที่นั่ง
      body=sel.seats.map(s=>`<div class="msnote" style="padding:9px 9px 2px;color:var(--ink-2)">เขตเลือกตั้งที่ ${s.zone} · ${s.winner}</div>`+
        msStats(s.stats)+(s.cands&&s.cands.length?msTable(s.cands.slice().sort((a,b)=>(b.votes||0)-(a.votes||0)),skCandColor):'')).join('');
    }else if(sel.gov){                         // แท็บผู้ว่าฯ ปีที่มีผลรายเขต (2556)
      const d=sel.gov, order=(GOV.mapCands||[]).filter(c=>d.all&&d.all[c.key])
        .map(c=>({no:c.no,name:c.name,party:c.party,votes:d.all[c.key].votes,pct:d.all[c.key].pct,color:c.color}))
        .sort((a,b)=>(b.votes||0)-(a.votes||0));
      body=msStats({eligible:d.eligible,turnout:d.total,turnoutPct:d.turnoutPct,valid:null,invalid:null})+
        msTable(order,c=>c.color||'#9AA3AE');
    }else{
      body=msStats(sel.stats)+(sel.cands&&sel.cands.length
        ? msTable(sel.cands.slice().sort((a,b)=>(b.votes||0)-(a.votes||0)),skCandColor)
        : `<div class="msnote">แหล่งอ้างอิงของปีนี้ไม่มีคะแนนรายคน — มีเฉพาะรายชื่อผู้ที่ได้รับเลือก</div>`);
    }
    box.innerHTML=`<div class="msh"><button class="msback" type="button" onclick="bkkClearSel()">‹ ทุกเขต</button>`+
      `<span class="mst">เขต${sel.name}</span></div><div class="msbody">${body}</div>`;
    msFit(); return;
  }
  // ---------- โหมดรายการทุกเขต ----------
  const q=msQuery.trim();
  const shown=q?list.filter(o=>(o.name+' '+(o.winner||'')+' '+(o.party||'')).indexOf(q)>=0):list;
  box.innerHTML=`<div class="msh"><span class="mst">${state.view==='gov'?'ผลรายเขต':'ผู้ชนะรายเขต'}</span>`+
      `<span class="msc">${list.length} เขต</span></div>`+
    `<div class="mssearch"><input id="msq" type="search" placeholder="ค้นหาเขต / ชื่อผู้ชนะ / พรรค" value="${q.replace(/"/g,'&quot;')}"></div>`+
    `<div class="msbody">`+(shown.length?shown.map(o=>
      `<button class="msrow" type="button" data-d="${o.name}"><span class="sw" style="background:${o.color}"></span>`+
      `<span class="mn">เขต${o.name}<span class="mw">${o.winner||'—'}${o.party?' · '+o.party:''}</span></span>`+
      `<span class="mv">${o.votes!=null?fmt(o.votes):''}</span></button>`).join('')
      :`<div class="msnote">ไม่พบเขตที่ตรงกับ "${q}"</div>`)+`</div>`;
  const inp=el('msq');
  if(inp) inp.oninput=e=>{msQuery=e.target.value;const p=e.target.selectionStart;renderMapSide();
    const i2=el('msq'); if(i2){i2.focus();try{i2.setSelectionRange(p,p);}catch(err){}}};
  box.querySelectorAll('.msrow').forEach(b=>b.onclick=()=>{
    state.sel=b.dataset.d; renderPanel(); recolor();
  });
  msFit();
}
function statStrip(s){
  if(!s) return '';
  return `<div class="sstrip">`+
    `<div class="sfig"><div class="sfk">ผู้มีสิทธิ</div><div class="sfv">${fmt(s.eligible)}</div></div>`+
    `<div class="sfig"><div class="sfk">มาใช้สิทธิ</div><div class="sfv">${s.turnoutPct}<small>%</small></div></div>`+
    `<div class="sfig"><div class="sfk">บัตรดี</div><div class="sfv">${fmt(s.valid)}</div></div>`+
    `<div class="sfig"><div class="sfk">บัตรเสีย</div><div class="sfv">${fmt(s.invalid)}</div></div>`+
    `<div class="sfig"><div class="sfk">ไม่ประสงค์</div><div class="sfv">${fmt(s.abstain)}</div></div>`+
  `</div>`;
}

                 {eligible:d.eligible,turnout:d.total,turnoutPct:d.turnoutPct,valid:null,invalid:null,abstain:null},
                 c=>{const g=(GOV.mapCands||[]).find(x=>x.name===c.name);return (g&&g.color)||'#9AA3AE';},
                 d.partial?'เขตนี้ไม่มีในตารางของวิกิพีเดีย — ใช้ตัวเลข 2 ผู้สมัครหลักจากรายงานผลรายเขตของ kapook (บวกกับอีก 48 เขตแล้วได้ยอดรวมทางการพอดี) จึงไม่มีสถิติผู้ใช้สิทธิรายเขต':'ตารางผลรายเขตของวิกิพีเดีย (อ้างเว็บไซต์ กทม. election56) ระบุคะแนนไว้ 5 อันดับแรก และไม่ได้แยกบัตรดี/บัตรเสียรายเขต')+

          return `<div class="ddwin" style="background:linear-gradient(135deg,${c},${shade(c)});margin-bottom:8px"><div class="dva ava">${s.zone||'✓'}</div>`+

        (d.split?`<div style="font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.6">เขตนี้ได้ ส.ก. คนละพรรคกัน — สีบนแผนที่ใช้${SK.noVotes?'พรรคของที่นั่งแรกในตาราง':'ที่นั่งที่คะแนนสูงกว่า'}</div>`:'')+

    panel.innerHTML=back+

      `<div class="ddr"><span>สังกัด</span><b>${d.grp||d.party}</b></div>`+
      `</div>`+
      /* 2569/2565 เก็บผู้สมัครไว้ที่ระดับเขต · 2553 เก็บไว้ในที่นั่ง (seats[0]) */
      moreHTML(d.cands||(d.seats&&d.seats[0]&&d.seats[0].cands),
               d.stats||(d.seats&&d.seats[0]&&d.seats[0].stats),skCandColor)+
      `</div>`;
    return;
  }
  const maxSeat=Math.max(...SK.parties.map(p=>p.seats));
  const rows=SK.parties.map(pt=>
    `<div class="ptrow"><div class="pth"><span class="sw" style="background:${pt.color}"></span>`+
    `<span class="pnm">${pt.key}</span><span class="pseat">${pt.seats}<span> ที่นั่ง</span></span></div>`+
    `<div class="ptbar"><i style="width:${(pt.seats/maxSeat*100).toFixed(1)}%;background:${pt.color}"></i></div>`+
    (pt.votes?`<div class="ptv">${fmt(pt.votes)} คะแนน</div>`:'')+`</div>`).join('');
  panel.innerHTML=`<div class="sb-head"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V10l7-5 7 5v11"/></svg>ที่นั่ง ส.ก. รายพรรค <span class="sc">รวม ${SK.totalSeats||50} ที่นั่ง</span></div>`+
    `<div class="ptot">${rows}</div>`+statStrip(SK.stats)+
    `<div style="font-size:.74rem;color:var(--muted);margin-top:12px;line-height:1.6">แตะแผนที่หรือชิปพรรคด้านล่างแผนที่เพื่อเจาะรายเขต</div>`;
}

function shade(hex){ // darken ~18%
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r*.72);g=Math.round(g*.72);b=Math.round(b*.72);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

    </div>`;})() : '');
  /* การ์ดที่ 1 = ผู้ว่าฯ — ปีที่เลือกเฉพาะ ส.ก. (เช่น 2553) ไม่มีการ์ดนี้ */

        <div class="swb">${w.pct!=null?w.pct+'%':fmt(w.votes)} <span>${w.pct!=null?'· '+fmt(w.votes)+' คะแนน':'คะแนน'}</span></div></div>

/* ---------- สภา กทม. (hemicycle + roster) ---------- */
function renderCouncil(){
  /* ปีที่เขตใหญ่แบ่งเป็น 2 เขตเลือกตั้ง (เช่น 2553 = 61 ที่นั่งจาก 50 เขต) ส่งรายชื่อมาเป็น SK.members */
  var members=(SK.members&&SK.members.length)
    ? SK.members.map(function(m){
        return {dist:m.dist,zone:m.zone||null,party:m.party,grp:m.grp,winner:m.winner,votes:m.votes,pct:m.pct,
                color:(SK.colors[m.party]||'#8A94A6'),photo:(PH.sk&&PH.sk[m.dist])||null};
      })
    : Object.keys(SK.districts).map(function(dist){
        var d=SK.districts[dist];
        return {dist:dist,zone:null,party:d.party,grp:d.grp,winner:d.winner,votes:d.votes,pct:d.pct,
                color:(SK.colors[d.party]||'#8A94A6'),photo:(PH.sk&&PH.sk[dist])||null};
      });
  var NSEAT=members.length;
  var oidx=function(p){var i=SK.order.indexOf(p);return i<0?99:i;};
  members.sort(function(a,b){return (oidx(a.party)-oidx(b.party))||(b.votes-a.votes);});

  // hemicycle geometry (parliament-style ~230° fan, บัลลังก์เว้นช่องล่าง)
  var CX=340,CY=270,R0=112,R1=240,ROWS=5,SEATR=9;
  var A0=205*Math.PI/180, A1=-25*Math.PI/180;
  var radii=[]; for(var ri=0;ri<ROWS;ri++) radii.push(R0+ri*(R1-R0)/(ROWS-1));
  var rsum=radii.reduce(function(a,b){return a+b;},0);
  var targets=radii.map(function(r){return NSEAT*r/rsum;});
  var counts=targets.map(Math.floor);
  var rem=NSEAT-counts.reduce(function(a,b){return a+b;},0);
  targets.map(function(t,i){return {i:i,f:t-Math.floor(t)};}).sort(function(a,b){return b.f-a.f;})
         .slice(0,rem).forEach(function(o){counts[o.i]++;});
  var seats=[];
  counts.forEach(function(n,row){
    var r=radii[row];
    for(var j=0;j<n;j++){
      var th=A0-(j+0.5)*(A0-A1)/n;
      seats.push({x:CX+r*Math.cos(th),y:CY-r*Math.sin(th),th:th});
    }
  });
  seats.sort(function(p,q){return q.th-p.th;});   // ซ้าย→ขวา เกิดลิ่มพรรคตามแนวรัศมี
  // ── ที่นั่ง 3 มิติ: radial-gradient ต่อสีพรรค ──
  function hx2rgb(h){h=h.replace('#','');if(h.length===3)h=h.replace(/(.)/g,'$1$1');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
  function rgb2hx(a){return '#'+a.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return ('0'+v.toString(16)).slice(-2);}).join('');}
  function mix(hex,t,amt){var c=hx2rgb(hex);return rgb2hx([c[0]+(t[0]-c[0])*amt,c[1]+(t[1]-c[1])*amt,c[2]+(t[2]-c[2])*amt]);}
  var gid=function(c){return 'skg'+c.replace(/[^0-9A-Za-z]/g,'');};
  var gradDefs=SK.parties.map(function(p){var c=p.color;
    return '<radialGradient id="'+gid(c)+'" cx="33%" cy="28%" r="80%">'
      +'<stop offset="0" stop-color="'+mix(c,[255,255,255],.48)+'"/>'
      +'<stop offset="0.55" stop-color="'+c+'"/>'
      +'<stop offset="1" stop-color="'+mix(c,[0,0,0],.26)+'"/></radialGradient>';
  }).join('')
    +'<radialGradient id="skHallWash" cx="50%" cy="56%" r="62%"><stop offset="0" stop-color="rgba(201,168,76,.10)"/><stop offset=".55" stop-color="rgba(201,168,76,.045)"/><stop offset="1" stop-color="rgba(201,168,76,0)"/></radialGradient>';
  // ── ฉากหลังห้องประชุม (แสงนวลทอง + แนวแถว + กำแพงโค้งทอง) ──
  var arcD=function(r){var x0=CX+r*Math.cos(A0),y0=CY-r*Math.sin(A0),x1=CX+r*Math.cos(A1),y1=CY-r*Math.sin(A1);return 'M '+x0.toFixed(1)+' '+y0.toFixed(1)+' A '+r+' '+r+' 0 1 1 '+x1.toFixed(1)+' '+y1.toFixed(1);};
  var backdrop='<circle cx="'+CX+'" cy="'+CY+'" r="'+(R1+26)+'" fill="url(#skHallWash)"/>'
    +radii.map(function(r){return '<path d="'+arcD(r)+'" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 6" opacity=".55"/>';}).join('')
    +'<path d="'+arcD(R1+13)+'" fill="none" stroke="var(--line)" stroke-width="1.4" opacity=".9"/>'
    +'<path d="'+arcD(R1+19)+'" fill="none" stroke="#C9A84C" stroke-width="1" opacity=".5"/>'
    +'<path d="'+arcD(R0-14)+'" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="1 5" opacity=".75"/>';
  var seatSVG=seats.map(function(s,i){
    var m=members[i]; if(!m)return '';
    return '<circle class="cseat" data-dist="'+m.dist+'" cx="'+s.x.toFixed(1)+'" cy="'+s.y.toFixed(1)+'" r="'+SEATR+'" fill="url(#'+gid(m.color)+')"><title>'+m.winner+' — '+(m.grp||m.party)+' · เขต'+m.dist+'</title></circle>';
  }).join('');
  var hemiSVG='<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="แผนผังที่นั่งสภากรุงเทพมหานคร '+NSEAT+' ที่นั่ง ระบายสีตามพรรค"><defs>'+gradDefs+'</defs><g class="hemi-bg">'+backdrop+'</g><g class="hemi-seats">'+seatSVG+'</g></svg>';
  var hlegend=SK.parties.map(function(p){
    return '<span class="lchip" style="cursor:default"><span class="sw" style="background:'+p.color+'"></span>'+p.key+' <b>'+p.seats+'</b></span>';
  }).join('');

  // roster + party filter chips
  var chips='<button class="cfilter on" data-k="">ทั้งหมด <b>'+NSEAT+'</b></button>'+SK.parties.map(function(p){
    return '<button class="cfilter" data-k="'+p.key+'"><span class="sw" style="background:'+p.color+'"></span>'+p.key+' '+p.seats+'</button>';
  }).join('');
  var roster=members.map(function(m){
    var q=encodeURIComponent(m.winner?(m.winner+' สมาชิกสภากรุงเทพมหานคร เขต'+m.dist):('ส.ก. เขต'+m.dist+' กรุงเทพมหานคร '+YEAR));
    var av=m.photo?('<img src="bkk-photos/'+m.photo+'" alt="" decoding="async" onerror="this.remove()">'):((m.winner||'?').trim().charAt(0)||'?');
    var srch=((m.winner||'')+' '+m.dist+' '+(m.grp||m.party)).toLowerCase().replace(/"/g,'');
    return '<a class="ritem" data-dist="'+m.dist+'" data-party="'+m.party+'" data-search="'+srch+'" '
      +'href="https://www.google.com/search?q='+q+'" target="_blank" rel="noopener noreferrer" aria-label="'+(m.winner||'')+' — เขต'+m.dist+' · กดดูการ์ดประวัติ">'
      +'<span class="rav ava">'+av+'</span>'
      +'<span class="rinfo"><span class="rname">'+(m.winner||'—')+'</span>'
        +'<span class="rmeta"><i class="pdot" style="background:'+m.color+'"></i><span class="rmt">'+(m.grp||m.party)+' · เขต'+m.dist+(m.zone?' เขตเลือกตั้งที่ '+m.zone:'')+'</span></span></span>'
      +(m.votes!=null?'<span class="rvotes">'+fmt(m.votes)+'<small>คะแนน</small></span>':'')+'</a>';
  }).join('');

  // council leadership (ประธาน + รองประธาน 1-2) — มาจากไฟล์ข้อมูลของปีนั้น (SK.leaders)
  // ปีที่ยังไม่มีข้อมูลผู้บริหารสภา → ข้ามการ์ดชุดนี้ไปเลย ไม่เดา
  var LEADERS=SK.leaders||[];
  var leadersHTML=LEADERS.map(function(L){
    var d=SK.districts[L.dist]; if(!d)return '';
    var color=(SK.colors[d.party]||'#8A94A6'), f=PH.sk&&PH.sk[L.dist];
    var av=f?('<img src="bkk-photos/'+f+'" alt="" decoding="async" onerror="this.remove()">'):((d.winner||'?').trim().charAt(0)||'?');
    var q=encodeURIComponent((d.winner||'')+' สมาชิกสภากรุงเทพมหานคร เขต'+L.dist);
    return '<a class="leader'+(L.chair?' lead-chair':'')+'" data-dist="'+L.dist+'" data-party="'+d.party+'" '
      +'href="https://www.google.com/search?q='+q+'" target="_blank" rel="noopener noreferrer" '
      +'style="--lc:'+color+(L.chair?';--acc:'+color:'')+'" aria-label="'+L.role+' '+(d.winner||'')+' เขต'+L.dist+' · กดดูการ์ดประวัติ">'
      +'<span class="lrole">'+L.role+'</span>'
      +'<span class="lav ava">'+av+'</span>'
      +'<span class="lname">'+(d.winner||'—')+'</span>'
      +'<span class="lparty" style="background:'+color+'">'+(d.grp||d.party)+' · เขต'+L.dist+'</span></a>';
  }).join('');

  el('councilView').innerHTML=
    '<div class="council-wrap">'
    +(leadersHTML?('<section class="chamber">'
      +'<div class="chamber-head"><span class="cn">คณะผู้บริหารสภากรุงเทพมหานคร</span><span class="cm">ประธานสภา + รองประธาน 2 คน · วาระคราวละ 2 ปี</span></div>'
      +'<div class="cbody"><div class="leaders">'+leadersHTML+'</div>'
        +(D.meta.councilNote?'<p class="lnote">'+D.meta.councilNote+'</p>':'')
      +'</div>'
    +'</section>'):'')
    +'<section class="chamber">'
      +'<div class="chamber-head"><span class="cn">แผนผังที่นั่ง สภากรุงเทพมหานคร (ส.ก.)</span><span class="cm">'+NSEAT+' ที่นั่ง · เขตเลือกตั้งละ 1 คน · จัดกลุ่มตามพรรค</span></div>'
      +'<div class="phint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11V6a2 2 0 0 1 4 0v5M13 11V8.5a2 2 0 0 1 4 0V11M17 11a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-4l-2-3"/></svg><span>กดที่นั่งเพื่อดูการ์ดประวัติ · เอาเมาส์ชี้เพื่อดูชื่อ · เรียงซ้าย→ขวาตามจำนวนที่นั่งของแต่ละพรรค</span></div>'
      +'<div class="hemi-wrap">'+hemiSVG+'</div>'
      +((!leadersHTML&&D.meta.councilNote)?'<p class="lnote" style="padding:0 16px 14px">'+D.meta.councilNote+'</p>':'')
      +'<div class="legendwrap">'+hlegend+'</div>'
    +'</section>'
    +'<section class="chamber">'
      +'<div class="chamber-head"><span class="cn">รายชื่อสมาชิกสภา กทม. (ส.ก.) 50 คน</span><span class="cm">กดชื่อเพื่อดูการ์ดประวัติ</span></div>'
      +'<div class="cbody">'
        +'<div class="cbar"><input id="rsearch" type="search" placeholder="ค้นหาชื่อ / เขต / พรรค…" autocomplete="off"><div class="cfilters">'+chips+'</div></div>'
        +'<div class="roster-grid">'+roster+'</div>'
        +'<div class="ccount" id="rcount">แสดง 50 จาก 50 คน</div>'
      +'</div>'
    +'</section>'
    +'</div>';

  // wire search + party filter (local to this render)
  var cv=el('councilView');
  var items=[].slice.call(cv.querySelectorAll('.ritem'));
  var search=cv.querySelector('#rsearch');
  var chipEls=[].slice.call(cv.querySelectorAll('.cfilter'));
  var countEl=cv.querySelector('#rcount');
  var activeParty='';
  function applyFilter(){
    var qy=(search.value||'').trim().toLowerCase(), shown=0;
    items.forEach(function(it){
      var okP=!activeParty||it.getAttribute('data-party')===activeParty;
      var okQ=!qy||it.getAttribute('data-search').indexOf(qy)>=0;
      var show=okP&&okQ; it.style.display=show?'':'none'; if(show)shown++;
    });
    countEl.textContent='แสดง '+shown+' จาก 50 คน';
  }
  search.addEventListener('input',applyFilter);
  chipEls.forEach(function(c){c.addEventListener('click',function(){
    activeParty=c.getAttribute('data-k');
    chipEls.forEach(function(x){x.classList.toggle('on',x===c);});
    applyFilter();
  });});
}

/* ---------- ประวัติการเลือกตั้งผู้ว่าฯ กทม. (แท็บ "ประวัติ") ----------
   ข้อมูล + ตัวเรนเดอร์ย้ายไปอยู่ bkk-history.js แล้ว (ใช้ร่วมกับโหมดสรุปของปีเก่า) */
function renderHist(){ if(window.BKKrenderHist) window.BKKrenderHist(); }

/* ---------- view switch ---------- */
window.setView=function(v){
  // กันพลาด: ปีที่ไม่มีข้อมูลฝั่งนั้น (2553 ไม่มีผู้ว่าฯ · 2556 ไม่มี ส.ก.) ให้เด้งไปแท็บที่มีข้อมูล
  if(v==='gov'&&!HASGOV) v='sk';
  if((v==='sk'||v==='council')&&!HASSK) v=HASGOV?'gov':'sum';
  state.view=v; state.focus=null; state.sel=null;
  if(v!=='gov')songStop();   // ออกจากแท็บผู้ว่าฯ แล้วหยุดเพลง
  ['gov','sk','sum','council','hist'].forEach(k=>{const b=el('tab-'+k);if(b)b.classList.toggle('active',k===v);});
  const isMap=(v==='gov'||v==='sk');
  el('mapGrid').style.display=isMap?'':'none';
  el('sumView').style.display=v==='sum'?'block':'none';
  el('councilView').style.display=v==='council'?'block':'none';
  el('histView').style.display=v==='hist'?'block':'none';
  if(v==='council'){ renderCouncil(); return; }
  if(v==='hist'){ renderHist(); return; }
  if(isMap){
    el('mapTitle').textContent = v==='gov'?(GNOMAP?'ผลการเลือกตั้งผู้ว่าฯ กทม. (รวมทั้งเมือง)':'แผนที่ผู้ชนะรายเขต — ผู้ว่าฯ กทม.'):('แผนที่ผู้ชนะรายเขต — ส.ก. '+(SK.totalSeats||50)+((SK.totalSeats||50)>50?' ที่นั่ง':' เขต'));
    const govWinTxt=!HASGOV ? '' : (GDIST
      ? (GOV.mapCands||[]).filter(c=>(GOV.mapWins||{})[c.key]).map(c=>c.key+' '+GOV.mapWins[c.key]).join(' · ')+' เขต'
      : (SWEEP?GWIN.name.split(' ')[0]+' กวาดครบ 50 เขต':GWIN.name.split(' ')[0]+' ชนะทั้ง กทม.'));
    el('mapMeta').textContent  = v==='gov'?(GNOMAP?'ผลรวมทั้งกรุงเทพมหานคร · ไม่มีข้อมูลรายเขต':govWinTxt):'ระบายสีตามพรรค/กลุ่มที่ชนะแต่ละเขต';
    el('mapHint').textContent  = v==='gov'
      ?(GDIST?'ชี้/แตะเขตเพื่อดูคะแนนรายเขต · แตะชิปผู้สมัครเพื่อไฮไลต์':(GNOMAP?'ปีนี้ไม่มีผลแยกรายเขต — ดูผลรวมทั้ง กทม. และผู้สมัครทุกคนที่แผงด้านขวา':'ชี้ที่เขตเพื่อดูชื่อเขต · ผลผู้ว่าฯ นับรวมทั้ง กทม. (ไม่มีแยกรายเขตจาก กกต.)'))
      :'ชี้/แตะเขตเพื่อดูผู้ชนะและคะแนน · แตะชิปพรรคเพื่อไฮไลต์';
    el('mapNote').innerHTML = v==='gov'
      ? (GDIST
          ? `แผนที่นี้เป็น<strong>ผลผู้ว่าฯ แยกรายเขตจริง</strong> ${Object.keys(GDIST).length} เขต — สีของแต่ละเขตคือผู้สมัครที่ได้คะแนนสูงสุดในเขตนั้น (ที่มา: ตารางผลรายเขตของวิกิพีเดีย อ้างเว็บไซต์ กทม. election56)`
          : SWEEP
          ? `แผนที่แสดง<strong>ผู้ชนะรายเขต</strong> ซึ่ง${GWIN.name} (เบอร์ ${GWIN.no}) ชนะทั้ง 50 เขต — คะแนนผู้ว่าฯ เป็นการนับรวมทั้งกรุงเทพมหานคร กกต. ไม่ได้ประกาศแยกเป็นรายเขต`
          : (GNOMAP
              ? `การเลือกตั้งครั้งนี้<strong>ไม่มีผลแยกรายเขต</strong>ในแหล่งอ้างอิง แผนที่จึงเว้นสีเทาไว้ — ดูรายชื่อผู้สมัครทั้ง ${GOV.candidates.length} คนพร้อมคะแนนได้ที่แผงด้านขวา`
              : `แผนที่ระบายสีทั้ง กทม. ด้วยสีของ<strong>ผู้ชนะรวมทั้งกรุงเทพมหานคร</strong> คือ ${GWIN.name} (เบอร์ ${GWIN.no}) — กกต. ไม่ได้ประกาศผลผู้ว่าฯ แยกเป็นรายเขต จึงไม่ใช่ผลรายเขตจริง`))
      : (SKPARTIAL
          ? 'ปี '+YEAR+' กรุงเทพฯ ยังแบ่งเป็น '+Object.keys(SK.districts).length+' เขต (ส.ก. '+(SK.totalSeats||0)+' คน) — พื้นที่สีเทาคือเขตที่แยกออกมาภายหลัง สีของแต่ละเขตคือพรรค/กลุ่มที่ครองที่นั่งมากที่สุดในเขตนั้น'
          : (SK.totalSeats||50)>50
          ? 'สมาชิกสภากรุงเทพมหานคร (ส.ก.) ปีนี้มี '+SK.totalSeats+' คนจาก 50 เขต — เขตใหญ่แบ่งเป็น 2 เขตเลือกตั้ง เขตละ 1 คน · สีของแต่ละเขตคือพรรคของผู้ชนะ (เขตที่ได้คนละพรรคใช้สีของที่นั่งที่คะแนนสูงกว่า)'
          : 'สมาชิกสภากรุงเทพมหานคร (ส.ก.) เลือกตั้งแบบแบ่งเขต เขตละ 1 คน รวม 50 คน — สีของแต่ละเขตคือพรรค/กลุ่มของผู้ชนะ');
    if(D.meta&&D.meta.caveat) el('mapNote').innerHTML+='<br><span style="opacity:.8"><svg class="mdico"><use href="#i-triangle-alert"></use></svg> '+D.meta.caveat+'</span>';
    // badge
    el('mapBadge').style.display=v==='gov'?'':'none';
    if(v==='gov'){const pf=(PH.gov&&PH.gov[GWIN.no])?`<img src="bkk-photos/${PH.gov[GWIN.no]}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:'';
      const nWin=GDIST?(GOV.mapWins||{})[(GOV.mapCands||[]).find(c=>c.name===GWIN.name)?((GOV.mapCands||[]).find(c=>c.name===GWIN.name).key):'']:null;
      const sub=GDIST?(nWin?`ชนะ ${nWin} / ${Object.keys(GDIST).length} เขต`:'ผู้ชนะรวมทั้ง กทม.'):(SWEEP?'ชนะ 50 / 50 เขต':'ผู้ชนะทั้ง กทม.');
      el('mapBadge').innerHTML=`<div class="mv ava" style="color:${GOV.winnerColor}">${GWIN.no!=null?GWIN.no:((GWIN.name||'?').trim().charAt(0))}${pf}</div><div class="mt"><b>${GWIN.name}</b><small>${sub}${GWIN.pct!=null?' · '+GWIN.pct+'%':' · '+fmt(GWIN.votes)+' คะแนน'}</small></div>`;}
    recolor(); renderLegend(); renderPanel(); renderMapSide();
  } else { const ms=el('mapSide'); if(ms){ms.style.display='none'; if(ms.parentElement)ms.parentElement.classList.remove('has-side');} renderSummary(); }
};

/* ---------- footer ---------- */
el('foot').innerHTML='ข้อมูลผลการเลือกตั้ง กทม. '+YEAR+' ('+D.meta.note+') · ที่มา: '+
  '<a href="https://th.wikipedia.org/wiki/การเลือกตั้งผู้ว่าราชการกรุงเทพมหานคร_พ.ศ._'+YEAR+'" target="_blank" rel="noopener">วิกิพีเดีย</a>, '+
  (YEAR===2569?'<a href="https://www.thaipbs.or.th/bkkelection69" target="_blank" rel="noopener">Thai PBS</a>, ':'')+
  '<a href="https://www.ect.go.th" target="_blank" rel="noopener">สำนักงาน กกต.</a> · '+
  'ขอบเขตเขต กทม.: OpenGISData-Thailand (chingchai) · จัดทำเพื่อการเรียนรู้';

/* ---------- ส.ก. profile card ---------- */
var skOv=null;
function closeSKCard(){ if(skOv){ skOv.classList.remove('on'); document.body.style.overflow=''; } }
function openSKCard(dist){
  var d=SK.districts[dist]; if(!d) return;
  var color=(SK.colors&&SK.colors[d.party])||'#8A94A6', acc2=shade(color);
  var f=PH.sk&&PH.sk[dist];
  var pObj=SK.parties.find(function(p){return p.key===d.party;});
  var pSeats=pObj?pObj.seats:'—';
  var initial=(d.winner||'?').trim().charAt(0)||'?';
  var q=encodeURIComponent(d.winner?(d.winner+' สมาชิกสภากรุงเทพมหานคร เขต'+dist):('ส.ก. เขต'+dist+' กรุงเทพมหานคร '+YEAR));
  var photo=f?('<img src="bkk-photos/'+f+'" alt="'+(d.winner||'')+'" decoding="async" onerror="this.remove()">'):initial;
  if(!skOv){
    skOv=document.createElement('div'); skOv.className='skcard-ov';
    skOv.addEventListener('click',function(e){ if(e.target===skOv) closeSKCard(); });
    document.body.appendChild(skOv);
  }
  skOv.innerHTML=
    '<div class="skcard" role="dialog" aria-modal="true" aria-labelledby="skcName" style="--acc:'+color+';--acc2:'+acc2+'">'
    +'<button class="skcard-x" type="button" aria-label="ปิด">✕</button>'
    +'<div class="skcard-hero"><div class="skcard-photo">'+photo+'</div></div>'
    +'<div class="skcard-body">'
    +'<span class="skcard-party" style="background:'+color+'">'+(d.grp||d.party)+'</span>'
    +'<h3 id="skcName">'+(d.winner||'—')+'</h3>'
    +'<div class="skcard-role">สมาชิกสภากรุงเทพมหานคร (ส.ก.) · เขต'+dist+'</div>'
    +'<div class="skcard-stats">'
      +'<div><b>'+fmt(d.votes)+'</b><span>คะแนนที่ได้</span></div>'
      +'<div><b>'+d.pct+'%</b><span>สัดส่วนในเขต</span></div>'
      +'<div><b>'+pSeats+'</b><span>ที่นั่งของกลุ่ม</span></div>'
    +'</div>'
    +'<p class="skcard-note">ชนะการเลือกตั้ง ส.ก. เขต'+dist+' ('+(D.meta&&D.meta.note?D.meta.note:YEAR)+') · การ์ดนี้แสดงเฉพาะผลคะแนนที่ตรวจสอบได้จาก กกต./วิกิพีเดีย ไม่มีการแต่งประวัติเพิ่มเติม</p>'
    +'<a class="skcard-btn" href="https://www.google.com/search?q='+q+'" target="_blank" rel="noopener noreferrer">'
      +'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>ค้นหาประวัติเพิ่มเติมใน Google</a>'
    +'</div>';
  skOv.querySelector('.skcard-x').addEventListener('click',closeSKCard);
  skOv.classList.add('on');
  document.body.style.overflow='hidden';
  var x=skOv.querySelector('.skcard-x'); if(x) x.focus();
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSKCard(); });
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('[data-dist]');
  if(!a) return;
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1) return; // ปล่อยให้เปิด Google แท็บใหม่
  e.preventDefault();
  openSKCard(a.getAttribute('data-dist'));
});

// init — ซ่อนแท็บที่ปีนั้นไม่มีข้อมูล (2556 = ไม่มี ส.ก. · 2553 = ไม่มีผู้ว่าฯ)
if(!HASSK) ['tab-sk','tab-council'].forEach(id=>{const b=el(id);if(b)b.style.display='none';});
if(!HASGOV){ const g=el('tab-gov'); if(g)g.style.display='none'; }
if(HASSK){ const sk=el('tab-sk'); if(sk&&sk.querySelector('b')) sk.querySelector('b').textContent=(SK.totalSeats||50); }
setView(HASGOV?'gov':'sk');
})();
</script>
