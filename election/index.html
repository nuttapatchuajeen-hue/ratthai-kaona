<script>

<script>
(function(){
  if(window.EYOLD) return;              // โหมดปีเก่า: index-oldyear.js จัดการหน้านี้ทั้งหมดแล้ว
  const D=window.DATA, PM=D.partyMeta, M=D.map;
  const fmtN=n=>(n==null?'':n.toLocaleString('en-US'));
  const colorOf=c=>(PM[c]&&PM[c].color)||'#B9AFA4';
  const shortOf=c=>(PM[c]&&PM[c].short)||c;
  const NS='http://www.w3.org/2000/svg';
  const zoneRecs=D.zone, provStats=D.provStats, en2th=D.provEn2Th, th2en=D.provTh2En;
  const provNames=Object.keys(provStats).sort((a,b)=>a.localeCompare(b,'th'));
  const isMobile=()=>matchMedia('(max-width:860px)').matches;
  /* ปีเก่าบางยุค (เช่น 2512) แหล่งข้อมูลไม่ได้แยก "เขตเลือกตั้ง" ไว้ มีแค่ว่าใครเป็น ส.ส. จังหวัดไหน
     → ไม่ต้องวาดวงหมายเลขเขต และการ์ดไม่ต้องขึ้น "เขต N" (จะกลายเป็นข้อมูลที่ไม่มีจริง) */
  const NOZONE=!!(window.EYEARINFO&&window.EYEARINFO.noZone);
  /* ยุคก่อนมีพรรคการเมือง (2476–2495) ลงสีตามพรรคไม่ได้ → ลงสี "ความเข้มตามจำนวน ส.ส. ต่อจังหวัด" แทน */
  const HEAT=!!(window.EYEARINFO&&window.EYEARINFO.heat);
  const HEAT_BINS=[[1,'#DCE9F2','1 คน'],[2,'#A8CBE0','2 คน'],[4,'#6FA8C8','3–4 คน'],
                   [7,'#3D7FA6','5–7 คน'],[Infinity,'#1F5478','8 คนขึ้นไป']];
  const heatColor=n=>{for(const b of HEAT_BINS)if(n<=b[0])return b[1];return HEAT_BINS[HEAT_BINS.length-1][1];};
  const fillOf=st=>HEAT?heatColor(st.seats):colorOf(st.winner);

  /* ---- build SVG ---- */
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('class','thmap'); svg.setAttribute('viewBox',`0 0 ${M.width} ${M.height}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const zg=document.createElementNS(NS,'g'), pg=document.createElementNS(NS,'g'),
        dg=document.createElementNS(NS,'g'),
        lg=document.createElementNS(NS,'g'), mkG=document.createElementNS(NS,'g');
  mkG.setAttribute('class','mkg'); dg.setAttribute('class','dg');
  zg.appendChild(pg); zg.appendChild(dg); zg.appendChild(lg); zg.appendChild(mkG); svg.appendChild(zg);
  document.getElementById('maparea').appendChild(svg);

  const pathEls={};
  Object.entries(M.paths).forEach(([en,d])=>{
    const th=en2th[en], st=th?provStats[th]:null;
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('class','pv');
    p.setAttribute('fill', st?fillOf(st):'#D9E5EC'); p.dataset.en=en;
    pg.appendChild(p); pathEls[en]=p;
  });
  const areas=[]; Object.entries(pathEls).forEach(([en,p])=>{const bb=p.getBBox();areas.push({en,a:bb.width*bb.height});});
  areas.sort((x,y)=>y.a-x.a);
  const bigSet=new Set(areas.slice(0,30).map(o=>o.en));
  const labelEls=[];
  Object.entries(pathEls).forEach(([en,p])=>{
    const th=en2th[en]; if(!th) return; const c=M.centroids[en]; if(!c) return;
    const bb=p.getBBox(), a=bb.width*bb.height, size=Math.max(7.5,Math.min(15,Math.sqrt(a)/3.1));
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',c[0]); t.setAttribute('y',c[1]); t.setAttribute('class','plabel');
    t.setAttribute('dominant-baseline','central');
    t.textContent=th; lg.appendChild(t);
    labelEls.push({en,el:t,base:size,area:a,cx:c[0],cy:c[1],text:th});
  });

  /* ---- legend ---- */
  const winCounts={}; Object.values(provStats).forEach(p=>winCounts[p.winner]=(winCounts[p.winner]||0)+1);
  document.getElementById('legendbar').innerHTML=
    (HEAT
      /* โหมดความเข้ม: แถบสัญลักษณ์เป็นช่วงจำนวน ส.ส. พร้อมจำนวนจังหวัดในแต่ละช่วง */
      ? (()=>{const cnt=HEAT_BINS.map(()=>0);
          Object.values(provStats).forEach(p=>{for(let i=0;i<HEAT_BINS.length;i++)if(p.seats<=HEAT_BINS[i][0]){cnt[i]++;break;}});
          return HEAT_BINS.map((b,i)=>cnt[i]
            ? `<span class="li"><span class="sw" style="background:${b[1]}"></span>${b[2]}<b>${cnt[i]} จว.</b></span>` : '').join('');})()
      : Object.entries(winCounts).sort((a,b)=>b[1]-a[1]).map(([c,n])=>
      `<span class="li"><span class="sw" style="background:${colorOf(c)}"></span>${shortOf(c)}<b>${n}</b></span>`).join(''))
    /* ปีเขตละหลายคน: อธิบายกติกาลงสีไว้ท้ายแถบสัญลักษณ์ ให้คนอ่านแผนที่ไม่เข้าใจผิด */
    +((window.EYEARINFO&&window.EYEARINFO.multi)
      ? `<span class="li linote" title="ปีนี้ 1 เขตเลือก ส.ส. ได้ 1–3 คน จึงอาจมีหลายพรรคในเขตเดียวกัน แผนที่ลงสีตามพรรคที่ได้ที่นั่งมากที่สุดในเขตนั้น (แตะเขตเพื่อดูส่วนผสม)">ℹ︎ เขตละหลายคน — สีตามพรรคที่ได้ที่นั่งมากสุดในเขต</span>`
      : '');

  /* ---- zoom & pan ---- */
  let scale=1,tx=0,ty=0,lastLabelScale=-1;
  const MAXZ=40;                                // เพดานซูม — ต้องสูงพอให้จังหวัดเล็ก (สมุทรสงคราม/ภูเก็ต) เต็มกรอบได้
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function apply(light){
    if(scale<1)scale=1;
    // clamp ให้แผนที่เต็มกรอบเสมอ ไม่หลุดไปเจอพื้นหลังเทา — แพนตอนซูมเข้าได้ลื่น ไม่เด้งกลับ
    tx=clamp(tx, M.width*(1-scale), 0);
    ty=clamp(ty, M.height*(1-scale), 0);
    zg.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);
    scaleMarkers();                       // วงหมายเลขเขตคงขนาดบนจอเสมอ ไม่พองตามซูม
    if(light)scaleLabels(); else updateLabels(false);
  }

  /* ---- บินเข้ากรอบแบบมีแอนิเมชัน (ไอเดียจาก elect.in.th: transition 750ms แล้วค่อยจัดป้าย) ----
     ระหว่างบินปรับแค่ขนาดตัวอักษร ไม่คำนวณการชนกันของป้าย (getBBox 77 ครั้ง/เฟรม = หนัก)
     พอบินจบค่อยจัดป้ายเต็มรูปแบบทีเดียว */
  let flyRaf=0;
  const easeOut=t=>1-Math.pow(1-t,3);
  const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  function cancelFly(){ if(flyRaf){cancelAnimationFrame(flyRaf);flyRaf=0;} }
  function flyTo(ns,ntx,nty,dur){
    cancelFly();
    if(dur==null)dur=750;
    // แท็บที่ถูกซ่อนอยู่ rAF จะหยุดเดิน → ถ้าเริ่มบินตอนนั้นแผนที่จะค้าง ข้ามไปผลลัพธ์สุดท้ายเลย
    if(dur<=0||document.hidden||reduceMotion()){scale=ns;tx=ntx;ty=nty;apply();updateLabels(true);return;}
    const s0=scale,x0=tx,y0=ty,t0=performance.now();
    const step=now=>{
      const u=Math.min(1,(now-t0)/dur),e=easeOut(u);
      scale=s0+(ns-s0)*e; tx=x0+(ntx-x0)*e; ty=y0+(nty-y0)*e;
      apply(u<1);
      if(u<1)flyRaf=requestAnimationFrame(step); else {flyRaf=0;updateLabels(true);}
    };
    flyRaf=requestAnimationFrame(step);
  }
  /* ---- ขนาดวงหมายเลขเขต: วัดเป็น "พิกเซลบนจอ" ไม่ใช่หน่วยแผนที่ ----
     เดิมคิดรัศมีจากขนาดกรอบจังหวัด → พอเปิดเพดานซูมเป็น 40 เท่า จังหวัดเล็กที่เขตเยอะ (กทม. 33 เขต)
     วงจะพองตามจนกลืนทั้งจังหวัด · เว็บอ้างอิงใช้ 20/16/12 พิกเซลตามจำนวนเขต แล้วหารด้วยสเกลปัจจุบัน
     (r = R_px / scale) วงจึงเท่าเดิมเสมอไม่ว่าซูมลึกแค่ไหน */
  let VBPP=1;          // หน่วย viewBox ต่อ 1 พิกเซลจอ — แคชไว้ อ่าน rect ทุกเฟรมทำให้เบราว์เซอร์คำนวณ layout ใหม่
  function refreshVBPP(){const r=svg.getBoundingClientRect();
    VBPP=(r.width&&r.height)?1/(Math.min(r.width/M.width,r.height/M.height)||1):1;}
  let fitScale=1;      // สเกลปลายทางของการบินเข้าจังหวัด — ใช้จัดวางวงตั้งแต่ก่อนบินถึงที่
  function mkRpx(N){const m=isMobile();return N<10?(m?15:19):N<16?(m?11:15):(m?8:11);}
  function mkR(N,s){return mkRpx(N)*VBPP/Math.max(s,1);}
  function scaleMarkers(){
    const N=+mkG.dataset.n||0; if(!N)return;
    // rcap = เพดานจากพื้นที่ว่างจริงในจังหวัด (จังหวัดที่โปรยจุดเอง) — ซูมออกแล้ววงต้องไม่โตจนทับกัน
    const r=Math.min(mkR(N,scale), +mkG.dataset.rcap||Infinity);
    mkG.querySelectorAll('.mk').forEach(g=>{
      const c=g.firstChild, t=g.lastChild;
      c.setAttribute('r',r);
      t.setAttribute('font-size',r*1.05);   // halo คุมที่ CSS (non-scaling-stroke) ไม่ต้องตั้งที่นี่
    });
  }
  refreshVBPP();
  addEventListener('resize',()=>{refreshVBPP();scaleMarkers();});
  function scaleLabels(){
    for(const l of labelEls){
      if(l.el.style.display==='none')continue;
      const fs=clamp(l.base/scale,2.4,60);
      l.el.setAttribute('font-size',fs); l.el.setAttribute('stroke-width',fs*0.2);
    }
  }
  function updateLabels(force){
    if(!force && lastLabelScale>0 && Math.abs(scale/lastLabelScale-1)<0.06) return;
    lastLabelScale=scale;
    const sorted=[...labelEls].sort((a,b)=>b.area-a.area), kept=[];

        for(let i=0;i<g;i++)for(let j=0;j<g;j++){const x=bb.x+bb.width*(i+.5)/g,y=bb.y+bb.height*(j+.5)/g;if(inFill(x,y))inside.push([x,y]);}
        if(!inside.length)inside.push([cx,cy]);
        // รัศมีวงกลมวัดเป็นพิกเซลบนจอ (mkR) แต่ห้ามใหญ่เกินพื้นที่ว่างจริงในจังหวัด ไม่งั้นจังหวัดเขตถี่จะทับกัน
        const fillFrac=Math.max(inside.length/(g*g),0.3), fillArea=fillFrac*bb.width*bb.height;
        rcap=0.46*Math.sqrt(fillArea/N);
        r=Math.min(mkR(N,fitScale), rcap);
        // กระจายจุดให้ห่างกันมากสุดเป็นจุดเริ่ม แล้ว “ผลัก” จุดที่ใกล้กันออกจากกันจนไม่ทับ (de-cluster) พร้อมดึงให้อยู่ในเขตจังหวัด
        const minSep=2*r*1.06;
        pts=spread(inside,N).map(p=>[p[0],p[1]]);
        for(let it=0;it<60;it++){
          for(let i=0;i<N;i++)for(let k=i+1;k<N;k++){
            let dx=pts[k][0]-pts[i][0],dy=pts[k][1]-pts[i][1],d=Math.hypot(dx,dy)||0.001;
            if(d<minSep){const push=(minSep-d)/2;dx/=d;dy/=d;pts[i][0]-=dx*push;pts[i][1]-=dy*push;pts[k][0]+=dx*push;pts[k][1]+=dy*push;}
          }
          for(const p of pts){
            p[0]=Math.max(bb.x+r,Math.min(bb.x+bb.width-r,p[0]));
            p[1]=Math.max(bb.y+r,Math.min(bb.y+bb.height-r,p[1]));
            if(it>=40&&!inFill(p[0],p[1])){p[0]+=(cx-p[0])*0.18;p[1]+=(cy-p[1])*0.18;}
          }
        }
        pts.sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
      }
      recs.forEach((rec,idx)=>{const p=pts[idx]||[cx,cy];
        const grp=document.createElementNS(NS,'g');grp.setAttribute('class','mk');grp.dataset.no=rec.no;
        grp.style.setProperty('--c', colorOf(rec.code));   // สีวงกลม = สีพรรคที่ชนะเขตนี้
        const c=document.createElementNS(NS,'circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',r);
        const t=document.createElementNS(NS,'text');t.setAttribute('x',p[0]);t.setAttribute('y',p[1]);
        t.setAttribute('font-size',r*1.05);t.textContent=rec.no;
        grp.appendChild(c);grp.appendChild(t);mkG.appendChild(grp);});
      mkG.dataset.n=N; if(rcap<Infinity)mkG.dataset.rcap=rcap; else delete mkG.dataset.rcap;
      scaleMarkers();                     // ถ้ายังบินไม่ถึง สเกลจริงต่างจาก fitScale → ปรับให้ตรงทันที
      const lab=labelEls.find(l=>l.en===en);if(lab){lab.el.style.display='none';hiddenLabel=lab.el;}
      updateLabels(true);
    });
  }
  function flashCard(no){const card=document.querySelector('#panelScroll .ccard[data-no="'+no+'"]');if(card){card.classList.add('flash');card.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>card.classList.remove('flash'),1500);}}
  function flashMarker(no){const mk=mkG.querySelector('.mk[data-no="'+no+'"]');if(mk){mk.classList.add('flash');setTimeout(()=>mk.classList.remove('flash'),1500);}}

  /* ---- panel content ---- */
  const panelScroll=document.getElementById('panelScroll'), search=document.getElementById('search');
  let curProvince=null;
  /* สระนำหน้า (เ แ โ ใ ไ) เขียนก่อนพยัญชนะต้น — "เอกนัฏ" ต้องได้ "อ" ไม่ใช่ "เ" */
  const LEAD_VOWELS=/[เแโใไ]/;
  const firstLetter=s=>(LEAD_VOWELS.test(s.charAt(0))&&s.length>1)?s.charAt(1):s.charAt(0);
  function initialOf(name){const t=name.replace(/^(นางสาว|นาง|นาย|ว่าที่ร้อยตรีหญิง|ว่าที่ร้อยตรี|ว่าที่|ดร\.|ผศ\.|รศ\.|ศ\.|พล[^ ]*|พ\.[^ ]*|ร\.[^ ]*|น\.[^ ]*|จ\.[^ ]*)\s*/,'').trim();return firstLetter(t)||firstLetter(name.replace(/\s/g,''))||'•';}
  function areaOf(r){return (window.ZONE_AREAS&&window.ZONE_AREAS[r.prov+'|'+(+r.no)])||'';}
  /* คลังรูปเก็บชื่อพร้อมคำนำหน้า ("นายกิตติ กิตติธรกุล") แต่ข้อมูลปีย้อนหลังจากวิกิพีเดียไม่มีคำนำหน้า
     → เทียบซ้ำอีกชั้นด้วยชื่อที่ตัดคำนำหน้าออก คนที่เคยมีรูปอยู่แล้วจะยังขึ้นรูปในปีเก่า */
  const bareName=s=>s.replace(/^(นางสาว|นาง|นาย|ว่าที่ร้อยตรีหญิง|ว่าที่ร้อยตรี|ว่าที่|ดร\.|ผศ\.|รศ\.|ศ\.|พล[^ ]*|พ\.[^ ]*|ร\.[^ ]*|น\.[^ ]*|จ\.[^ ]*)\s*/,'').replace(/\s+/g,' ').trim();
  let photoBare=null;
  function photoOf(name){
    const P=window.PHOTOS||{}; if(P[name])return P[name];
    if(!photoBare){photoBare={};Object.keys(P).forEach(k=>{const b=bareName(k);if(!(b in photoBare))photoBare[b]=P[k];});}
    return photoBare[bareName(name)]||null;
  }
  function candidateCard(r,showProv){
    const col=colorOf(r.code), ph=photoOf(r.name), area=areaOf(r);
    const inner = ph ? `<img class="cphoto" src="photos/${encodeURIComponent(ph)}" alt="" loading="lazy">` : initialOf(r.name);
    return `<div class="ccard" data-no="${r.no}" data-prov="${r.prov}">
      <div class="cav" style="background:${col};box-shadow:0 0 0 3px #fff,0 0 0 4px ${col}">${inner}${NOZONE?'':`<span class="cavno">${r.no}</span>`}</div>
      <div class="cinfo"><div class="ctop"><span class="cname">${r.name}</span><span class="cdist">${NOZONE?(showProv?r.prov:'ส.ส. '+r.prov):(showProv?r.prov+' ':'')+'เขต '+r.no}</span></div>
      <div class="cbot">${r.ballot!=null?`<span class="cno" title="เบอร์ผู้สมัคร">เบอร์ ${r.ballot}</span>`:''}<span class="cpt"><span class="sw" style="background:${col}"></span>${shortOf(r.code)}</span>${r.votes!=null?`<span class="cvt">${fmtN(r.votes)} คะแนน${r.pct!=null?` · ${r.pct}%`:''}${r.vsrc==='en'?`<span class="vsrc" title="คะแนนนี้มาจากวิกิพีเดียอังกฤษ (2001 Thai general election) เพราะวิกิพีเดียไทยยังไม่มีหน้ารายจังหวัดของปีนี้">†</span>`:''}</span>`:''}</div>
      ${r.note?`<div class="cnote">${r.note}</div>`:''}
      ${area?`<div class="carea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span class="ctxt">${area}</span></div>`:''}
      ${hasDetail(r)?`<div class="cmore" data-key="${r.prov}|${+r.no}">ดูผู้สมัครทุกคน &amp; สถิติเขต<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg></div>`:''}</div></div>`;}

  /* ---- รายละเอียดรายเขต: ผู้สมัครทุกคน + สถิติผู้มาใช้สิทธิ ----
     อยู่ในไฟล์แยก detail-<ปี>.js (ไฟล์ละ ~300–400KB) โหลดตอนกดกางครั้งแรกเท่านั้น
     เพิ่มปีใหม่ = สร้าง detail-<ปี>.js แล้วเติมเลขปีในลิสต์นี้ */
  const DETAIL_YEARS=[2569,2566,2562,2554,2550,2548,2544,2539];
  function hasDetail(r){return !NOZONE && DETAIL_YEARS.includes(+window.EYEAR) && r.prov && r.no!=null;}
  let detailReq=null;
  function ensureDetail(){
    if(window.EDETAIL) return Promise.resolve(window.EDETAIL);
    if(!DETAIL_YEARS.includes(+window.EYEAR)) return Promise.resolve(null);
    if(!detailReq) detailReq=new Promise(res=>{const s=document.createElement('script');s.src='detail-'+window.EYEAR+'.js';s.onload=()=>res(window.EDETAIL);s.onerror=()=>res(null);document.head.appendChild(s);});
    return detailReq;
  }
  /* loaded = โหลดไฟล์ของปีนั้นได้แล้วหรือยัง — แยก "โหลดไม่สำเร็จ" ออกจาก "ปีนั้นไม่มีข้อมูลเขตนี้"
     (เช่น 2544 วิกิพีเดียไทยมีหน้ารายจังหวัดแค่ 58 จังหวัด อีก 18 จังหวัดจึงไม่มีรายชื่อผู้สมัคร) */
  function detailHTML(d,loaded){
    if(!d) return `<div class="cdmiss">${loaded?'ยังไม่มีรายชื่อผู้สมัครรายคนของเขตนี้ในแหล่งข้อมูล':'โหลดรายละเอียดเขตไม่สำเร็จ'}</div>`;
    /* ปีย้อนหลังบางเขตแหล่งข้อมูลไม่มีสถิติ (หรือตัวเลขขัดกันเองจนตัดทิ้ง) → ไม่ต้องขึ้นแถบสถิติ */
    const s=d.stats;
    const cell=(k,v)=>v==null||v===''?'':`<div class="cdst"><span>${k}</span><b>${v}</b></div>`;
    const stat=!s?'':[['ผู้มีสิทธิเลือกตั้ง',fmtN(s.reg)],['ผู้มาใช้สิทธิ',s.turnout==null?'':fmtN(s.turnout)+(s.tpct?` (${s.tpct}%)`:'')],
      ['บัตรดี',fmtN(s.valid)],['บัตรเสีย',fmtN(s.invalid)],['ไม่ประสงค์ลงคะแนน',fmtN(s.blank)],['หน่วยเลือกตั้ง',fmtN(s.units)]]
      .map(([k,v])=>cell(k,v)).join('');
    const rows=(d.cands||[]).map((c,i)=>`<tr${i===0?' class="win"':''}>
        <td class="n">${c.b==null?'–':c.b}</td><td class="nm">${c.name}</td>
        <td class="pt"><span class="sw" style="background:${colorOf(c.code)}"></span>${shortOf(c.code)}</td>
        <td class="v">${fmtN(c.votes)}</td><td class="p">${c.pct==null?'':c.pct+'%'}</td></tr>`).join('');
    return (stat?`<div class="cdstats">${stat}</div>`:'')+
      `<table class="cdtab"><thead><tr><th>เบอร์</th><th>ผู้สมัคร</th><th>พรรค</th><th>คะแนน</th><th>%</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  function provinceRow(th){const st=provStats[th];return `<div class="prow" data-prov="${th}">
      <span class="dot" style="background:${fillOf(st)}"></span><span class="pn">${th}</span>
      <span class="zc"><b>${st.seats}</b> ${NOZONE?'คน':'เขต'}</span>
      <svg class="arr" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></div>`;}
  function renderList(){
    // ปีเก่าจังหวัดยังไม่ครบ 77 (บึงกาฬ ตั้งปี 2554 · สระแก้ว/หนองบัวลำภู/อำนาจเจริญ ปี 2536 ฯลฯ)
    panelScroll.innerHTML=`<div class="list-head">เลือกจังหวัด <span class="cnt">${provNames.length} จังหวัด</span></div>`+provNames.map(provinceRow).join('');
    bindRows();
  }
  function renderDetail(th){
    const st=provStats[th], recs=zoneRecs.filter(r=>r.prov===th).sort((a,b)=>(+a.no)-(+b.no));
    panelScroll.innerHTML=`<div class="dback" id="dback">‹ กลับไปทุกจังหวัด</div>
      <div class="dhead"><div class="dn">${th}</div><div class="dmeta"><span>${NOZONE?`ส.ส. ${st.seats} คน`:`${st.seats} เขตเลือกตั้ง`}</span>
        ${HEAT?'':`<span class="dwin"><span class="sw" style="background:${colorOf(st.winner)}"></span>ชนะ <b>${shortOf(st.winner)}</b></span>`}</div></div>
      <div class="dnote">${NOZONE
        ?`ปี ${window.EYEAR} แหล่งข้อมูลบันทึกไว้เป็นรายจังหวัด ยังไม่มีการแยกเขตเลือกตั้งในรูปดิจิทัล · ผู้ที่ยังไม่มีรูปจะแสดงเป็นอักษรย่อตามสีพรรค`
        :'แตะวงกลมหมายเลขเขตบนแผนที่เพื่อไฮไลต์ผู้สมัคร · ผู้ที่ยังไม่มีรูปจะแสดงเป็นอักษรย่อตามสีพรรค'}</div>`+
      recs.map(r=>candidateCard(r,false)).join('');
    renderMarkers(th);
    panelScroll.querySelectorAll('.ccard').forEach(c=>c.onclick=()=>flashMarker(c.dataset.no));
    document.getElementById('dback').onclick=()=>backToAll();
    panelScroll.scrollTop=0;
  }
  function bindRows(){panelScroll.querySelectorAll('.prow').forEach(row=>{
    row.onclick=()=>selectProvince(row.dataset.prov);
    row.onmouseenter=()=>{const p=pathEls[th2en[row.dataset.prov]];if(p&&!curProvince)p.classList.add('sel');};
    row.onmouseleave=()=>{const p=pathEls[th2en[row.dataset.prov]];if(p&&!curProvince)p.classList.remove('sel');};});}
  function selectProvince(th){curProvince=th;highlight(th);zoomToProvince(th);renderDetail(th);if(isMobile())expandSheet(true);}
  function renderSearch(q){q=q.trim().toLowerCase();
    if(!q){curProvince?renderDetail(curProvince):renderList();return;}
    clearMarkers();
    const hits=zoneRecs.filter(r=>r.name.toLowerCase().includes(q)||r.prov.toLowerCase().includes(q)||areaOf(r).toLowerCase().includes(q));
    if(!hits.length){panelScroll.innerHTML='<div class="empty">ไม่พบรายชื่อหรือจังหวัดที่ตรงกับคำค้น</div>';return;}
    panelScroll.innerHTML=`<div class="list-head">ผลการค้นหา <span class="cnt">${hits.length} คน</span></div>`+
      hits.slice(0,120).map(r=>candidateCard(r,true)).join('')+(hits.length>120?`<div class="empty">แสดง 120 คนแรกจาก ${hits.length}</div>`:'');
    panelScroll.querySelectorAll('.ccard[data-prov]').forEach(row=>row.onclick=()=>{search.value='';selectProvince(row.dataset.prov);});
  }
  // แตะบรรทัดพื้นที่เขตเพื่อกาง/พับข้อความเต็ม โดยไม่ไปกระตุ้น onclick ของการ์ด
  panelScroll.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('.carea');if(a){e.stopPropagation();a.classList.toggle('open');}},true);
  // แตะ "ดูผู้สมัครทุกคน" เพื่อกาง/พับตารางผู้สมัคร + สถิติเขต (โหลด detail-2569.js ครั้งแรกที่กด)
  panelScroll.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('.cmore'); if(!b) return;
    e.stopPropagation();
    const box=b.nextElementSibling;
    if(box&&box.classList.contains('cdet')){box.remove();b.classList.remove('open');return;}
    b.classList.add('open');
    const el=document.createElement('div'); el.className='cdet'; el.innerHTML='<div class="cdmiss">กำลังโหลด…</div>';
    b.after(el);
    ensureDetail().then(D=>{ if(el.isConnected) el.innerHTML=detailHTML(D&&D[b.dataset.key],!!D); });
  },true);
  search.addEventListener('input',e=>renderSearch(e.target.value));
  search.addEventListener('focus',()=>{if(isMobile())expandSheet(true);});
  renderList();

  /* ---- bottom sheet (mobile): คุมด้วยการ "ปัด" — ปัดขึ้น=ขยาย · ปัดลง=ย่อ · ปัดลงต่อ/แรง=ออก(กลับทุกจังหวัด) ---- */
  const panel=document.getElementById('panel'), grabber=document.getElementById('grabber'),
        legendbar=document.getElementById('legendbar');
  const PEEK=104, FLICK=0.45;                       // FLICK = px/ms ความเร็วขั้นต่ำที่นับว่า "สะบัด"
  function expandSheet(on){ if(isMobile()) panel.classList.toggle('expanded',on); }
  function sheetMaxT(){ return Math.max(0, panel.getBoundingClientRect().height - PEEK); }

  let sd=null;
  function sheetDown(e){
    if(!isMobile()) return;
    sd={id:e.pointerId, src:e.currentTarget, y0:e.clientY, t0:Date.now(),
        MT:sheetMaxT(), expanded:panel.classList.contains('expanded'), captured:false};
    sd.base = sd.expanded ? 0 : sd.MT;
  }
  function sheetMove(e){
    if(!sd || e.pointerId!==sd.id) return;
    const dy=e.clientY-sd.y0;
    if(!sd.captured){
      if(Math.abs(dy)<6) return;                     // ยังไม่ชัดว่าตั้งใจปัด
      // ในรายการที่กางอยู่: ปัดลงเฉพาะตอนเลื่อนสุดบนสุดเท่านั้นที่ใช้ย่อแผ่น นอกนั้นปล่อยให้เลื่อนรายการ
      if(sd.src===panelScroll && sd.expanded && !(dy>0 && panelScroll.scrollTop<=0)){ sd=null; return; }
      sd.captured=true; panel.classList.add('dragging');
      try{sd.src.setPointerCapture(sd.id)}catch(_){}
    }
    const over = sd.expanded?120:90;                  // ลากเลย peek ลงได้นิดเพื่อสั่ง "ออก"
    panel.style.transform='translateY('+clamp(sd.base+dy,0,sd.MT+over)+'px)';
  }
  function sheetUp(e){
    if(!sd || e.pointerId!==sd.id) return;
    const MT=sd.MT, dy=e.clientY-sd.y0, dt=Math.max(1,Date.now()-sd.t0), v=dy/dt; // v>0 = ปัดลง
    const m=/translateY\(([-\d.]+)px\)/.exec(panel.style.transform), t=m?+m[1]:sd.base;
    const wasExpanded=sd.expanded, captured=sd.captured, src=sd.src;
    panel.style.transform=''; panel.classList.remove('dragging');
    try{src.releasePointerCapture(sd.id)}catch(_){}
    sd=null;
    if(!captured){ if(src===grabber) panel.classList.toggle('expanded'); return; } // แตะเบา ๆ ก็ยังสลับได้
    // ปัดออก: ลากเลย peek ลงไป หรือสะบัดลงแรงตอนอยู่ที่ peek ขณะดูจังหวัด → กลับหน้าเลือกจังหวัด
    if(curProvince && (t>MT+18 || (!wasExpanded && (v>FLICK || dy>56)))){ backToAll(); return; }
    if(v<-FLICK)      panel.classList.add('expanded');             // สะบัดขึ้น → ขยาย
    else if(v>FLICK)  panel.classList.remove('expanded');          // สะบัดลง → ย่อ
    else              panel.classList.toggle('expanded', t<MT/2);  // ไม่สะบัด → ตัดสินตามตำแหน่ง
  }
  [grabber, legendbar, panelScroll].forEach(el=>{
    el.addEventListener('pointerdown',sheetDown);
    el.addEventListener('pointermove',sheetMove);
    el.addEventListener('pointerup',sheetUp);
    el.addEventListener('pointercancel',sheetUp);
  });

  apply();
})();
</script>
