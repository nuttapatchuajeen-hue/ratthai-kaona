# รวมงานเว็บ md — static site, ไม่มีขั้นตอน build
#
# ── สถานะโฮสต์ ณ 16 ก.ย. 2026 ────────────────────────────────────────────
# เว็บตัวจริงตอนนี้คือ Vercel:
#   https://ratthai-kaona.vercel.app
# canonical/og ทุกหน้า (27 บรรทัด ใน 9 ไฟล์ html) ชี้มาที่นี่
#
# ทำไมถึงเป็น Vercel:
#   · Netlify (thaigovernmentdata.netlify.app) โดนพัก production deploys เพราะทีมชนโควตา
#     ไซต์ยัง live แต่ค้างที่ main@b58bb3f และ deploy ใหม่ไม่ได้จนกว่าโควตาจะคืน
#   · GitHub Pages ใช้ไม่ได้ เพราะรีโปนี้เป็น private (Pages + private ต้องใช้แพลนเสียเงิน)
#   · Vercel เป็นตัวเดียวที่ auto-deploy ได้ปกติกับ repo private
#
# ⚠️ ปัญหาที่ยังค้างและแก้ไม่ได้ตอนนี้:
#   หน้าเวอร์ชันเก่าที่ค้างอยู่บน Netlify ประกาศ canonical เป็น github.io ซึ่ง 404
#   แก้ไม่ได้เพราะ deploy ทับไม่ได้ — จะหายเองเมื่อโควตา Netlify คืนแล้ว build คอมมิตใหม่
#
# ถ้าจะย้ายกลับ Netlify ตอนโควตาคืน ทำตามลำดับนี้:
#   1) ปล่อยให้ Netlify build คอมมิตล่าสุดจนสำเร็จก่อน (auto publishing เปิดอยู่แล้ว)
#   2) ยืนยันว่า thaigovernmentdata.netlify.app เสิร์ฟของใหม่จริง
#   3) แล้วค่อยเปลี่ยน canonical/og 27 บรรทัด → thaigovernmentdata.netlify.app
#   ห้ามสลับ canonical ก่อนข้อ 2 เด็ดขาด
#
# ── ไฟล์นี้ยังจำเป็น ────────────────────────────────────────────────────
# ห้ามลบ redirect กับ headers ด้านล่างยังถูกใช้กับไซต์ Netlify ที่ยัง live อยู่
# โดยเฉพาะ /api/yt-search ซึ่ง js/cyber-audio.js เรียกด้วย URL เต็มเมื่ออยู่โฮสต์อื่น
#
# ── ระวังสับสน ─────────────────────────────────────────────────────────
# Netlify ยังถูกใช้จริงอีกที่ แต่เป็น "คนละไซต์" —
#   md-ai-proxy-nook.netlify.app = proxy ของผู้ช่วย AI และแบบประเมิน
#   (js/ai-chat.js · hub/js/voices.js · hub/survey.html)
# ไฟล์นี้ไม่ได้ตั้งค่าไซต์นั้น แก้ไฟล์นี้ไม่กระทบ AI chat หรือแบบประเมิน
[build]
  publish = "."

[[redirects]]
  from = "/api/yt-search"
  to = "https://ratthai-kaona.vercel.app/api/yt-search"
  status = 200
  force = true

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/css/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
