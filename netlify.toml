# รวมงานเว็บ md — static site, ไม่มีขั้นตอน build
#
# เว็บที่ใช้งานจริงเสิร์ฟจาก Netlify:
#   https://thaigovernmentdata.netlify.app
# ยืนยันแล้ว (2026-09-16) ว่ารีโปนี้ผูกกับไซต์ Netlify ชื่อ "thaigovernmentdata" จริง
# → ห้ามลบไฟล์นี้ redirect กับ headers ด้านล่างถูก deploy ใช้งานอยู่
#
# GitHub Pages (https://nuttapatchuajeen-hue.github.io/ratthai-kaona/) ปิดไปแล้ว ตอนนี้ตอบ 404
# .nojekyll ในรูทจึงไม่มีผลอะไรแล้ว ส่วน 404.html ไม่ต้องแก้ — logic หา base path รองรับ
# ทั้ง /ratthai-kaona/ ของ Pages และ / ของ Netlify ไว้อยู่แล้ว
#
# ratthai-kaona.vercel.app เสิร์ฟเนื้อหาชุดเดียวกัน แต่เป็นตัวสำรอง —
# canonical/og:url ทุกหน้าชี้มาที่ thaigovernmentdata.netlify.app เพื่อไม่ให้ Google
# มองเป็น duplicate content
#
# ระวังสับสน: Netlify ยังถูกใช้จริงในโปรเจกต์อีกที่ แต่เป็น "คนละไซต์" —
#   md-ai-proxy-nook.netlify.app = proxy ของผู้ช่วย AI และแบบประเมิน
#   (js/ai-chat.js · hub/js/voices.js · hub/survey.html)
# ไฟล์นี้ไม่ได้ตั้งค่าไซต์นั้น แก้ไฟล์นี้ไม่กระทบ AI chat หรือแบบประเมิน
[build]
  publish = "."

[[redirects]]
  from = "/api/yt-search"
  to = "https://ratthai-kaona.vercel.app/api/yt-search"
  status = 200
  force = true

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/css/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
