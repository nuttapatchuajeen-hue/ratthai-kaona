# รวมงานเว็บ md — static site, ไม่มีขั้นตอน build
#
# ── สถานะโฮสต์ ณ 16 ก.ย. 2026 ────────────────────────────────────────────
# เว็บตัวจริงตอนนี้เสิร์ฟจาก GitHub Pages (ย้ายมา "ชั่วคราว"):
#   https://nuttapatchuajeen-hue.github.io/ratthai-kaona/
#
# เหตุผลที่ย้าย: ทีม Netlify ชนโควตา production deploys เลยถูกพัก
# ไซต์ thaigovernmentdata.netlify.app ยัง live อยู่ แต่ค้างที่ main@b58bb3f
# และ deploy ใหม่ไม่ได้จนกว่าจะ upgrade หรือรอบบิลใหม่มาถึง
#
# เพื่อให้ย้ายมา Pages ได้ รีโปนี้ถูกเปลี่ยนเป็น public (Pages กับ repo private
# ต้องใช้แพลนเสียเงิน) และ canonical/og ทุกหน้าถูกชี้กลับมาที่ github.io แล้ว
#
# ⚠️ พอโควตา Netlify กลับมา ถ้าจะย้ายกลับต้องแก้ 2 อย่างคู่กัน:
#   1) canonical/og 26 บรรทัดใน 9 ไฟล์ html → กลับเป็น thaigovernmentdata.netlify.app
#   2) เช็กว่า Netlify deploy คอมมิตล่าสุดสำเร็จจริงก่อน แล้วค่อยสลับ canonical
#   (Netlify ต่อกับ repo นี้และเปิด auto publishing ไว้อยู่แล้ว จะ build เองเมื่อโควตากลับมา)
#
# ── ไฟล์นี้ยังจำเป็น ────────────────────────────────────────────────────
# ห้ามลบ redirect กับ headers ด้านล่างยังถูกใช้กับไซต์ Netlify ที่ยัง live อยู่
# โดยเฉพาะ /api/yt-search ซึ่ง js/cyber-audio.js เรียกด้วย URL เต็มจาก Pages
# (Pages ทำ redirect แบบนี้ไม่ได้ จึงยังต้องยืมของ Netlify ใช้)
#
# ── ระวังสับสน ─────────────────────────────────────────────────────────
# Netlify ยังถูกใช้จริงอีกที่ แต่เป็น "คนละไซต์" —
#   md-ai-proxy-nook.netlify.app = proxy ของผู้ช่วย AI และแบบประเมิน
#   (js/ai-chat.js · hub/js/voices.js · hub/survey.html)
# ไฟล์นี้ไม่ได้ตั้งค่าไซต์นั้น แก้ไฟล์นี้ไม่กระทบ AI chat หรือแบบประเมิน
[build]
  publish = "."

[[redirects]]
  from = "/api/yt-search"
  to = "https://ratthai-kaona.vercel.app/api/yt-search"
  status = 200
  force = true

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/css/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
