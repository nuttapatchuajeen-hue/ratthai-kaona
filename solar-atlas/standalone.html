<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>แผนที่ระบบสุริยะ</title>
<meta name="description" content="แผนที่ระบบสุริยะแบบ 3 มิติ คำนวณตำแหน่งดาวเคราะห์ตามเวลาจริงจากองค์ประกอบวงโคจรเคปเลอร์ พื้นผิวทั้งหมดสร้างด้วยโค้ด ไม่ใช้ไฟล์ภาพจากที่ใด">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap">
<style>
/* ══ แผนที่ระบบสุริยะ · ธีมเดียว: คอนโซลสังเกตการณ์กลางคืน ══════════════
   จงใจไม่ทำธีมสว่าง — หน้าจอนี้คือหน้าต่างมองอวกาศ พื้นหลังมืดคือเนื้อหา
   ทุกสีประกาศชัดเจน ไม่พึ่งค่า default ของ host                        */
:root{
  --void:#05070c; --deep:#080d16;
  --panel:rgba(9,14,23,.86); --panel-2:rgba(13,19,30,.94);
  --line:rgba(122,152,192,.18); --line-2:rgba(140,175,215,.34);
  --ink:#e8eef7; --ink-2:#a7b7cc; --muted:#6d7e95;
  --amber:#ffb454; --amber-2:#c78a3c; --amber-ink:#1b1204;
  --live:#54e0b6; --warn:#ff7b6b;
  --r:3px; --shadow:0 20px 60px rgba(0,0,0,.6);
  --ui:"IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--ui); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow:hidden; overscroll-behavior:none;
}
button,input,select{font:inherit; color:inherit}
button{background:none; border:0; cursor:pointer; padding:0}
:focus-visible{outline:1.5px solid var(--amber); outline-offset:2px}
::selection{background:var(--amber); color:var(--amber-ink)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ── เวที 3 มิติ ───────────────────────────────────────────────────── */
#stage{position:fixed; inset:0}
#gl{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
#gl.dragging{cursor:grabbing}
#labels{position:absolute; inset:0; pointer-events:none; overflow:hidden}

.lbl{position:absolute; transform:translate(-50%,-50%); pointer-events:auto; cursor:pointer;
  display:flex; align-items:center; gap:7px; white-space:nowrap;
  padding:3px 9px 3px 3px; border-radius:20px; transition:background .15s, opacity .25s}
.lbl:hover{background:rgba(10,16,26,.75)}
.lbl .ring{width:11px; height:11px; border-radius:50%; border:1.5px solid currentColor; flex:none;
  box-shadow:0 0 8px currentColor; transition:transform .15s}
.lbl:hover .ring{transform:scale(1.35)}
.lbl .nm{font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink); text-shadow:0 1px 6px #000, 0 0 14px #000}
.lbl.moon .nm{font-size:9.5px; color:var(--ink-2)}
.lbl.moon .ring{width:7px; height:7px}
/* วัตถุขนาดเล็ก: ป้ายชื่อเล็กลงหนึ่งขั้นเพื่อไม่ให้แย่งสายตาจากดาวเคราะห์ */
.lbl.small .nm{font-size:9.5px; color:var(--ink-2); letter-spacing:.06em}
.lbl.small .ring{width:8px; height:8px; border-width:1px}
/* ระบบดาวเคราะห์นอกระบบ */
.lbl.exo{padding:1px 7px}
.lbl.exo .ring{display:none}
.lbl.exo .nm{font-size:9px; letter-spacing:.08em; color:#78f0c8; text-transform:none}
.lbl.exo.on .nm{color:var(--amber)}
.exochart{width:100%; display:block; margin:2px 0 8px}
.exochart .axis{stroke:var(--line-2); stroke-width:1}
.exochart .axis.dim{stroke:var(--line)}
.exochart .hz{fill:rgba(84,224,182,.16); stroke:rgba(84,224,182,.42); stroke-width:.7}
.exochart .hzt{font-family:var(--mono); font-size:6.5px; fill:var(--live); letter-spacing:.06em}
.exochart .tick{font-family:var(--mono); font-size:6.5px; fill:var(--muted)}
.exochart .pn{font-family:var(--mono); font-size:6.5px; fill:var(--ink-2)}
.exochart .host{fill:#ffd88a}
.exochart .pl{fill:#9fb6d4}
.exochart .pl.rocky{fill:#7fd7a8}
.exochart .pl.mid{fill:#7fc4e8}
.exochart .pl.giant{fill:#e8b878}
.exochart .pl.sol{fill:none; stroke:var(--muted); stroke-width:1}
.exotab{display:flex; flex-direction:column}
.exorow{padding:6px 0; border-top:1px solid rgba(122,152,192,.09)}
.exorow:first-child{border-top:0}
.exorow b{font-weight:500; font-size:12.5px; color:var(--ink); margin-right:7px}
.exorow span{font-family:var(--mono); font-size:11px; color:var(--ink-2)}
.exorow small{display:block; font-family:var(--mono); font-size:9.5px; color:var(--muted)}

/* กาแล็กซีเพื่อนบ้าน */
.lbl.deep{padding:2px 8px}
.lbl.deep .ring{width:5px; height:5px; border-color:rgba(200,220,255,.6); box-shadow:none}
.lbl.deep .nm{font-size:9px; letter-spacing:.12em; color:#c6d6ee; text-transform:none}
.lbl.deep.big .ring{width:8px; height:8px; border-color:#dbe7fb}
.lbl.deep.big .nm{font-size:10.5px; color:#eaf1ff}
.lbl.deep:hover .nm{color:var(--amber)}
.lbl.bhn{padding:2px 8px}
.lbl.bhn .ring{width:7px; height:7px; border-width:1px; box-shadow:0 0 6px currentColor}
.lbl.bhn .nm{font-size:9.5px; letter-spacing:.08em; text-transform:none; color:#f3dcc4}

/* ป้ายในกาแล็กซี: บอกแขนกังหันและตำแหน่งของเรา */
.lbl.gal{padding:2px 8px}
.lbl.gal .ring{width:6px; height:6px; border-color:rgba(255,255,255,.5); box-shadow:none}
.lbl.gal .nm{font-size:9px; letter-spacing:.16em; color:#c8d6ea; text-transform:none}
.lbl.gal.big .ring{width:9px; height:9px; border-color:var(--amber); box-shadow:0 0 8px var(--amber)}
.lbl.gal.big .nm{color:var(--amber); font-size:10px}

/* กลุ่มดาว: ตัวหนังสือจาง ๆ วางกลางกลุ่ม ไม่มีเครื่องหมายนำหน้า */
.lbl.cons{padding:2px 8px}
.lbl.cons .ring{display:none}
.lbl.cons .nm{font-size:9px; letter-spacing:.24em; color:#9fc0ea; font-weight:400}
.lbl.cons:hover .nm{color:var(--amber)}
/* มองจากนอกระบบสุริยะ: ชื่อกลุ่มดาวใหญ่ขึ้น เว้นระยะกว้างแบบ Eyes */
.lbl.cons.far .nm{font-size:12px; letter-spacing:.34em; color:#5d9ee8}
.lbl.cons.far.th .nm{font-size:12.5px; letter-spacing:.1em}
.lbl.cons.far:hover .nm{color:var(--amber)}

/* ดาวฤกษ์: ไม่มีวงกลมนำหน้า เพราะตัวดาวเองคือจุดสว่างอยู่แล้ว */
.lbl.star{padding:2px 7px}
.lbl.star .ring{display:none}
.lbl.star .nm{font-size:9.5px; letter-spacing:.1em; color:inherit; opacity:.95}
/* ดาวที่มีแต่ชื่อไบเออร์ (γ Lup): อักษรกรีกต้องเป็นตัวเล็ก ห้ามแปลงเป็นตัวใหญ่ */
.lbl.star.bay .nm{text-transform:none; letter-spacing:.04em}

/* ยานอวกาศ: เครื่องหมายเป็นสี่เหลี่ยมมุมมน บอกว่าไม่ใช่วัตถุธรรมชาติ */
.lbl.craft .nm{font-size:10px; color:var(--ink); letter-spacing:.07em}
.lbl.craft .ring{width:9px; height:9px; border-radius:2px; transform:rotate(45deg)}
.lbl.craft:hover .ring{transform:rotate(45deg) scale(1.3)}
/* กฎ .on ต้องอยู่ท้ายสุด ไม่งั้นสีของ .moon/.small จะทับสีเป้าหมายที่กำลังเจาะจง */
.lbl.on .nm{color:var(--amber)}
.lbl.dim{opacity:.45}

/* ── แถบบน ─────────────────────────────────────────────────────────── */
#topbar{position:fixed; top:0; left:0; right:0; height:46px; display:flex; align-items:center; gap:14px;
  padding:0 12px; background:linear-gradient(180deg,rgba(5,7,12,.94),rgba(5,7,12,0)); z-index:30}
.brand{display:flex; align-items:center; gap:9px; flex:none}
.brand .mark{width:17px; height:17px; border-radius:50%; border:1.5px solid var(--amber); position:relative}
.brand .mark::after{content:""; position:absolute; width:4px; height:4px; border-radius:50%;
  background:var(--amber); top:-2px; left:calc(50% - 2px); box-shadow:0 0 7px var(--amber)}
.brand b{font-weight:600; font-size:15px; letter-spacing:.01em}
.brand .sub{font-family:var(--mono); font-size:9.5px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase}
.crumb{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-2); min-width:0; overflow:hidden}
.crumb i{color:var(--line-2); font-style:normal}
.crumb b{color:var(--amber); font-weight:500}
.top-actions{margin-left:auto; display:flex; align-items:center; gap:4px; flex:none}
.tbtn{display:flex; align-items:center; gap:7px; height:30px; padding:0 11px; border:1px solid transparent;
  border-radius:var(--r); color:var(--ink-2); font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
  text-transform:uppercase; transition:.15s}
.tbtn:hover{color:var(--ink); border-color:var(--line); background:rgba(255,255,255,.05)}
.tbtn.on{color:var(--amber); border-color:var(--amber-2); background:rgba(255,180,84,.1)}
.tbtn svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.6}

/* ── แผงซ้าย ───────────────────────────────────────────────────────── */
#rail{position:fixed; left:12px; top:56px; bottom:108px; width:326px; z-index:25;
  display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.4,0,.2,1)}
#rail.closed{transform:translateX(calc(-100% - 14px))}
.tabs{display:flex; gap:1px; background:var(--line); border:1px solid var(--line); border-bottom:0;
  border-radius:var(--r) var(--r) 0 0; overflow:hidden; flex:none}
.tabs button{flex:1; height:34px; background:var(--panel); font-family:var(--mono); font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted); transition:.15s; backdrop-filter:blur(14px)}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--amber); background:var(--panel-2); box-shadow:inset 0 -2px 0 var(--amber)}
.panes{flex:1; min-height:0; overflow-y:auto; background:var(--panel); backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:0 0 var(--r) var(--r); box-shadow:var(--shadow);
  scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
.panes::-webkit-scrollbar{width:8px}
.panes::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:8px}
.pane{padding:16px}
.sec{padding:14px 0; border-top:1px solid var(--line)}
.sec:first-child{border-top:0; padding-top:0}
.sec:last-child{padding-bottom:0}
.sec > h3{margin:0 0 10px; font-family:var(--mono); font-size:9.5px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--muted); font-weight:500}
#railToggle{position:absolute; left:calc(100% + 6px); top:0; width:22px; height:34px; border:1px solid var(--line);
  border-radius:var(--r); background:var(--panel); color:var(--muted); font-size:13px; backdrop-filter:blur(14px);
  display:flex; align-items:center; justify-content:center; transition:.15s}
#railToggle:hover{color:var(--amber); border-color:var(--amber-2)}
#railToggle svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s ease; transform:rotate(90deg)}
#rail.closed #railToggle svg{transform:rotate(-90deg)}
#consoleToggle{display:none}

.obj-head{display:flex; gap:12px; align-items:center}
.obj-swatch{width:48px; height:48px; border-radius:50%; flex:none; overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 0 30px -8px var(--glow,#888)}
.obj-swatch canvas{width:100%; height:100%; display:block}
.obj-title h2{margin:0; font-size:22px; font-weight:500; line-height:1.2}
.obj-title .kind{display:flex; align-items:center; gap:6px; margin-top:4px}
.obj-title .kind em{width:7px; height:7px; border-radius:50%; background:var(--glow,#888); font-style:normal}
.obj-title .kind span{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2)}
.desc{margin:13px 0 0; color:var(--ink-2); font-size:13.5px; font-weight:300}

.readout{display:grid; grid-template-columns:1fr auto; gap:7px 12px; align-items:baseline; margin:0}
.readout dt{font-size:12.5px; color:var(--muted); font-weight:300}
.readout dd{margin:0; font-family:var(--mono); font-size:12.5px; font-variant-numeric:tabular-nums;
  text-align:right; color:var(--ink)}
.readout dd u{text-decoration:none; color:var(--muted); font-size:10px; margin-left:3px; letter-spacing:.04em}
.readout.live dd{color:var(--live)}

.rows{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid rgba(122,152,192,.09)}
.row:first-child{border-top:0}
.row label{flex:1; font-size:13px; font-weight:300; color:var(--ink-2); cursor:pointer}
.sw{position:relative; width:34px; height:18px; border-radius:10px; border:1px solid var(--line-2);
  background:rgba(255,255,255,.05); flex:none; transition:.18s}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%;
  background:var(--muted); transition:.18s}
.sw.on{border-color:var(--amber-2); background:rgba(255,180,84,.16)}
.sw.on::after{transform:translateX(16px); background:var(--amber); box-shadow:0 0 8px var(--amber)}

.seg{display:flex; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.seg button{flex:1; height:30px; background:rgba(255,255,255,.02); font-family:var(--mono); font-size:9.5px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--muted); transition:.15s; padding:0 6px}
.seg button:hover{color:var(--ink-2); background:rgba(255,255,255,.06)}
.seg button.on{color:var(--amber-ink); background:var(--amber); font-weight:600}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:6px; height:27px; padding:0 11px; border:1px solid var(--line);
  border-radius:20px; font-size:12.5px; color:var(--ink-2); transition:.15s; font-weight:300}
.chip em{width:7px; height:7px; border-radius:50%; font-style:normal; flex:none}
.chip:hover{border-color:var(--line-2); color:var(--ink); background:rgba(255,255,255,.05)}
.chip.on{border-color:var(--amber-2); color:var(--amber); background:rgba(255,180,84,.1)}

/* เปรียบเทียบขนาด */
.cmp{display:flex; align-items:flex-end; gap:16px; justify-content:center; padding:6px 0 10px; min-height:96px}
.cmp figure{margin:0; display:flex; flex-direction:column; align-items:center; gap:8px}
.cmp .disc{border-radius:50%; box-shadow:0 0 0 1px rgba(255,255,255,.16); flex:none}
.cmp figcaption{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.cmp figcaption b{display:block; color:var(--ink); font-size:11px; letter-spacing:.04em; font-weight:500}

/* ── คอนโซลเวลา ────────────────────────────────────────────────────── */
#console{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:28;
  background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:9px 14px 7px; display:flex; flex-direction:column; gap:6px;
  width:min(580px,calc(100vw - 24px))}
.crow{display:flex; align-items:center; gap:14px}
.transport{display:flex; align-items:center; gap:2px; flex:none}
.transport button{width:30px; height:28px; display:flex; align-items:center; justify-content:center;
  border-radius:var(--r); color:var(--ink-2); transition:.15s}
.transport button:hover{color:var(--amber); background:rgba(255,255,255,.06)}
.transport button svg{width:14px; height:14px; fill:currentColor}
.transport .play{color:var(--ink)}
.clock{display:flex; flex-direction:column; line-height:1.28; min-width:130px; flex:none; cursor:pointer; user-select:none; transition:opacity .15s}
.clock:hover{opacity:.9}
.clock .d{font-family:var(--mono); font-size:13px; letter-spacing:.03em; font-variant-numeric:tabular-nums}
.clock .t{font-family:var(--mono); font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:5px}
.clock:hover .t{color:var(--amber)}
.clock .tz-tag{font-size:9.5px; opacity:.9; padding:1px 5px; border-radius:3px; background:rgba(255,255,255,.08); color:var(--ink-2); white-space:nowrap; border:1px solid rgba(255,255,255,.12); transition:all .15s}
.clock:hover .tz-tag{background:rgba(255,180,84,.22); color:var(--amber); border-color:var(--amber-2)}
.live-dot{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap; flex:none}
.live-dot i{width:7px; height:7px; border-radius:50%; background:var(--muted); font-style:normal; flex:none}
.live-dot.on{color:var(--live)}
.live-dot.on i{background:var(--live); box-shadow:0 0 9px var(--live); animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}
.rate{margin-left:auto; text-align:right; white-space:nowrap; flex:none}
.rate b{font-family:var(--mono); font-size:12.5px; font-weight:500; color:var(--amber); font-variant-numeric:tabular-nums}
.rate span{display:block; font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
#scrub{-webkit-appearance:none; appearance:none; width:100%; height:14px; background:none; cursor:ew-resize; margin:0}
#scrub::-webkit-slider-runnable-track{height:2px; background:linear-gradient(90deg,var(--line-2),var(--amber-2),var(--line-2))}
#scrub::-webkit-slider-thumb{-webkit-appearance:none; width:13px; height:13px; margin-top:-5.5px; border-radius:50%;
  background:var(--amber); box-shadow:0 0 10px var(--amber), 0 0 0 3px rgba(255,180,84,.18)}
#scrub::-moz-range-track{height:2px; background:var(--line-2)}
#scrub::-moz-range-thumb{width:13px; height:13px; border:0; border-radius:50%; background:var(--amber)}
.ghost{height:25px; padding:0 10px; border:1px solid var(--line); border-radius:var(--r); color:var(--ink-2);
  font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; transition:.15s; flex:none}
.ghost:hover{color:var(--amber); border-color:var(--amber-2)}
#jump{background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:var(--r);
  padding:3px 6px; font-family:var(--mono); font-size:10.5px; color:var(--ink-2); color-scheme:dark}

/* ── แถบเครื่องมือขวา ──────────────────────────────────────────────── */
#rrail{position:fixed; right:12px; top:50%; transform:translateY(-50%); z-index:25; display:flex;
  flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
#rrail button{width:34px; height:32px; display:flex; align-items:center; justify-content:center;
  background:var(--panel); color:var(--ink-2); backdrop-filter:blur(14px); transition:.15s}
#rrail button:hover{color:var(--amber); background:var(--panel-2)}
#rrail button.on{color:var(--amber); background:rgba(255,180,84,.13); box-shadow:inset 2px 0 0 var(--amber)}
#rrail svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round}

/* ── แผ่นซ้อน ──────────────────────────────────────────────────────── */
.overlay{position:fixed; inset:0; z-index:40; background:rgba(3,5,9,.66); backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center; padding:62px 16px 16px}
.sheet{width:min(580px,100%); max-height:min(74vh,640px); overflow-y:auto; background:var(--panel-2);
  border:1px solid var(--line-2); border-radius:var(--r); box-shadow:var(--shadow); backdrop-filter:blur(18px)}
.sheet > header{position:sticky; top:0; background:var(--panel-2); padding:12px 14px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; z-index:1}
.sheet > header h3{margin:0; font-size:14px; font-weight:500; flex:1}
#q{flex:1; height:32px; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:var(--r);
  padding:0 10px; font-size:13px}
#q::placeholder{color:var(--muted)}
.sheet .body{padding:14px}
.group{margin-bottom:16px}
.group:last-child{margin-bottom:0}
.group h4{margin:0 0 8px; font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--muted); font-weight:500}
.hits{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px}
.hit{display:flex; align-items:center; gap:9px; padding:7px 10px; border:1px solid var(--line);
  border-radius:var(--r); text-align:left; transition:.15s}
.hit:hover{border-color:var(--amber-2); background:rgba(255,180,84,.08)}
.hit em{width:9px; height:9px; border-radius:50%; font-style:normal; flex:none; box-shadow:0 0 8px currentColor}
.hit b{font-weight:400; font-size:13px; display:block}
.hit small{display:block; font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.prose{font-size:13.5px; color:var(--ink-2); font-weight:300; max-width:64ch}
.prose h4{color:var(--ink); font-size:13px; font-weight:500; margin:16px 0 6px}
.prose h4:first-child{margin-top:0}
.prose p{margin:0 0 10px}
.prose code{font-family:var(--mono); font-size:12px; color:var(--amber); background:rgba(255,180,84,.1);
  padding:1px 5px; border-radius:2px}
.prose ul{margin:0 0 10px; padding-left:18px}
.prose li{margin-bottom:5px}
.prose a{color:var(--live)}

/* ── กำลังโหลด ─────────────────────────────────────────────────────── */
#loading{position:fixed; inset:0; z-index:60; background:var(--void); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; transition:opacity .7s}
#loading.gone{opacity:0; pointer-events:none}
#loading .orbit{width:56px; height:56px; border-radius:50%; border:1px solid var(--line-2); position:relative}
#loading .orbit::after{content:""; position:absolute; top:-3px; left:calc(50% - 3px); width:6px; height:6px;
  border-radius:50%; background:var(--amber); box-shadow:0 0 12px var(--amber);
  transform-origin:3px 31px; animation:orb 2.8s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
#loading .bar{width:212px; height:2px; background:var(--line)}
#loading .bar i{display:block; height:100%; width:0; background:var(--amber); box-shadow:0 0 10px var(--amber); transition:width .25s}
#loadTxt{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}

#hint{position:fixed; left:50%; bottom:126px; transform:translateX(-50%); z-index:20; font-family:var(--mono);
  font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-shadow:0 1px 8px #000;
  transition:opacity .6s; pointer-events:none; text-align:center}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

@media (max-width:900px){
  #rail{left:0; right:0; top:auto; bottom:0; width:100%; max-height:54vh; padding-bottom:env(safe-area-inset-bottom,0px)}
  #rail.closed{transform:translateY(calc(100% - 34px - env(safe-area-inset-bottom,0px)))}
  .tabs{border-radius:0; padding-right:44px}
  .panes{border-radius:0; border-bottom:0}
  #railToggle{
    left:auto; right:0; top:0; width:44px; height:34px;
    border:0; border-left:1px solid var(--line); border-top:1px solid var(--line);
    border-radius:0; background:var(--panel); color:var(--ink-2);
    backdrop-filter:blur(14px); z-index:5; transform:none;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s, color .15s;
  }
  #railToggle:hover, #railToggle:active{color:var(--amber); background:var(--panel-2)}
  #railToggle svg{transform:rotate(0deg)}
  #rail.closed #railToggle svg{transform:rotate(180deg)}
  #console{bottom:auto; top:52px; padding:7px 10px; transition:gap .2s ease, padding .2s ease}
  #console .crow{gap:8px}
  .clock{min-width:auto}
  #consoleToggle{
    display:flex; align-items:center; justify-content:center;
    width:28px; height:28px; margin-left:6px; border:1px solid var(--line);
    border-radius:var(--r); background:rgba(255,255,255,.04); color:var(--muted);
    transition:.15s; flex:none;
  }
  #consoleToggle:hover, #consoleToggle:active{
    color:var(--amber); border-color:var(--amber-2); background:rgba(255,180,84,.12);
  }
  #consoleToggle svg{
    width:13px; height:13px; stroke:currentColor; fill:none;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    transition:transform .25s ease;
  }
  #console.collapsed #consoleToggle svg{transform:rotate(180deg)}
  #console.collapsed #scrub,
  #console.collapsed .crow:last-child{display:none !important}
  #console.collapsed{gap:0; padding:6px 10px}
  #rrail{top:auto; bottom:calc(54vh + 12px); transform:none; flex-direction:row; transition:bottom .3s cubic-bezier(.4,0,.2,1)}
  #rail.closed ~ #rrail{bottom:calc(34px + 12px + env(safe-area-inset-bottom,0px))}
  #hint{display:none}
  .brand .sub{display:none}
  .crumb{font-size:10px}
}

/* ── บันทึกย่อใต้ตารางข้อมูล (ที่มาของชื่อ) ─────────────────────────── */
.note{margin-top:13px; padding-top:11px; border-top:1px solid rgba(122,152,192,.09)}
.note span{display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.note p{margin:0; font-size:12.5px; font-weight:300; color:var(--ink-2)}

/* ค่าตัวเลขยาว ๆ ต้องไม่บีบคอลัมน์ชื่อจนคำไทยแตก */
.readout{grid-template-columns:minmax(96px,1fr) auto}
.readout dd{max-width:170px}

/* ── บันไดมาตราส่วน: ผิวดาว → กาแล็กซี ─────────────────────────────── */
.ladder{display:flex; flex-direction:column; margin-bottom:10px}
.rung{display:flex; align-items:center; gap:10px; padding:6px 8px 6px 0; text-align:left;
  border-top:1px solid rgba(122,152,192,.09); transition:.15s}
.rung:first-child{border-top:0}
.rung i{width:9px; height:9px; flex:none; border-radius:50%; border:1px solid var(--line-2);
  margin-left:5px; transition:.15s}
.rung span{flex:1; font-size:13px; font-weight:300; color:var(--ink-2)}
.rung small{font-family:var(--mono); font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.rung:hover{background:rgba(255,255,255,.045)}
.rung:hover span{color:var(--ink)}
.rung:hover i{border-color:var(--amber); background:var(--amber); box-shadow:0 0 9px var(--amber)}
/* ขั้นบันไดโตขึ้นทีละมาก จุดนำหน้าจึงโตตามเพื่อบอกว่ากระโดดไกลแค่ไหน */
.rung:nth-child(2) i{width:10px; height:10px}
.rung:nth-child(3) i{width:11px; height:11px}
.rung:nth-child(4) i{width:12px; height:12px}
.rung:nth-child(5) i{width:13px; height:13px}
.rung:nth-child(6) i{width:14px; height:14px}
.rung:nth-child(7) i{width:15px; height:15px}

/* ── กล่องแจ้งเตือนชั่วคราว (คัดลอกลิงก์ / บันทึกภาพ) ───────────────── */
#toast{position:fixed; left:50%; bottom:132px; z-index:45; max-width:min(420px,86vw);
  padding:9px 15px; background:var(--panel-2); border:1px solid var(--amber-2); border-radius:var(--r);
  box-shadow:var(--shadow); color:var(--ink); font-size:12.5px; text-align:center;
  pointer-events:none; opacity:0; transform:translate(-50%,8px); transition:opacity .2s, transform .2s}
#toast.on{opacity:1; transform:translate(-50%,0)}
@media (max-width:900px){ #toast{bottom:auto; top:118px} }

/* ── แท็บท้องฟ้า: วงกลมท้องฟ้าทั้งใบ + ปฏิทินเหตุการณ์ ─────────────────── */
.dome{width:100%; max-width:206px; display:block; margin:2px auto 10px}
.d-edge{fill:rgba(8,13,22,.7); stroke:var(--line-2); stroke-width:1}
.d-ring{fill:none; stroke:var(--line); stroke-width:.7}
.d-card{font-family:var(--mono); font-size:8px; fill:var(--muted); letter-spacing:.08em}
.d-lbl{font-family:var(--mono); font-size:7.5px; letter-spacing:.04em}
.readout dt em.up{display:inline-block; width:6px; height:6px; border-radius:50%; vertical-align:middle;
  background:var(--live); box-shadow:0 0 7px var(--live); margin-left:5px; font-style:normal}
.events{display:flex; flex-direction:column; margin-bottom:10px}
.ev{display:flex; align-items:flex-start; gap:8px; padding:8px 6px 8px 0; text-align:left; width:100%;
  border-top:1px solid rgba(122,152,192,.09); transition:.15s}
.ev:first-child{border-top:0}
.ev:hover{background:rgba(255,255,255,.045)}
.ev > i{font-style:normal; width:15px; flex:none; text-align:center; color:var(--amber); font-size:11px; line-height:1.6}
.ev .when{font-family:var(--mono); font-size:9.5px; color:var(--muted); width:106px; flex:none; line-height:1.6}
.ev .what{flex:1; min-width:0}
.ev .what b{display:block; font-size:12.5px; font-weight:400; color:var(--ink-2); line-height:1.35}
.ev:hover .what b{color:var(--ink)}
.ev .what small{display:block; font-size:10.5px; color:var(--muted); font-family:var(--mono); line-height:1.45}

/* ── แถบบอกระยะมองในคอนโซลเวลา ─────────────────────────────────────── */
.viewdist{display:flex; align-items:baseline; gap:6px; white-space:nowrap}
.viewdist em{font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); font-style:normal}
.viewdist b{font-family:var(--mono); font-size:11.5px; font-weight:500; color:var(--ink-2);
  font-variant-numeric:tabular-nums}

</style>
</head>
<body>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
</div>

<header id="topbar">
  <div class="brand"><span class="mark"></span><b>แผนที่ระบบสุริยะ</b><span class="sub">Solar Atlas</span></div>
  <nav class="crumb" id="crumb" aria-live="polite"></nav>
  <div class="top-actions">
    <button class="tbtn" id="btnFind" title="ค้นหาวัตถุ (F)">
      <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg><span>ค้นหา</span>
    </button>
    <a class="tbtn" id="btnHome" href="../hub/index.html" title="กลับหน้าหลัก รัฐไทยก้าวหน้า">
      <svg viewBox="0 0 20 20"><path d="M3.2 9.2 10 3.6l6.8 5.6"/><path d="M5 8.6v7.8h10V8.6"/></svg><span>หน้าหลัก</span>
    </a>
    <button class="tbtn" id="btnShare" title="คัดลอกลิงก์ของมุมมองนี้ (L)">
      <svg viewBox="0 0 20 20"><path d="M7.7 11.1l4.6-2.2M7.7 8.9l4.6 2.2"/><circle cx="14" cy="5.2" r="2.2"/><circle cx="6" cy="10" r="2.2"/><circle cx="14" cy="14.8" r="2.2"/></svg><span>แชร์</span>
    </button>
    <button class="tbtn" id="btnShot" title="บันทึกภาพหน้าจอเป็นไฟล์ PNG (P)">
      <svg viewBox="0 0 20 20"><path d="M2.6 6.6h3.2l1.3-2h5.8l1.3 2h3.2v9.8H2.6z"/><circle cx="10" cy="11.5" r="3.1"/></svg>
    </button>
    <button class="tbtn" id="btnLang" title="สลับภาษา">EN</button>
    <button class="tbtn" id="btnAbout" title="เกี่ยวกับ / ลิขสิทธิ์">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v4.5M10 6.4v.1"/></svg>
    </button>
  </div>
</header>

<aside id="rail">
  <div class="tabs" role="tablist">
    <button role="tab" class="on" data-tab="info">ข้อมูล</button>
    <button role="tab" data-tab="tools">เครื่องมือ</button>
    <button role="tab" data-tab="view">มุมมอง</button>
    <button role="tab" data-tab="sky">ท้องฟ้า</button>
  </div>
  <button id="railToggle" title="ย่อ/ขยายแผง" aria-label="ย่อ/ขยายแผง">
    <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
  </button>
  <div class="panes">
    <section class="pane" id="pane-info"></section>
    <section class="pane" id="pane-tools" hidden></section>
    <section class="pane" id="pane-view" hidden></section>
    <section class="pane" id="pane-sky" hidden></section>
  </div>
</aside>

<div id="console">
  <div class="crow">
    <div class="transport">
      <button id="slower" title="ช้าลง (←)"><svg viewBox="0 0 16 16"><path d="M14 3v10L8.5 8zM7 3v10L1.5 8z"/></svg></button>
      <button class="play" id="play" title="เล่น / หยุด (เว้นวรรค)"></button>
      <button id="faster" title="เร็วขึ้น (→)"><svg viewBox="0 0 16 16"><path d="M2 3v10l5.5-5zM9 3v10l5.5-5z"/></svg></button>
    </div>
    <div class="clock">
      <span class="d num" id="cDate">—</span>
      <span class="t num" id="cTime">—</span>
    </div>
    <div class="live-dot" id="liveDot"><i></i><span>สด</span></div>
    <div class="rate"><b id="rateVal">—</b><span id="rateUnit">อัตรา</span></div>
    <button id="consoleToggle" title="ย่อ/ขยายแถบเวลา" aria-label="ย่อ/ขยายแถบเวลา">
      <svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>
    </button>
  </div>
  <input type="range" id="scrub" min="-9" max="9" step="1" value="0" aria-label="อัตราเร็วของเวลา">
  <div class="crow" style="gap:8px">
    <input type="date" id="jump" aria-label="กระโดดไปยังวันที่">
    <button class="ghost" id="btnNow">ตอนนี้</button>
    <span class="viewdist"><em id="viewLbl">ระยะมอง</em><b class="num" id="scaleTxt">—</b></span>
    <button class="ghost" id="btnFrame" style="margin-left:auto">จัดกล้อง</button>
  </div>
</div>

<div id="rrail">
  <button id="zin" title="ซูมเข้า"><svg viewBox="0 0 20 20"><path d="M10 5.5v9M5.5 10h9"/></svg></button>
  <button id="zout" title="ซูมออก"><svg viewBox="0 0 20 20"><path d="M5.5 10h9"/></svg></button>
  <button id="topView" title="มองจากขั้วเหนือ"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="7.5" ry="7.5"/><circle cx="10" cy="10" r="2" fill="currentColor" stroke="none"/></svg></button>
  <button id="tglLbl" class="on" title="ชื่อวัตถุ"><svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h9M3 14h11"/></svg></button>
  <button id="tglOrb" class="on" title="เส้นวงโคจร"><svg viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="8" ry="4.4"/><circle cx="10" cy="10" r="1.6" fill="currentColor" stroke="none"/></svg></button>
  <button id="full" title="เต็มจอ"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M17 7V3h-4M3 13v4h4M17 13v4h-4"/></svg></button>
</div>

<p id="hint">ลากเพื่อหมุน · เลื่อนล้อเพื่อซูม · คลิกชื่อวัตถุเพื่อเจาะจง</p>

<div id="toast" hidden></div>

<div class="overlay" id="findSheet" hidden>
  <div class="sheet">
    <header><input id="q" placeholder="ค้นหาดาวเคราะห์ ดวงจันทร์…" autocomplete="off"><button class="ghost" data-close>ปิด</button></header>
    <div class="body" id="findBody"></div>
  </div>
</div>

<div class="overlay" id="aboutSheet" hidden>
  <div class="sheet">
    <header><h3 id="aboutTitle">เกี่ยวกับแผนที่นี้</h3><button class="ghost" data-close>ปิด</button></header>
    <div class="body prose" id="aboutBody"></div>
  </div>
</div>

<div id="loading">
  <div class="orbit"></div>
  <div class="bar"><i id="loadBar"></i></div>
  <p id="loadTxt">กำลังเริ่มระบบ</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

   ══════════════════════════════════════════════════════════════════════ */

  mars:    { a:[1.52371034, 0.00001847], e:[0.09339410, 0.00007882], i:[1.84969142,-0.00813131],
             L:[-4.55343205, 19140.30268499], w:[-23.94362959, 0.44441088], n:[49.55953891,-0.29257343] },

        en:'When it was found in 2004, calculations gave it a chance of striking Earth in 2029 and it made headlines worldwide. Later measurements ruled that out for at least a century — but on 13 April 2029 it will pass closer than the geostationary satellites, bright enough to see with the naked eye from Europe and Africa.'}

  desc:{th:'วัตถุที่ทำให้พลูโตถูกปลดจากการเป็นดาวเคราะห์ เพราะมันมีมวลมากกว่าพลูโตแต่อยู่ไกลกว่า ถ้านับพลูโตเป็นดาวเคราะห์ก็ต้องนับอีริสด้วย สหพันธ์ดาราศาสตร์สากลจึงสร้างหมวด “ดาวเคราะห์แคระ” ขึ้นในปี 2549 ผิวของมันเป็นน้ำแข็งมีเทนที่สะท้อนแสงเกือบทั้งหมด',

        en:'Its orbit is so stretched that it swings out towards a thousand astronomical units and takes over ten thousand years to go round once. Even its closest approach is nearly three times further than Neptune — something the known planets cannot explain, and one of the hints that keeps the search for a distant massive body alive.'}

},

const ABOUT = {
  th:`<h4>แผนที่นี้คืออะไร</h4>
  <p>แบบจำลองระบบสุริยะ 3 มิติที่คำนวณตำแหน่งของดวงอาทิตย์ ดาวเคราะห์ทั้งแปด ดาวพลูโต และดวงจันทร์ 14 ดวง
  จากองค์ประกอบวงโคจรเคปเลอร์ ตามวันเวลาที่คุณเลือก ทุกอย่างคำนวณสดในเบราว์เซอร์ ไม่มีการเรียกข้อมูลจากเซิร์ฟเวอร์ใด</p>
  <p>ซูมได้ต่อเนื่องตั้งแต่ระยะประชิดผิวดาว ออกไปจนถึงแถบไคเปอร์ เมฆออร์ต และทางช้างเผือกทั้งใบ
  เมื่อกล้องออกไปไกลกว่าราวห้าปีแสง ท้องฟ้าที่เห็นจากบ้านเราจะค่อย ๆ จางลง แล้วกาแล็กซีจะปรากฏขึ้นแทน
  โดยดวงอาทิตย์อยู่ห่างจากใจกลาง 26,000 ปีแสง ตามตำแหน่งจริง</p>

  <h4>เรื่องลิขสิทธิ์ — ทำไมชุดนี้ปลอดภัย</h4>
  <ul>
    <li><b>ไม่มีภาพถ่ายจากภายนอกเลย</b> พื้นผิวดาวทุกดวง วงแหวน ดวงอาทิตย์ ดาวฤกษ์พื้นหลัง ภาพกาแล็กซี และหลุมดำ
        ถูกวาดขึ้นด้วยโค้ดตอนเปิดหน้าเว็บ จึงไม่มีภาพถ่ายของใครมาเกี่ยวข้อง
        ทวีปบนโลกวาดจากเส้นขอบแผ่นดินของ Natural Earth ซึ่งเป็นข้อมูลแผนที่สาธารณสมบัติ
        และแผนที่รังสีไมโครเวฟพื้นหลังก็วาดเองจากข้อมูลดิบ WMAP ของ NASA</li>
    <li><b>ทางช้างเผือกก็ปั่นขึ้นเอง</b> แขนกังหันเกิดจากสูตรเกลียวลอการิทึม ไม่ใช่ภาพถ่ายหรือภาพวาด
        ของกาแล็กซี ซึ่งเป็นจุดที่แอปดาราศาสตร์ส่วนใหญ่ต้องไปหยิบไฟล์ภาพของคนอื่นมาใช้</li>
    <li><b>ไม่มีโค้ดที่คัดลอกมา</b> เขียนขึ้นใหม่ทั้งหมด ใช้เพียงไลบรารี <code>three.js</code>
        ซึ่งเป็นโอเพนซอร์สสัญญาอนุญาต MIT และฟอนต์ IBM Plex สัญญาอนุญาต SIL Open Font License</li>
    <li><b>โมเดลยานเป็นไฟล์ที่ NASA เผยแพร่</b> วอยเอเจอร์ ไพโอเนียร์ นิวฮอไรซันส์ พาร์เกอร์ เจมส์ เว็บบ์
        และยูโรปาคลิปเปอร์ ใช้โมเดลจากหน้า 3D Resources ของ NASA (เครดิต NASA และ NASA Visualization Technology
        Applications and Development) บีบขนาดก่อนใช้และโหลดเฉพาะตอนเจาะจงยานลำนั้น
        ส่วนลูซีกับไซคี NASA ไม่มีโมเดลให้ จึงยังปั้นด้วยโค้ด โมเดลเนบิวลาปูกับวงแหวนซูเปอร์โนวา 1987A ก็มาจากหน้าเดียวกัน</li>
    <li><b>ตัวเลขคือข้อเท็จจริง</b> องค์ประกอบวงโคจรและข้อมูลกายภาพเป็นค่าที่วัดได้ทางวิทยาศาสตร์
        ซึ่งไม่เข้าข่ายงานอันมีลิขสิทธิ์ คำบรรยายทั้งหมดเรียบเรียงขึ้นใหม่
        ตัวเลขของดาวเคราะห์น้อยและดาวหางนำมาจากฐานข้อมูลวัตถุขนาดเล็กของ JPL
        วิถียานอวกาศจาก JPL Horizons ดาวฤกษ์และกาแล็กซีจากฐานข้อมูล SIMBAD ของ CDS
        แผนที่กาแล็กซีจากแค็ตตาล็อก 2MASS Redshift Survey
        และดาวเคราะห์นอกระบบจากคลังข้อมูลของนาซา — ทั้งหมดเปิดให้ทุกคนใช้ และ
        คัดลอกมาเก็บไว้ในไฟล์ครั้งเดียว ไม่ได้เรียกข้อมูลตอนเปิดหน้าเว็บ</li>
    <li><b>ไม่ใช้เครื่องหมายขององค์กรใด</b> ไม่มีโลโก้ ชื่อ หรือรูปแบบตราสัญลักษณ์ของหน่วยงานอวกาศใด ๆ
        ซึ่งมักได้รับความคุ้มครองแยกจากลิขสิทธิ์ในฐานะเครื่องหมายการค้า</li>
  </ul>

  <h4>ความแม่นยำ</h4>
  <p>ใช้องค์ประกอบวงโคจรโดยประมาณยุค J2000 ให้ความคลาดเคลื่อนระดับลิปดาในช่วงปี ค.ศ. 1800–2050
  เหมาะกับการเรียนรู้และการนำเสนอ แต่ไม่เหมาะกับงานนำทางยานอวกาศ ดวงจันทร์ของดาวเคราะห์อื่นเป็นวงโคจรวงรีอย่างง่าย
  รอบระนาบศูนย์สูตรของดาวแม่ ส่วนขนาดของดาวแสดงตามจริงเสมอ ยกเว้นเมื่อเปิดโหมด “ขยายให้เห็น”</p>
  <p>ดวงจันทร์ของโลกใช้ทฤษฎีของ Meeus (ELP-2000/82 ฉบับย่อ 120 พจน์) หมุนกลับกรอบ J2000
  และชดเชยเวลา ΔT แล้ว เทียบกับ JPL Horizons คลาดเพียง 3–8 กิโลเมตร เงาสุริยุปราคาจึงตกลงบนโลกถูกที่
  ค่า gamma ของสุริยุปราคาเต็มดวงปี 2569–2571 คลาดจากของ NASA ไม่เกิน 0.002</p>
  <p>วัตถุขนาดเล็กคำนวณจากองค์ประกอบวงโคจร “ยุคเดียว” แบบสองวัตถุ คือคิดแค่แรงดึงของดวงอาทิตย์
  ไม่ได้คิดแรงกวนจากดาวพฤหัสบดี ตำแหน่งช่วงใกล้ยุคขององค์ประกอบจึงแม่น แต่ถ้าไล่เวลาออกไปหลายสิบปี

  <h4>ยานอวกาศในแผนที่นี้</h4>
  <p>สิบลำ เจ็ดลำดับเครื่องยนต์แล้วและบินตามแรงโน้มถ่วงล้วน ๆ วิถีจึงคำนวณล่วงหน้าได้แม่น

  กับดาวเคราะห์ วิถีจึงตรงเฉพาะช่วงใกล้วันที่วัดมา แผงข้อมูลของสามลำนี้บอกไว้ชัด</p>
  <p>ทุกลำยกเว้นลูซีกับไซคีใช้โมเดลสามมิติที่ NASA เผยแพร่ สองลำนั้นปั้นด้วยรูปทรงพื้นฐานในโค้ด
  ทุกลำจะขยายให้พอมองเห็นเมื่อดูจากไกล แต่กลับไปเท่าขนาดจริงเมื่อซูมเข้าไปประชิด</p>

  <h4>เงาบนดาวและอุปราคาจากอวกาศ</h4>
  <p>คำนวณในเชเดอร์ทุกเฟรม ได้แก่ เงาวงแหวนที่พาดบนตัวดาวเสาร์ เงาดาวเสาร์ที่ทาบลงบนวงแหวน และเงาดวงจันทร์

  <h4>กาแล็กซีและขอบเอกภพ</h4>
  <p>กาแล็กซีมีชื่อ 106 แห่งวางตามระยะที่วัดจริงจาก SIMBAD จานของกาแล็กซีกังหันเอียงตามที่เห็นบนท้องฟ้า

  en:`<h4>What this is</h4>
  <p>A 3-D model of the solar system that computes the positions of the Sun, all eight planets, Pluto and

  <p>Zoom runs continuously from a planet’s surface out past the Kuiper belt and Oort cloud to the whole

  <h4>On copyright — why this set is safe to ship</h4>
  <ul>

  <h4>Accuracy</h4>
  <p>Built on the standard J2000 approximate elements, good to arc-minutes between 1800 and 2050 — fine for
  teaching and presentation, not for flying a spacecraft. Moons of other planets use simplified ellipses in
  their parent’s equatorial plane. Body sizes are always true to scale unless “Enlarged” is switched on.</p>
  <p>Earth’s Moon follows Meeus’s abridged ELP-2000/82 theory (120 terms), rotated back to J2000 and

  the gamma values of the 2026–2028 total solar eclipses are within 0.002 of NASA’s.</p>

  <h4>Beyond the solar system</h4>
  <p>The scale ladder now has ten rungs, from a planet’s surface out to the edge of the observable

  <h4>The stars around you are real</h4>
  <p>Every star within 32.6 light-years, every bright star in the sky and the stars that draw the
  constellation figures — 1,356 in all — placed at true
  three-dimensional positions from the CDS SIMBAD database. Brightness is computed from the distance to
  the camera, so stars dim and brighten as you move, and flying a few light-years out visibly distorts the
  constellations because nearby stars shift faster than distant ones. Click any star for its data.</p>

  <h4>The “Sky” tab</h4>
  <p>Pick a place on Earth and see which bodies are above the horizon at the displayed time, how high
  and in which direction, along with sunrise, sunset, moonrise, moonset and a calendar of the next
  400 days of sky events. All of it is scanned from the positions in this atlas rather than read from a
  published table. Eclipses are decided from that night’s real disc sizes and shadow cone (lunar eclipses
  count only when the Moon touches the umbra). The time shown is the moment of new or full moon, within about
  ten minutes of greatest eclipse, and the type of each eclipse is not identified yet.</p>

  <h4>Spacecraft in this atlas</h4>
  <p>Ten craft. Seven have finished with their engines and coast on gravity alone, so their paths can be
  computed far ahead; five of those are leaving the solar system for good, and the James Webb telescope is

  gravity assists ahead, so their paths are right only near the date they were measured — their info
  panels say so.</p>
  <p>Every craft except Lucy and Psyche uses NASA’s published 3-D model; those two are built from basic
  shapes in code. Every craft is enlarged enough to spot from far away and returns to true size as you close in.</p>

  <h4>Shadows and eclipses from space</h4>
  <p>Computed in the shader every frame: the rings’ shadow across Saturn, Saturn’s shadow on its rings, and
  moons’ shadows on their planets, with the penumbra widening to match the Sun’s true size as seen from that
  planet. Set the date to 2 August 2027 around 10:07 UTC and look at Earth to watch a total eclipse cross it.</p>

  <h4>Constellations from outside</h4>
  <p>Constellation lines run to the true 3-D positions of their stars. Fly tens or hundreds of light-years
  out and look back, and the lines burst outward around the Sun, because stars in one constellation lie at
  very different distances — the familiar figures are only the view from where we stand.</p>

  <h4>Galaxies and the edge of the universe</h4>
  <p>106 named galaxies sit at distances measured in SIMBAD, with spiral discs tilted the way we see them on
  the sky. The most distant ones show comoving distance, light-travel time and the age of the universe when
  the light set out (Planck 2018 cosmology). Zoom out past eight million light-years to see 43,439 real
  galaxies from the 2MASS Redshift Survey tracing the cosmic web, and at the edge of the observable universe
  (46.5 billion light-years) the cosmic microwave background from nine years of WMAP data — the oldest light,
  which set out about 13.8 billion years ago, when the universe was some 380,000 years old.</p>

  <h4>Interstellar matter and dark matter</h4>
  <p>The Milky Way carries dust lanes that dim and redden the starlight behind them, and pink clouds of
  hydrogen lit up by newborn stars. Around it lies a dark-matter halo some 650,000 light-years in radius,

    lerp(lerp(grad3(PERM[AA & 255], x, y, z), grad3(PERM[BA & 255], x - 1, y, z), u),
         lerp(grad3(PERM[AB & 255], x, y - 1, z), grad3(PERM[BB & 255], x - 1, y - 1, z), u), v),
    lerp(lerp(grad3(PERM[(AA + 1) & 255], x, y, z - 1), grad3(PERM[(BA + 1) & 255], x - 1, y, z - 1), u),
         lerp(grad3(PERM[(AB + 1) & 255], x, y - 1, z - 1), grad3(PERM[(BB + 1) & 255], x - 1, y - 1, z - 1), u), v), w);
}
/* งบเวลา: อ็อกเทฟสุดท้ายมักละเอียดกว่าขนาดพิกเซลของแผนที่ที่เราสร้าง
   ตัดออกหนึ่งชั้นจึงเร็วขึ้นราวหนึ่งในสี่โดยแทบไม่เห็นความต่าง */
const OCT_TRIM = 1;
function fbm(x, y, z, oct, gain) {
  gain = gain || 0.5;
  oct = oct > 2 ? oct - OCT_TRIM : oct;
  let a = 1, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * noise3(x * f, y * f, z * f); norm += a; a *= gain; f *= 2; }
  return sum / norm;
}
function ridge(x, y, z, oct) {
  oct = oct > 2 ? oct - OCT_TRIM : oct;
  let a = 1, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * (1 - Math.abs(noise3(x * f, y * f, z * f))); norm += a; a *= 0.5; f *= 2; }
  return sum / norm;
}

/* ── ตัวช่วยสี ─────────────────────────────────────────────────────── */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = (a, b, t) => { t = clamp01((t - a) / (b - a)); return t * t * (3 - 2 * t); };
function mix(c1, c2, t, out) {
  t = clamp01(t);
  out[0] = c1[0] + (c2[0] - c1[0]) * t;
  out[1] = c1[1] + (c2[1] - c1[1]) * t;
  out[2] = c1[2] + (c2[2] - c1[2]) * t;
  return out;
}
const rgb = (r, g, b) => [r, g, b];

/* ── ระบายผิวทรงกลมแบบ equirectangular ─────────────────────────────── */
function paintSphere(w, h, fn) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  const col = [0, 0, 0];
  for (let j = 0; j < h; j++) {
    const lat = (0.5 - (j + 0.5) / h) * Math.PI;
    const cl = Math.cos(lat), sl = Math.sin(lat);
    for (let i = 0; i < w; i++) {
      const lon = ((i + 0.5) / w) * 2 * Math.PI;
      fn(col, cl * Math.cos(lon), sl, cl * Math.sin(lon), lat, lon);
      const k = (j * w + i) << 2;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* ── หลุมอุกกาบาต: วาดทับหลังระบายสีพื้น ───────────────────────────── */
function drawCraters(cv, count, opts) {
  opts = opts || {};
  const ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
  const rimLight = opts.rim || 'rgba(255,255,255,.20)';
  const floor = opts.floor || 'rgba(0,0,0,.34)';
  let s = opts.seed || 7;
  const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff), s / 0x7fffffff);
  for (let n = 0; n < count; n++) {
    const lat = Math.asin(rnd() * 2 - 1);
    const lon = rnd() * 2 * Math.PI;
    const p = rnd();
    const rr = (opts.min || 0.004) + Math.pow(p, 3.2) * (opts.max || 0.055);   // การกระจายแบบกฎยกกำลัง
    const rp = rr * h;
    const stretch = Math.min(6, 1 / Math.max(0.16, Math.cos(lat)));
    const cx = (lon / (2 * Math.PI)) * w, cy = (0.5 - lat / Math.PI) * h;
    for (const off of [-w, 0, w]) {                       // ทำซ้ำสองข้างเพื่อไม่ให้ขาดตรงรอยต่อ
      if (Math.abs(cx + off - w / 2) > w / 2 + rp * stretch) continue;
      ctx.save();
      ctx.translate(cx + off, cy);
      ctx.scale(stretch, 1);
      const g = ctx.createRadialGradient(0, 0, rp * 0.1, 0, 0, rp);
      g.addColorStop(0, floor);
      g.addColorStop(0.62, 'rgba(0,0,0,.10)');
      g.addColorStop(0.86, rimLight);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, rp, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }
  return cv;
}

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  const px = lon => (lon + 180) / 360 * w, py = lat => (90 - lat) / 180 * h;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  for (const r of EARTH_LAND) {
    let lon = r[0], lat = r[1];
    ctx.moveTo(px(lon / 10), py(lat / 10));
    for (let k = 2; k < r.length; k += 2) { lon += r[k]; lat += r[k + 1]; ctx.lineTo(px(lon / 10), py(lat / 10)); }
    ctx.closePath();
  }
  ctx.fill('evenodd');                             // วงที่ซ้อนอยู่ข้างในคือรู — ทะเลแคสเปียน
  ctx.fillStyle = '#000';
  ctx.beginPath();
  for (const r of EARTH_LAKES) {
    ctx.moveTo(px(r[0]), py(r[1]));
    for (let k = 2; k < r.length; k += 2) ctx.lineTo(px(r[k]), py(r[k + 1]));
    ctx.closePath();
  }
  ctx.fill();
  const src = ctx.getImageData(0, 0, w, h).data, out = new Float32Array(w * h);
  for (let k = 0; k < out.length; k++) out[k] = src[k << 2] / 255;
  return out;
}

/* ดัชนีไบต์ใน ImageData ของพิกเซลที่ใกล้ (fx, fy) ที่สุด — ลองจิจูดวนรอบ ละติจูดหยุดที่ขั้ว */
function zoneIndex(fx, fy, w, h) {
  const ii = ((Math.round(fx) % w) + w) % w;
  const jj = Math.max(0, Math.min(h - 1, Math.round(fy)));
  return (jj * w + ii) << 2;
}

/* เบลอกล่องแบบแยกแกน: แนวนอนวนรอบ (ลองจิจูดต่อกันเป็นวง) แนวตั้งหยุดที่ขั้ว */
function blurWrap(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h), n = 2 * r + 1;
  const wrap = i => ((i % w) + w) % w;
  for (let j = 0; j < h; j++) {
    const row = j * w;
    let s = 0;
    for (let k = -r; k <= r; k++) s += src[row + wrap(k)];
    for (let i = 0; i < w; i++) { tmp[row + i] = s / n; s += src[row + wrap(i + r + 1)] - src[row + wrap(i - r)]; }
  }
  for (let i = 0; i < w; i++) {
    let s = 0;
    for (let k = -r; k <= r; k++) s += tmp[Math.max(0, Math.min(h - 1, k)) * w + i];
    for (let j = 0; j < h; j++) {
      out[j * w + i] = s / n;
      s += tmp[Math.min(h - 1, j + r + 1) * w + i] - tmp[Math.max(0, j - r) * w + i];
    }
  }
  return out;
}

/* ชั้นข้อมูลภูมิอากาศ วาดครั้งเดียวที่ 0.5°/พิกเซล แล้วย่อขยายตามขนาดพื้นผิวที่ขอ
   ชั้น 0: R = ความแห้ง · G = ป่า · B = ความสูง   ชั้น 1: R = น้ำแข็ง · G = ทรายแดง · B = ทะเลตื้น
   ใช้โหมด lighten (ค่ามากสุดต่อช่องสี) วงรีที่ทับกันจึงไม่บวกกันจนล้น                     */
let _zoneCanvases = null;
function earthZoneLayer(w, h, layer) {
  if (!_zoneCanvases) {
    const ZW = 720, ZH = 360, S = ZW / 360;
    const make = () => {
      const cv = document.createElement('canvas');
      cv.width = ZW; cv.height = ZH;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, ZW, ZH);
      ctx.globalCompositeOperation = 'lighten';
      return cv;
    };
    // โปรไฟล์ความเข้มจากกลางวงรีถึงขอบ: แบบที่ราบ (เขตชัด ๆ อย่างทะเลทราย) กับแบบลาด (ป่าที่ค่อย ๆ บางลง)
    const FLAT = [[0, 1], [0.55, 0.95], [0.85, 0.45], [1, 0]], SOFT = [[0, 1], [0.4, 0.85], [0.75, 0.4], [1, 0]];
    const blob = (ctx, ch, prof, lon, lat, rx, ry, rot, s) => {
      const col = a => { const v = [0, 0, 0]; v[ch] = Math.round(a * s * 255); return `rgb(${v[0]},${v[1]},${v[2]})`; };
      for (const off of [-360, 0, 360]) {             // วาดซ้ำสองข้างให้ต่อกันตรงเส้นแบ่งวันสากล
        const cx = (lon + off + 180) * S, cy = (90 - lat) * S, reach = Math.max(rx, ry) * S;
        if (cx + reach < 0 || cx - reach > ZW) continue;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-rot * Math.PI / 180);
        ctx.scale(rx * S, ry * S);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        for (const [at, a] of prof) g.addColorStop(at, col(a));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, 1, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
    };
    const a = make(), b = make(), actx = a.getContext('2d'), bctx = b.getContext('2d');
    for (const z of EARTH_ZONES.arid) blob(actx, 0, FLAT, ...z);
    for (const z of EARTH_ZONES.forest) blob(actx, 1, SOFT, ...z);
    for (const r of EARTH_RANGES) {                    // โรยวงกลมถี่ ๆ ตามแนวสันเขา
      const rad = r[0], s = r[1];
      if (r.length === 4) { blob(actx, 2, SOFT, r[2], r[3], rad, rad, 0, s); continue; }
      for (let k = 2; k + 3 < r.length; k += 2) {
        const x0 = r[k], y0 = r[k + 1], x1 = r[k + 2], y1 = r[k + 3];
        const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / (rad * 0.4)));
        for (let n = 0; n <= steps; n++) blob(actx, 2, SOFT, x0 + (x1 - x0) * n / steps, y0 + (y1 - y0) * n / steps, rad, rad, 0, s);
      }
    }
    for (const z of EARTH_ZONES.ice) blob(bctx, 0, FLAT, ...z);
    for (const z of EARTH_ZONES.red) blob(bctx, 1, SOFT, ...z);
    for (const z of EARTH_ZONES.shelf) blob(bctx, 2, SOFT, ...z);
    _zoneCanvases = [a, b];
  }
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(_zoneCanvases[layer], 0, 0, w, h);
  return ctx.getImageData(0, 0, w, h).data;
}

/* ── ผู้ระบายสีของแต่ละดวง ─────────────────────────────────────────── */
const PAINTERS = {

  sun(w, h) {
    const hot = rgb(255, 246, 214), warm = rgb(255, 178, 62), deep = rgb(226, 110, 26);
    const t = [0, 0, 0];
    return paintSphere(w, h, (c, x, y, z) => {
      const gran = fbm(x * 26, y * 26, z * 26, 4);
      const cell = ridge(x * 9, y * 9, z * 9, 3);
      const spot = fbm(x * 3.2 + 11, y * 3.2, z * 3.2, 3);
      let v = 0.52 + gran * 0.30 + cell * 0.24;
      if (spot < -0.30) v -= smooth(-0.30, -0.58, spot) * 0.16;   // จุดมืดจาง ๆ บนผิว
      v = clamp01(v);
      mix(deep, warm, smooth(0.15, 0.62, v), t);
      mix(t, hot, smooth(0.62, 0.95, v), c);

  },

  mercury(w, h) {
    const dark = rgb(74, 70, 66), mid = rgb(126, 120, 112), lite = rgb(176, 169, 158);

      const base = fbm(x * 2.6, y * 2.6, z * 2.6, 5);
      const fine = fbm(x * 12 + 4, y * 12, z * 12, 4);
      const v = 0.5 + base * 0.34 + fine * 0.16;
      mix(dark, mid, smooth(0.18, 0.58, v), t);
      mix(t, lite, smooth(0.58, 0.92, v), c);
    });

  },

  venus(w, h) {
    const deep = rgb(176, 132, 56), mid = rgb(224, 186, 106), pale = rgb(246, 228, 176);
    const t = [0, 0, 0];
    return paintSphere(w, h, (c, x, y, z, lat) => {
      const warp = fbm(x * 1.8, y * 3.4, z * 1.8, 4) * 0.55;
      const band = Math.sin((lat + warp) * 7.5) * 0.5 + 0.5;
      const swirl = fbm(x * 4.4 + 9, y * 8.5, z * 4.4, 5);
      const v = 0.42 + band * 0.26 + swirl * 0.30;
      mix(deep, mid, smooth(0.15, 0.55, v), t);
      mix(t, pale, smooth(0.55, 0.95, v), c);
    });
  },

  /* โลก: ทวีปจริงจากเส้นขอบแผ่นดิน (earth-land.js) ส่วนสีของแผ่นดินมาจากเขตภูมิอากาศ
     ที่วางไว้ด้วยมือใน EARTH_ZONES แล้วใช้ noise แตกขอบเขตให้ดูเป็นธรรมชาติ
     ลองจิจูด −180° อยู่ขอบซ้ายของภาพ 0° (กรีนิช) อยู่กลางภาพ — app.js หมุนโลกให้ตรงตามนี้ */
  earth(w, h) {
    const DEEP = rgb(5, 18, 48), MID = rgb(10, 36, 80), SHELF = rgb(24, 72, 112), SHALLOW = rgb(34, 110, 128);
    const RAIN = rgb(30, 64, 28), FOREST = rgb(44, 74, 38), GRASS = rgb(96, 104, 62), SAVANNA = rgb(148, 132, 86),
          SAND = rgb(214, 186, 138), REDSAND = rgb(184, 112, 64), ROCK = rgb(112, 98, 84),
          BOREAL = rgb(32, 50, 34), TUNDRA = rgb(108, 104, 86), ICE = rgb(236, 242, 248), PACK = rgb(206, 220, 232);
    const land = earthLandMask(w, h);
    const br = Math.max(1, Math.round(w / 360));                 // รัศมีเบลอราวหนึ่งองศา
    const near = blurWrap(blurWrap(land, w, h, br), w, h, br);   // 1 = กลางแผ่นดิน · 0 = กลางทะเล
    const za = earthZoneLayer(w, h, 0), zb = earthZoneLayer(w, h, 1);
    const deg = w / 360;                                         // พิกเซลต่อองศา

    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(w, h), d = img.data;
    const sea = [0, 0, 0], c = [0, 0, 0], t = [0, 0, 0];
    for (let j = 0; j < h; j++) {
      const lat = (0.5 - (j + 0.5) / h) * Math.PI;
      const cl = Math.cos(lat), sl = Math.sin(lat);
      const ld = lat * 180 / Math.PI, al = Math.abs(ld);
      const tropic = 1 - smooth(8, 22, al);
      const belt = (al - 26) / 9;
      const beltDry = 0.3 * Math.exp(-belt * belt);             // แถบความกดอากาศสูงกึ่งเขตร้อน แห้งเป็นพื้น
      const snowLine = 0.8 - 0.3 * smooth(28, 58, al);          // ยิ่งห่างศูนย์สูตร หิมะยิ่งลงมาต่ำ
      for (let i = 0; i < w; i++) {
        const lon = ((i + 0.5) / w) * 2 * Math.PI;
        const x = cl * Math.cos(lon), y = sl, z = cl * Math.sin(lon);
        const k = j * w + i, L = land[k], N = near[k];
        const n1 = fbm(x * 3.1, y * 3.1, z * 3.1, 4);

        if (L < 1) {                                             // ทะเล
          const shelf = zb[(k << 2) + 2] / 255;
          mix(DEEP, MID, 0.55 + n1 * 0.9, sea);
          mix(sea, SHELF, clamp01(smooth(0.04, 0.45, N) * 0.8 + shelf * 0.7), sea);
          if (shelf > 0 && al < 32) mix(sea, SHALLOW, smooth(0.35, 1, shelf) * 0.8, sea);
          const pack = ld > 0 ? smooth(76, 85, ld + n1 * 9) : smooth(-64, -74, ld + n1 * 6) * 0.8;
          if (pack > 0) mix(sea, PACK, pack, sea);
        }

        if (L > 0) {                                             // แผ่นดิน
          // ขอบเขตป่า/ทะเลทรายเลื่อนตาม noise ได้หลายองศา ให้ไม่เป็นวงรีเกลี้ยง ๆ
          // ส่วนภูเขาและน้ำแข็งเลื่อนแค่นิดเดียว เพราะต้องเกาะชายฝั่ง (แอนดีสอยู่ชิดทะเล)
          const wx = n1 * 1.6 * deg, wy = noise3(x * 5 + 11, y * 5, z * 5) * deg;
          const q = zoneIndex(i + wx * 6, j + wy * 6, w, h), qf = zoneIndex(i + wx, j + wy, w, h);
          const arid = za[q] / 255, forest = za[q + 1] / 255, red = zb[q + 1] / 255;
          const relief = za[qf + 2] / 255, iceZone = zb[qf] / 255;
          const n2 = fbm(x * 17 + 3, y * 17, z * 17, 3);

          mix(FOREST, RAIN, tropic, t);
          mix(GRASS, t, clamp01(forest + tropic * 0.35 + n1 * 0.25), c);
          if (ld > 44) {                                         // ไทกาและทุนดราซีกโลกเหนือ
            mix(c, BOREAL, smooth(47, 55, ld) * (1 - smooth(62, 69, ld + n1 * 6)) * 0.85, c);
            mix(c, TUNDRA, smooth(62, 71, ld + n1 * 6), c);
          }
          const dry = clamp01(arid + beltDry * (1 - forest) + n1 * 0.22 + n2 * 0.12);
          mix(c, SAVANNA, smooth(0.12, 0.5, dry), c);
          mix(SAND, REDSAND, red, t);
          mix(c, t, smooth(0.45, 0.85, dry), c);

          let v = 1 + n2 * 0.18 + n1 * 0.08, rg = 0.75;
          if (relief > 0.02) {                                   // เทือกเขา: สีหิน + สันเขา
            rg = ridge(x * 24, y * 24, z * 24, 3);
            mix(c, ROCK, smooth(0.15, 0.75, relief) * 0.6, c);
            v *= 1 + (rg - 0.6) * 0.55 * smooth(0.1, 0.6, relief);
          }
          c[0] *= v; c[1] *= v; c[2] *= v;

          // หิมะเกาะตามสันเขาเป็นหย่อม ๆ ไม่ใช่เส้นขาวทึบตลอดแนว
          let white = smooth(snowLine, snowLine + 0.3, relief * 0.95 + (rg - 0.75) * 0.9 + n2 * 0.25) * 0.8;
          white = Math.max(white, smooth(0.25, 0.7, iceZone - (1 - N) * 0.9 + n2 * 0.3));
          if (ld < -60) white = Math.max(white, smooth(-60, -64, ld) * (0.9 + n2 * 0.2));   // แอนตาร์กติกา
          if (white > 0) mix(c, ICE, white, c);
          if (L < 1) mix(sea, c, L, c);                          // ขอบชายฝั่งนุ่ม ๆ
        }

        const src = L > 0 ? c : sea, o = k << 2;
        d[o] = src[0]; d[o + 1] = src[1]; d[o + 2] = src[2]; d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return cv;
  },

  earthClouds(w, h) {

  uranus(w, h) {
    const a = rgb(140, 196, 206), b = rgb(186, 226, 230);
    return paintSphere(w, h, (c, x, y, z, lat) => {
      const band = Math.sin(lat * 5 + fbm(x * 2, y * 4, z * 2, 3) * 0.5) * 0.5 + 0.5;
      const n = fbm(x * 3.5, y * 7, z * 3.5, 4);

    });
  },

  neptune(w, h) {
    const deep = rgb(36, 62, 148), mid = rgb(62, 96, 190), pale = rgb(126, 158, 226);
    const t = [0, 0, 0];
    const cv = paintSphere(w, h, (c, x, y, z, lat) => {
      const band = Math.sin(lat * 6 + fbm(x * 2.2, y * 4.4, z * 2.2, 4) * 0.6) * 0.5 + 0.5;
      const n = fbm(x * 4, y * 9, z * 4, 5);
      const v = 0.40 + band * 0.24 + n * 0.30;
      mix(deep, mid, smooth(0.12, 0.58, v), t);
      mix(t, pale, smooth(0.62, 0.96, v), c);
    });
    const ctx = cv.getContext('2d');
    ctx.save();
    ctx.translate(w * 0.36, h * 0.62); ctx.scale(1.7, 1);
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, h * 0.075);
    g.addColorStop(0, 'rgba(16,32,96,.80)');
    g.addColorStop(1, 'rgba(16,32,96,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, h * 0.075, 0, 6.2832); ctx.fill();
    ctx.restore();
    return cv;
  },

  pluto(w, h) {
    const dark = rgb(78, 62, 54), mid = rgb(140, 118, 100), tan = rgb(196, 172, 142);

    const t = [0, 0, 0];

      const region = fbm(x * 2.4, y * 2.4, z * 2.4, 5);

      mix(dark, mid, smooth(0.16, 0.52, v), t);
      mix(t, tan, smooth(0.52, 0.9, v), c);
    });
    const ctx = cv.getContext('2d');   // ที่ราบน้ำแข็งสว่าง
    ctx.save();
    ctx.translate(w * 0.55, h * 0.56); ctx.scale(1.35, 1);
    const g = ctx.createRadialGradient(0, 0, h * 0.03, 0, 0, h * 0.20);
    g.addColorStop(0, 'rgba(240,234,220,.95)');
    g.addColorStop(0.7, 'rgba(232,224,206,.62)');
    g.addColorStop(1, 'rgba(232,224,206,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, h * 0.20, 0, 6.2832); ctx.fill();
    ctx.restore();
    return cv;
  },

  /* ── ดวงจันทร์ ─────────────────────────────────────────────────── */
  moon(w, h) {
    const dark = rgb(58, 56, 54), mid = rgb(122, 118, 112), lite = rgb(186, 182, 174);
    const t = [0, 0, 0];
    const cv = paintSphere(w, h, (c, x, y, z) => {
      const maria = fbm(x * 1.7, y * 1.7, z * 1.7, 4);
      const fine = fbm(x * 11 + 5, y * 11, z * 11, 4);
      let v = 0.52 + fine * 0.20;
      if (maria < -0.05) v -= smooth(-0.05, -0.40, maria) * 0.34;
      mix(dark, mid, smooth(0.10, 0.50, v), t);
      mix(t, lite, smooth(0.50, 0.86, v), c);
    });
    return drawCraters(cv, 420, { seed: 21, max: 0.055 });
  },

  io(w, h) {
    const dark = rgb(126, 88, 34), mid = rgb(216, 176, 74), lite = rgb(244, 226, 152);
    const t = [0, 0, 0];
    return paintSphere(w, h, (c, x, y, z) => {
      const n = fbm(x * 3.2, y * 3.2, z * 3.2, 5);
      const spot = fbm(x * 9 + 3, y * 9, z * 9, 3);
      const v = 0.5 + n * 0.32 + spot * 0.2;
      mix(dark, mid, smooth(0.18, 0.55, v), t);
      mix(t, lite, smooth(0.58, 0.92, v), c);
      if (spot < -0.42) mix(c, rgb(52, 34, 22), smooth(-0.42, -0.62, spot), c);

  },

  europa(w, h) {
    const base = rgb(214, 208, 196), lite = rgb(240, 238, 232);
    const cv = paintSphere(w, h, (c, x, y, z) => {
      const n = fbm(x * 5, y * 5, z * 5, 4);
      mix(base, lite, clamp01(0.5 + n * 0.5), c);
    });
    const ctx = cv.getContext('2d');    // รอยแตกสีสนิม
    let s = 5;
    const rnd = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff), s / 0x7fffffff);
    ctx.lineCap = 'round';
    for (let i = 0; i < 44; i++) {
      ctx.beginPath();
      let x = rnd() * w, y = rnd() * h, ang = rnd() * 6.28;
      ctx.moveTo(x, y);
      for (let k = 0; k < 14; k++) {
        ang += (rnd() - 0.5) * 0.55;
        x += Math.cos(ang) * w * 0.035; y += Math.sin(ang) * h * 0.022;
        ctx.lineTo(x, y);
      }
      ctx.strokeStyle = rnd() > 0.4 ? 'rgba(150,96,66,.42)' : 'rgba(120,110,104,.34)';
      ctx.lineWidth = 0.6 + rnd() * 2.4;
      ctx.stroke();
    }
    return cv;
  },

  ganymede(w, h) {
    const dark = rgb(84, 78, 72), mid = rgb(140, 134, 126), lite = rgb(190, 186, 178);
    const t = [0, 0, 0];
    const cv = paintSphere(w, h, (c, x, y, z) => {
      const region = fbm(x * 2.1, y * 2.1, z * 2.1, 4);
      const groove = ridge(x * 14, y * 6, z * 14, 3);
      let v = 0.48 + region * 0.30 + groove * 0.20;

    });
    return drawCraters(cv, 200, { seed: 33, max: 0.035 });
  },

  callisto(w, h) {
    const dark = rgb(52, 44, 38), mid = rgb(104, 92, 80), lite = rgb(152, 140, 126);
    const t = [0, 0, 0];
    const cv = paintSphere(w, h, (c, x, y, z) => {
      const n = fbm(x * 3, y * 3, z * 3, 5);
      const v = 0.48 + n * 0.36;
      mix(dark, mid, smooth(0.14, 0.52, v), t);
      mix(t, lite, smooth(0.52, 0.9, v), c);

    return drawCraters(cv, 700, { seed: 44, max: 0.05, rim: 'rgba(255,246,230,.26)' });
  },

  titan(w, h) {
    const deep = rgb(158, 96, 26), mid = rgb(206, 148, 60), pale = rgb(232, 190, 112);
    const t = [0, 0, 0];
    return paintSphere(w, h, (c, x, y, z, lat) => {
      const n = fbm(x * 2.6, y * 4.2, z * 2.6, 4);
      const haze = 0.5 + 0.5 * Math.cos(lat * 2.2);
      const v = 0.44 + n * 0.22 + haze * 0.22;

  enceladus(w, h) {
    const base = rgb(226, 232, 238), lite = rgb(248, 250, 252);
    const cv = paintSphere(w, h, (c, x, y, z) => {

  /* หินและน้ำแข็งทั่วไป — ใช้กับดวงจันทร์ที่เหลือ */
  rocky(w, h, tint, craterCount) {
    const base = tint || rgb(140, 132, 124);
    const dark = rgb(base[0] * 0.42, base[1] * 0.42, base[2] * 0.42);
    const lite = rgb(Math.min(255, base[0] * 1.34), Math.min(255, base[1] * 1.34), Math.min(255, base[2] * 1.34));
    const t = [0, 0, 0];
    const cv = paintSphere(w, h, (c, x, y, z) => {
      const n = fbm(x * 3.4, y * 3.4, z * 3.4, 5);
      const f = fbm(x * 12 + 8, y * 12, z * 12, 3);
      const v = 0.5 + n * 0.32 + f * 0.18;
      mix(dark, base, smooth(0.15, 0.55, v), t);
      mix(t, lite, smooth(0.55, 0.92, v), c);
    });
    return drawCraters(cv, craterCount == null ? 260 : craterCount, { seed: 66 + (tint ? tint[0] : 0), max: 0.05 });
  }
};

/* ── วงแหวน: แถบ 1 มิติ ตามระยะจากศูนย์กลาง มีช่องว่างจริงของดาวเสาร์ ── */
function ringTexture(width, gaps, baseCol) {
  const cv = document.createElement('canvas');
  cv.width = width; cv.height = 1;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(width, 1), d = img.data;
  for (let i = 0; i < width; i++) {
    const u = i / (width - 1);
    let a = 0.86;
    // ความหนาแน่นย่อยจากคลื่นรบกวน
    a *= 0.55 + 0.45 * (fbm(u * 60, 3.1, 7.7, 4) * 0.5 + 0.5);
    a *= smooth(0, 0.05, u) * (1 - smooth(0.93, 1, u));
    for (const g of gaps) {
      const gc = (u - g[0]) / g[1];
      if (Math.abs(gc) < 1) a *= 0.06 + 0.94 * smooth(0.55, 1, Math.abs(gc));
    }
    const shade = 0.72 + 0.28 * (fbm(u * 22 + 4, 1.3, 2.2, 3) * 0.5 + 0.5);
    const k = i << 2;
    d[k] = baseCol[0] * shade; d[k + 1] = baseCol[1] * shade; d[k + 2] = baseCol[2] * shade;
    d[k + 3] = clamp01(a) * 255;
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* ── สไปรต์: แสงเรืองของดวงอาทิตย์ และจุดดาว ───────────────────────── */
function glowTexture(stops, size) {
  size = size || 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  return cv;
}

/* ── แผ่นกลมเล็กสำหรับแผงข้อมูล: ฉายผิวลงทรงกลมพร้อมแสงเงา ────────── */
function discPreview(srcCanvas, size, lon0) {
  size = size || 96;
  lon0 = lon0 == null ? 0.9 : lon0;                       // ตำแหน่งกลางแผ่นกลม (เรเดียนตามแนวกว้างของภาพ)
  const src = srcCanvas.getContext('2d').getImageData(0, 0, srcCanvas.width, srcCanvas.height).data;
  const sw = srcCanvas.width, sh = srcCanvas.height;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size), d = img.data;
  const R = size / 2 - 1;
  const lx = -0.42, ly = 0.42, lz = 0.80;                 // ทิศแสงจากซ้ายบน
  for (let j = 0; j < size; j++) {
    for (let i = 0; i < size; i++) {
      const nx = (i - size / 2 + 0.5) / R, ny = (size / 2 - j - 0.5) / R;
      const k = (j * size + i) << 2;
      const r2 = nx * nx + ny * ny;
      if (r2 > 1) { d[k + 3] = 0; continue; }
      const nz = Math.sqrt(1 - r2);
      const lat = Math.asin(Math.max(-1, Math.min(1, ny)));
      const lon = Math.atan2(nx, nz) * 0.5 + lon0;
      const sx = Math.min(sw - 1, Math.max(0, Math.floor(((lon / (2 * Math.PI)) % 1 + 1) % 1 * sw)));
      const sy = Math.min(sh - 1, Math.max(0, Math.floor((0.5 - lat / Math.PI) * sh)));
      const s = (sy * sw + sx) << 2;
      const diff = Math.max(0.08, nx * lx + ny * ly + nz * lz);
      const edge = 1 - smooth(0.88, 1, Math.sqrt(r2)) * 0.5;
      d[k] = src[s] * diff * edge;
      d[k + 1] = src[s + 1] * diff * edge;
      d[k + 2] = src[s + 2] * diff * edge;
      d[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

<script>
/* ══════════════════════════════════════════════════════════════════════
   app.js — เครื่องยนต์ของแผนที่ระบบสุริยะ
     · คำนวณตำแหน่งจากองค์ประกอบวงโคจรเคปเลอร์ (ไม่ดาวน์โหลดตำแหน่งจากใคร)
     · วาดด้วย three.js โดยเลื่อนจุดกำเนิดของฉากไปที่วัตถุเป้าหมายทุกเฟรม
       เพื่อให้ตัวเลข float ไม่สั่นเวลาซูมเข้าไปใกล้ผิวดาว
   ══════════════════════════════════════════════════════════════════════ */
'use strict';

/* ── สถานะ ─────────────────────────────────────────────────────────── */
const S = {
  lang: 'th',
  time: Date.now(),
  tzMode: 'local',
  live: true,
  playing: true,
  rateIdx: 0,
  sign: 1,
  focus: 'earth',
  orbits: true, labels: true, moons: true, belt: true, kuiper: true, oort: true,
  stars: true, galaxy: true, grid: false, trails: false,
  asteroids: true, comets: true, dwarfs: true, craft: true, figures: true, deep: true, exo: true,
  shadows: true, cosmic: true, cmb: true, ism: true, darkmatter: true,
  enlarge: false,
  measureA: 'earth', measureB: 'mars'
};
const L = () => UI[S.lang];

/* ── มาตราส่วนใหญ่: จากผิวดาวถึงกาแล็กซี ───────────────────────────── */
const LY = 9.4607304726e12;        // กิโลเมตรต่อหนึ่งปีแสง
const GAL_U = 0.001;               // 1 หน่วยในฉากกาแล็กซี = 1,000 ปีแสง
const SUN_R_GAL = 26.0;            // ดวงอาทิตย์ห่างใจกลางทางช้างเผือก 26,000 ปีแสง
const MAX_DIST = 150000e6 * LY;    // ซูมออกได้ไกลสุด: เห็นขอบเอกภพที่สังเกตได้ทั้งวง
const log10 = Math.log10 || (x => Math.log(x) / Math.LN10);
const step01 = (a, b, v) => { const t = Math.max(0, Math.min(1, (v - a) / (b - a))); return t * t * (3 - 2 * t); };

const RINGS = {
  saturn: { in: 1.24, out: 2.35, gaps: [[0.702, 0.045], [0.949, 0.012]], col: [230, 214, 184], alpha: 1.0 },
  uranus: { in: 1.62, out: 2.02, gaps: [[0.34, 0.30], [0.72, 0.14]], col: [148, 164, 176], alpha: 0.55 }
};

const REG = {};                 // ทะเบียนวัตถุทั้งหมด keyed by id
const ORDER = [];               // ลำดับสำหรับเมนู
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };

/* ══ ดาราศาสตร์ ══════════════════════════════════════════════════════ */
const days = ms => (ms - J2000) / 86400000;
const norm2pi = a => { a %= 2 * Math.PI; return a < 0 ? a + 2 * Math.PI : a; };

function kepler(M, e) {
  M = norm2pi(M + Math.PI) - Math.PI;
  let E = M + e * Math.sin(M);
  for (let k = 0; k < 8; k++) {
    const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= d;
    if (Math.abs(d) < 1e-12) break;
  }
  return E;
}

/* ตำแหน่งดาวเคราะห์ในระบบพิกัดสุริยวิถี J2000 (หน่วย: กม.) */
function planetPos(id, ms, out) {
  const E = ELEMENTS[id], T = days(ms) / 36525;
  const a = E.a[0] + E.a[1] * T;
  const e = E.e[0] + E.e[1] * T;
  const inc = (E.i[0] + E.i[1] * T) * DEG;
  const Lo = (E.L[0] + E.L[1] * T) * DEG;
  const pi = (E.w[0] + E.w[1] * T) * DEG;
  const nd = (E.n[0] + E.n[1] * T) * DEG;
  const om = pi - nd;
  const Ecc = kepler(Lo - pi, e);
  const xp = a * (Math.cos(Ecc) - e), yp = a * Math.sqrt(1 - e * e) * Math.sin(Ecc);
  const cw = Math.cos(om), sw = Math.sin(om), cn = Math.cos(nd), sn = Math.sin(nd),
        ci = Math.cos(inc), si = Math.sin(inc);
  out.x = ((cw * cn - sw * sn * ci) * xp + (-sw * cn - cw * sn * ci) * yp) * AU;
  out.y = ((cw * sn + sw * cn * ci) * xp + (-sw * sn + cw * cn * ci) * yp) * AU;
  out.z = ((sw * si) * xp + (cw * si) * yp) * AU;
  return out;
}

/* วัตถุขนาดเล็กบางดวงรีเกือบเป็นเส้นตรง (ดาวหาง e ถึง 0.999) วิธีนิวตันแบบ
   ปล่อยอิสระจะกระโดดข้ามคำตอบ จึงจำกัดความยาวก้าวไว้ให้ลู่เข้าแน่นอน */
function keplerE(M, e) {
  M = norm2pi(M + Math.PI) - Math.PI;
  let E = M + e * Math.sin(M);
  for (let k = 0; k < 60; k++) {
    let d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    if (Math.abs(d) > 0.6) d = Math.sign(d) * 0.6;
    E -= d;
    if (Math.abs(d) < 1e-13) break;
  }
  return E;
}

/* วงโคจรไฮเพอร์โบลา (e > 1): M = e·sinh H − H  — วัตถุจากนอกระบบสุริยะ */
function keplerH(M, e) {
  let H = Math.asinh(M / e);
  for (let k = 0; k < 80; k++) {
    let d = (e * Math.sinh(H) - H - M) / (e * Math.cosh(H) - 1);
    if (Math.abs(d) > 1) d = Math.sign(d);
    H -= d;
    if (Math.abs(d) < 1e-13) break;
  }
  return H;
}

/* หมุนพิกัดในระนาบวงโคจร (x ชี้ไปจุดใกล้ที่สุด) เข้าสู่พิกัดสุริยวิถี */
function perifocal(xp, yp, wDeg, iDeg, omDeg, out) {
  const w = wDeg * DEG, i = iDeg * DEG, n = omDeg * DEG;
  const cw = Math.cos(w), sw = Math.sin(w), cn = Math.cos(n), sn = Math.sin(n),
        ci = Math.cos(i), si = Math.sin(i);
  out.x = ((cw * cn - sw * sn * ci) * xp + (-sw * cn - cw * sn * ci) * yp) * AU;
  out.y = ((cw * sn + sw * cn * ci) * xp + (-sw * sn + cw * cn * ci) * yp) * AU;
  out.z = ((sw * si) * xp + (cw * si) * yp) * AU;
  return out;
}

/* ตำแหน่งวัตถุขนาดเล็ก: นับมุมจากเวลาที่ผ่านจุดใกล้ดวงอาทิตย์สุด (tp)
   M = n × (JD − tp) ใช้ได้ทั้งวงรีและไฮเพอร์โบลา */
function smallPos(def, ms, out) {
  const E = def.el;
  const M = E.n * (2451545 + days(ms) - E.tp) * DEG;
  let xp, yp;
  if (E.e < 1) {
    const Ecc = keplerE(M, E.e);
    xp = E.a * (Math.cos(Ecc) - E.e);
    yp = E.a * Math.sqrt(1 - E.e * E.e) * Math.sin(Ecc);
  } else {
    const A = Math.abs(E.a), H = keplerH(M, E.e);
    xp = A * (E.e - Math.cosh(H));
    yp = A * Math.sqrt(E.e * E.e - 1) * Math.sinh(H);
  }
  return perifocal(xp, yp, E.w, E.i, E.om, out);
}

/* ยานอวกาศ: ปกติใช้สูตรเดียวกับวัตถุขนาดเล็ก ยกเว้นลำที่ประจำอยู่จุดสมดุล L2
   ของระบบดวงอาทิตย์–โลก ซึ่งต้องอ้างจากตำแหน่งโลกโดยตรง (จึงต้องเรียกหลังโลก) */
function craftPos(def, ms, out) {
  if (def.special !== 'l2') return smallPos(def, ms, out);
  const e = worldOf('earth');
  const r = Math.sqrt(e.x * e.x + e.y * e.y + e.z * e.z);
  const k = 1 + 1.5e6 / r;                   // L2 ไกลจากดวงอาทิตย์กว่าโลก 1.5 ล้าน กม.
  out.x = e.x * k; out.y = e.y * k; out.z = e.z * k;
  // ของจริงไม่ได้นิ่งอยู่ที่จุดนั้น แต่วนรอบจุดเป็นวงกว้างราว 8 แสน กม. คาบราวครึ่งปี
  const a = days(ms) / 182.6 * 2 * Math.PI;
  out.x += (-e.y / r) * 4.0e5 * Math.cos(a);
  out.y += (e.x / r) * 4.0e5 * Math.cos(a);
  out.z += 2.0e5 * Math.sin(a);
  return out;
}

/* ΔT = TT − UT (วินาที) — นาฬิกาปรมาณูเดินเร็วกว่าการหมุนของโลก
   ดวงจันทร์เดินราว 1 กม./วินาที ถ้าไม่ชดเชย 69 วินาที เงาจะคลาดราว 70 กม.
   ค่า 1950–2025 จากการวัดจริง (IERS) หลังจากนั้นเป็นการประมาณ ก่อนหน้าใช้สูตรระยะยาวของ Espenak–Meeus */
const DELTA_T = [1950, 29.1, 1955, 31.1, 1960, 33.2, 1965, 35.7, 1970, 40.2, 1975, 45.5, 1980, 50.5,
                 1985, 54.3, 1990, 56.9, 1995, 60.8, 2000, 63.8, 2005, 64.7, 2010, 66.1, 2015, 67.6,
                 2020, 69.4, 2025, 69.2];
function deltaT(ms) {
  const y = 2000 + days(ms) / 365.25;
  const n = DELTA_T.length;
  if (y <= DELTA_T[0]) { const u = (y - 1820) / 100; return -20 + 32 * u * u - 4.98; }
  if (y >= DELTA_T[n - 2]) { const k = y - DELTA_T[n - 2]; return DELTA_T[n - 1] + 0.3 * k + 0.004 * k * k; }
  for (let i = 0; i < n - 2; i += 2) {
    if (y < DELTA_T[i + 2]) {
      const f = (y - DELTA_T[i]) / (DELTA_T[i + 2] - DELTA_T[i]);
      return DELTA_T[i + 1] + (DELTA_T[i + 3] - DELTA_T[i + 1]) * f;
    }
  }
  return DELTA_T[n - 1];
}

/* T = ศตวรรษจูเลียนนับจาก J2000 ในเวลา TT → ลองจิจูด/ละติจูด (เรเดียน) กับวิษุวัตของวันนั้น + ระยะ (กม.) */
function moonEclDate(T) {
  const T2 = T * T, T3 = T2 * T, T4 = T3 * T;
  const Lp = (218.3164477 + 481267.88123421 * T - 0.0015786 * T2 + T3 / 538841 - T4 / 65194000) * DEG;
  const D  = (297.8501921 + 445267.1114034 * T - 0.0018819 * T2 + T3 / 545868 - T4 / 113065000) * DEG;
  const M  = (357.5291092 + 35999.0502909 * T - 0.0001536 * T2 + T3 / 24490000) * DEG;
  const Mp = (134.9633964 + 477198.8675055 * T + 0.0087414 * T2 + T3 / 69699 - T4 / 14712000) * DEG;
  const F  = (93.2720950 + 483202.0175233 * T - 0.0036539 * T2 - T3 / 3526000 + T4 / 863310000) * DEG;
  const A1 = (119.75 + 131.849 * T) * DEG;
  const A2 = (53.09 + 479264.290 * T) * DEG;
  const A3 = (313.45 + 481266.484 * T) * DEG;
  const E = 1 - 0.002516 * T - 0.0000074 * T2;
  const ecc = [1, E, E * E];                   // พจน์ที่มี M ต้องคูณ E ตามจำนวนเท่าของ M
  let sl = 0, sr = 0, sb = 0;
  for (let i = 0; i < MOON_LR.length; i += 6) {
    const m = MOON_LR[i + 1];
    const a = MOON_LR[i] * D + m * M + MOON_LR[i + 2] * Mp + MOON_LR[i + 3] * F;
    const e = ecc[m < 0 ? -m : m];
    sl += MOON_LR[i + 4] * e * Math.sin(a);
    sr += MOON_LR[i + 5] * e * Math.cos(a);
  }
  for (let i = 0; i < MOON_B.length; i += 5) {
    const m = MOON_B[i + 1];
    const a = MOON_B[i] * D + m * M + MOON_B[i + 2] * Mp + MOON_B[i + 3] * F;
    sb += MOON_B[i + 4] * ecc[m < 0 ? -m : m] * Math.sin(a);
  }
  sl += 3958 * Math.sin(A1) + 1962 * Math.sin(Lp - F) + 318 * Math.sin(A2);
  sb += -2235 * Math.sin(Lp) + 382 * Math.sin(A3) + 175 * Math.sin(A1 - F) + 175 * Math.sin(A1 + F)
      + 127 * Math.sin(Lp - Mp) - 115 * Math.sin(Lp + Mp);
  return { lon: Lp + sl * 1e-6 * DEG, lat: sb * 1e-6 * DEG, r: 385000.56 + sr / 1000, sl, sb, sr };
}

/* หมุนพิกัดสุริยวิถีจากวิษุวัตของวันนั้น (T) กลับไปกรอบ J2000 — Meeus สมการ 21.5–21.6
   โดยตั้งยุคเริ่ม = วันนั้น และช่วงเวลา t = −T                                         */
const ARCSEC = DEG / 3600;
function eclDateToJ2000(lon, lat, T) {
  const t = -T, TT = T * T;
  const eta = ((47.0029 - 0.06603 * T + 0.000598 * TT) * t + (-0.03302 + 0.000598 * T) * t * t + 0.00006 * t * t * t) * ARCSEC;
  const Pi = 174.876384 * DEG + (3289.4789 * T + 0.60622 * TT - (869.8089 + 0.50491 * T) * t + 0.03536 * t * t) * ARCSEC;
  const p = ((5029.0966 + 2.22226 * T - 0.000042 * TT) * t + (1.11113 - 0.000042 * T) * t * t - 0.000006 * t * t * t) * ARCSEC;
  const ce = Math.cos(eta), se = Math.sin(eta), cb = Math.cos(lat), sb = Math.sin(lat);
  const s = Math.sin(Pi - lon), c = Math.cos(Pi - lon);
  return [p + Pi - Math.atan2(ce * cb * s - se * sb, cb * c), Math.asin(ce * sb + se * cb * s)];
}

function lunarPos(ms, out) {
  const T = (days(ms) + deltaT(ms) / 86400) / 36525;
  const m = moonEclDate(T);
  const [lon, lat] = eclDateToJ2000(m.lon, m.lat, T);
  const cb = Math.cos(lat);
  out.x = m.r * cb * Math.cos(lon);
  out.y = m.r * cb * Math.sin(lon);
  out.z = m.r * Math.sin(lat);
  return out;
}

/* แกนหมุนของดาว: เวกเตอร์หนึ่งหน่วยในระบบสุริยวิถี */
function axisVector(tiltDeg, nodeDeg) {
  const t = tiltDeg * DEG, n = nodeDeg * DEG;
  return new THREE.Vector3(Math.sin(t) * Math.cos(n), Math.sin(t) * Math.sin(n), Math.cos(t));
}

/* ดวงจันทร์ทั่วไป: วงรีเคปเลอร์ในระนาบศูนย์สูตรของดาวแม่ */
function satellitePos(m, ms, out) {
  const d = days(ms);
  const n = 2 * Math.PI / m.period;
  const Ecc = kepler(n * d + m._phase, m.e);
  const xp = m.a * (Math.cos(Ecc) - m.e), yp = m.a * Math.sqrt(1 - m.e * m.e) * Math.sin(Ecc);
  const ci = Math.cos(m.inc * DEG), si = Math.sin(m.inc * DEG);
  const cn = Math.cos(m.node * DEG), sn = Math.sin(m.node * DEG);
  // หมุนด้วยความเอียงและโหนดภายในระนาบศูนย์สูตรของดาวแม่
  const x1 = xp * cn - yp * ci * sn;
  const y1 = xp * sn + yp * ci * cn;
  const z1 = yp * si;
  const B = m._basis;                       // [i, j, k] ของระนาบศูนย์สูตรดาวแม่
  out.x = B[0].x * x1 + B[1].x * y1 + B[2].x * z1;
  out.y = B[0].y * x1 + B[1].y * y1 + B[2].y * z1;
  out.z = B[0].z * x1 + B[1].z * y1 + B[2].z * z1;
  return out;
}
